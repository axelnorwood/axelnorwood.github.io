<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PE Lesson Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: control rail (left, sticky) + lesson sheet laid out as a minute-by-minute session timeline. Stacks on phones. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --ink: #15202a;
  --muted: #586774;
  --line: #d3dae1;
  --soft: #f4f6f8;
  --brand: #e2512a;
  --sport: #16a34a;
  --sport-ink: var(--sport);
  --sport-soft: color-mix(in oklab, var(--sport) 12%, var(--surface));
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #17212b; --ink: #e6ecf1; --muted: #95a3b0; --line: #2a3744; --soft: #1d2833; --brand: #ff7a52;
    --sport-ink: color-mix(in oklab, var(--sport) 62%, white);
    --sport-soft: color-mix(in oklab, var(--sport) 20%, var(--surface));
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #17212b; --ink: #e6ecf1; --muted: #95a3b0; --line: #2a3744; --soft: #1d2833; --brand: #ff7a52;
  --sport-ink: color-mix(in oklab, var(--sport) 62%, white);
  --sport-soft: color-mix(in oklab, var(--sport) 20%, var(--surface));
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.app { max-width: 1180px; margin: 0 auto; padding-block: 22px 60px; display: grid; grid-template-columns: 330px minmax(0,1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0,1fr); } }

/* Rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 18px; }
@media (max-width: 860px) { .rail { position: static; } }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: .9; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.brand h1 span { color: var(--brand); }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 16px; }
.field { display: grid; gap: 8px; }
.label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.sports { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.sport-btn { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: 11px; font-weight: 600; line-height: 1.15; text-align: center; min-width: 0; }
.sport-btn span { overflow-wrap: anywhere; }
.sport-btn[aria-pressed="true"] { border-color: var(--c); background: color-mix(in oklab, var(--c) 14%, var(--surface)); }
.sport-btn svg { color: var(--c); }
.filters { display: flex; flex-wrap: wrap; gap: 5px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: 14.5px; font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; padding: 8px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 auto; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:active { transform: translateY(1px); }

/* Sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; min-width: 0; }
.sheet-head { padding: 22px 24px 18px; background: var(--sport-soft); border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 500; }
.sheet-title { display: flex; gap: 14px; align-items: center; }
.sheet-title .ico { width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--sport-ink); border: 1px solid var(--line); }
.sheet-title h2 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); line-height: .95; margin: 0; text-transform: uppercase; text-wrap: balance; }
.sheet-title p { margin: 2px 0 0; color: var(--sport-ink); font-weight: 700; }
.intent { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }
@media (max-width: 620px) { .intent { grid-template-columns: minmax(0,1fr); } }
.intent div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.intent h3 { margin: 0 0 6px; }
.intent p, .intent ul { margin: 0; font-size: 14.5px; }
.intent ul { padding-left: 18px; }
.cue { display: inline-block; margin-top: 8px; font-weight: 800; font-style: italic; color: var(--sport-ink); }

/* Timeline bar */
.bar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; gap: 2px; }
.bar div { background: var(--sport); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 500; min-width: 0; overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Phases */
.phases { display: grid; }
.phase { display: grid; grid-template-columns: 86px minmax(0,1fr); border-top: 1px solid var(--line); }
.phase:first-child { border-top: 0; }
.clock { padding: 18px 10px 18px 24px; font-family: var(--mono); font-variant-numeric: tabular-nums; border-right: 1px dashed var(--line); }
.clock .t { font-size: 15px; font-weight: 500; }
.clock .d { font-size: 11.5px; color: var(--muted); }
.ph-body { padding: 16px 22px 18px; display: grid; gap: 10px; min-width: 0; }
.ph-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ph-kind { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--sport-ink); }
.ph-name { font-family: var(--display); font-size: 25px; font-weight: 800; line-height: 1; margin: 2px 0 0; text-transform: uppercase; letter-spacing: .01em; }
.ph-desc { margin: 0; max-width: 64ch; }
.shuffle { border: 1px solid var(--line); background: var(--soft); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.shuffle svg { transition: transform .35s; }
.shuffle:hover svg { transform: rotate(180deg); }
.teach { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: grid; gap: 4px; }
.teach b { font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.adapt { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; font-size: 13.5px; }
@media (max-width: 620px) { .adapt { grid-template-columns: minmax(0,1fr); } .phase { grid-template-columns: minmax(0,1fr); } .clock { border-right: 0; padding: 14px 20px 0; display: flex; gap: 10px; align-items: baseline; } .ph-body { padding: 8px 20px 18px; } }
.adapt div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; }
.adapt .k { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: block; margin-bottom: 2px; }

.sheet-foot { padding: 16px 24px 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; background: var(--soft); }
.gear { display: flex; flex-wrap: wrap; gap: 6px; }
.gear span { font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

.seg.tight button { padding: 7px 0; flex: 1 1 0; min-width: 34px; }
.units { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 6px; }
.units button { text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.units button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.uoi { background: var(--surface); border: 1px dashed var(--sport-ink); border-radius: 12px; padding: 10px 14px; }
.uoi p { margin: 4px 0 0; font-size: 14px; }
.uoi .label { color: var(--sport-ink); }
.assess { padding: 18px 24px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.assess-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 20px; align-items: flex-end; }
.assess-head h3 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1; }
.wk { font-size: 13px; color: var(--muted); max-width: 46ch; }
.wk b { color: var(--ink); }
.objs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 300px; overflow-y: auto; }
.obj { width: 100%; display: grid; grid-template-columns: 22px auto minmax(0,1fr); gap: 10px; align-items: start; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 7px 8px; font-size: 14px; }
.obj:hover { background: var(--soft); }
.obj[aria-pressed="true"] { background: var(--sport-soft); border-color: color-mix(in oklab, var(--sport) 40%, transparent); }
.obj-box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.obj[aria-pressed="true"] .obj-box { background: var(--sport); border-color: var(--sport); color: #fff; }
.obj-code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
@media (max-width: 720px) { .ladder { grid-template-columns: minmax(0,1fr); } }
.rung { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.rung p { margin: 3px 0 0; }
.rung.r1 { border-color: var(--sport-ink); }
.umap ol { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
@media (max-width: 620px) { .umap ol { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.umap button { width: 100%; display: grid; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 9px; font-size: 12px; min-width: 0; }
.umap button span { overflow-wrap: anywhere; }
.umap button em { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.umap button[aria-pressed="true"] { border-color: var(--sport-ink); background: var(--sport-soft); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 30; }
.flash { animation: flash .5s ease; }
@keyframes flash { from { background: var(--sport-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .shuffle svg { transition: none; } }
textarea.copybox { width: 100%; height: 160px; font-family: var(--mono); font-size: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); padding: 10px; }
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div>
      <div class="brand"><h1>PE Lesson <span>Builder</span></h1></div>
      <p class="tagline">Pick your grade, unit and week. Get a timed lesson linked to the K3–G5 tracker objectives, the PE standards and your UOI units.</p>
    </div>
    <div class="panel">
      <div class="field"><span class="label">Grade</span><div class="seg tight" id="grades"></div></div>
      <div class="field"><span class="label">School PE unit</span><div class="units" id="units"></div></div>
      <div class="field">
        <span class="label">Activity</span>
        <div class="filters" id="filters" hidden></div>
        <div class="sports" id="sports"></div>
      </div>
      <div class="field"><label class="label" for="skill">Focus skill</label><select id="skill"></select></div>
      <div class="field"><span class="label">Unit week</span><div class="seg tight" id="weeks"></div></div>
      <div class="field"><span class="label">Lesson length (minutes)</span><div class="seg" id="mins"></div></div>
      <div class="field"><span class="label">Class level</span><div class="seg" id="level"></div></div>
      <div class="actions">
        <button class="btn primary" id="regen">New lesson</button>
        <button class="btn" id="copy">Copy plan</button>
      </div>
      <div id="copyFallback" hidden>
        <p class="note">Copying is blocked here. Select the text below and copy it.</p>
        <textarea class="copybox" id="copyText" readonly></textarea>
      </div>
    </div>
  </aside>

  <main class="sheet" id="sheet"></main>
</div>
<div id="toastRoot"></div>

<script>
"use strict";

    teamwork:'<g '+P+'><circle cx="7" cy="6" r="1.8"/><circle cx="17" cy="6" r="1.8"/><path d="M7 8v6M17 8v6M7 10.5h10M7 14l-2 6M7 14l2 6M17 14l-2 6M17 14l2 6"/></g>',
    parachute:'<g '+P+'><path d="M3 11a9 7 0 0 1 18 0"/><path d="M3 11c1.5 1.2 3 1.2 4.5 0 1.5 1.2 3 1.2 4.5 0 1.5 1.2 3 1.2 4.5 0 1.5 1.2 3 1.2 4.5 0"/><path d="M5 12l6 8M19 12l-6 8"/><circle cx="12" cy="20" r="1.3" fill="'+color+'" stroke="none"/></g>',

    ctf:'<g '+P+'><path d="M6 21V3"/><path d="M6 4h12l-3 4 3 4H6" fill="'+color+'" fill-opacity=".25"/><path d="M3 21h6"/></g>',
    volleyball:'<g '+P+'><circle cx="12" cy="12" r="9"/><path d="M12 3c-1.5 4-.5 7 3 9M12 12c-3 2.2-6.5 2.4-9 1M12 12c.5 4 3.5 6.5 7.5 5.5"/></g>',
    tabletennis:'<g '+P+'><circle cx="10" cy="10" r="6"/><path d="M14.3 14.3l5 5"/><circle cx="19" cy="5.5" r="1.6" fill="'+color+'" stroke="none"/></g>',
    flagfootball:'<g '+P+'><ellipse cx="10" cy="14" rx="7" ry="4.3" transform="rotate(-30 10 14)"/><path d="M7.8 15l4-2.6"/><path d="M17 3v8"/><path d="M17 3.2l4 1.6-4 1.6" fill="'+color+'"/></g>',
    tag:'<g '+P+'><circle cx="15" cy="4.5" r="1.7"/><path d="M15 6.5l-2 5.5 3 2v5.5M13 12l-3 3.5M15 8.5l3.5 2M15 8.5l-3.5 1"/><path d="M2.5 9h4M2 13h4.5M3 17h3.5"/></g>',
    dodgeball:'<g '+P+'><circle cx="15" cy="12" r="6"/><path d="M12 7.5c2 2 2 7 0 9"/><path d="M2.5 9h5M2 12h5M2.5 15h5"/></g>',
    jumprope:'<g '+P+'><circle cx="12" cy="4.5" r="1.6"/><path d="M12 6.2v5.3M12 8l-3 2M12 8l3 2M12 11.5l-2 4M12 11.5l2 4"/><path d="M8 10c-4 4-3 10 4 10s8-6 4-10"/></g>',
    relay:'<g '+P+'><rect x="9.5" y="2.5" width="5" height="12" rx="2.5" transform="rotate(40 12 8.5)"/><path d="M3 17.5h18M3 21h18"/></g>',
    tobibako:'<g '+P+'><path d="M6 20.5l1.6-12h8.8l1.6 12z"/><path d="M6.6 16.5h10.8M7.1 12.5h9.8"/><path d="M8.5 8.5c0-2.5 7-2.5 7 0"/></g>',

  if (list.length > 1) { var o = S.pick[k]; while (S.pick[k] === o) S.pick[k] = rnd(list.length); }
  if (pool && (k === "solo" || k === "partner" || k === "game")) { var t = S.pick[k + "T"]; if (pool.length > 1) while (S.pick[k + "T"] === t) S.pick[k + "T"] = rnd(pool.length); }
  if (k === "warm") S.pick.str = rnd(sp.strength.length);
}
if (!S.pick || S.pick.warm == null) rollAll();

function minutes() {
  var sp = SPLITS[S.level] || SPLITS.Developing, out = {}, used = 0;
  ORDER.forEach(function (k, i) {
    if (i === ORDER.length - 1) return;
    out[k] = Math.max(2, Math.round(S.mins * sp[k])); used += out[k];
  });
  out.cool = Math.max(2, S.mins - used);
  return out;
}

function build() {
  var sp = sport(), sk = sp.skills[S.skill] || sp.skills[0], m = minutes(), t = 0, phases = [];
  ORDER.forEach(function (k) {
    var p = { k: k, kind: KIND[k], start: t, mins: m[k] }; t += m[k];
    var i = S.pick[k] % listFor(k, sp).length;
    if (k === "warm") { var w = POOLS.warm[i]; p.name = w[0]; p.desc = fill(w[1], sp); p.teach = ["Body check", fitnessPrompt()]; p.tags = ["Captivate","Control"]; }
    else if (k === "intro") { var it = POOLS.intro[i]; p.name = sk[0]; p.desc = "Introduce today's focus using the cue below. Share the tracker objectives in student-friendly words."; p.teach = [it[0], fill(it[1], sp)]; p.tags = it[2]; p.cue = sk[1]; }
    else if (k === "cool") { var c = POOLS.cool[i]; p.name = "Stretch & Reflect"; p.desc = "Slow walk, then stretch calves, quads and shoulders. Breathe in for 4, out for 4. Evaluating focus: " + evalPrompt(); p.teach = [c[0], c[1]]; p.tags = c[2]; }
    else { var d = listFor(k, sp)[i], pool = POOLS[k], tm = pool[S.pick[k + "T"] % pool.length]; p.name = d[0]; p.desc = d[1] + ". Keep the cue “" + sk[1] + "” in every rep."; p.builds = d[2]; p.teach = [tm[0], tm[1]]; p.tags = tm[2]; }
    p.easier = fill(ADAPT[k][0], sp); p.harder = fill(ADAPT[k][1], sp);
    phases.push(p);
  });
  return { sp: sp, sk: sk, phases: phases };
}

/* ---------- Render ---------- */
function seg(id, items, cur, attr) {
  document.getElementById(id).innerHTML = items.map(function (v) {
    var val = Array.isArray(v) ? v[0] : v, lab = Array.isArray(v) ? v[1] : v;
    return '<button aria-pressed="' + (String(val) === String(cur)) + '" data-' + attr + '="' + esc(val) + '">' + esc(lab) + '</button>';
  }).join("");
}
function renderControls() {
  seg("grades", GRADES, S.grade, "grade");
  seg("units", UNITS.map(function (u) { return [u.id, u.name]; }), S.unit, "unit");
  var u = unit(), all = u.id === "other";
  document.getElementById("filters").hidden = !all;
  if (all) seg("filters", GROUPS, S.group, "group");
  var list = all ? SPORTS.filter(function (s) { return S.group === "All" || (GROUP_OF[s.id] || []).indexOf(S.group) > -1; })
                 : u.sports.map(function (id) { return SPORTS.filter(function (s) { return s.id === id; })[0]; });
  document.getElementById("sports").innerHTML = list.map(function (s) {
    return '<button class="sport-btn" style="--c:' + s.accent + '" aria-pressed="' + (s.id === S.sport) + '" data-sport="' + s.id + '">' + sportIcon(s.id, 22) + '<span>' + esc(s.name) + '</span></button>';
  }).join("");
  var sp = sport();
  document.getElementById("skill").innerHTML = sp.skills.map(function (k, i) { return '<option value="' + i + '"' + (i == S.skill ? " selected" : "") + '>' + esc(k[0]) + '</option>'; }).join("");
  seg("weeks", [1,2,3,4,5,6], S.week, "week");
  seg("mins", [20,25,30,40,45,60], S.mins, "mins");
  seg("level", LEVELS, S.level, "level");
}

function renderSheet(flashKey) {
  var L = build(), sp = L.sp, sk = L.sk, u = unit(), objs = objectives(), chosen = chosenObj().map(function (o) { return o.id; });
  document.documentElement.style.setProperty("--sport", sp.accent);
  var bar = L.phases.map(function (p, i) {
    var op = [1, .82, .68, .82, 1, .6][i];
    return '<div style="flex:' + p.mins + ';opacity:' + op + '" title="' + esc(p.kind) + '">' + p.mins + '</div>';
  }).join("");
  var uoi = UOI[S.grade + "|" + S.unit];
  var uoiHTML = uoi ? '<div class="uoi"><span class="label">UOI link · ' + esc(uoi.theme) + '</span><p>' + esc(uoi.text) + '</p></div>' : "";
  var wk = weekNote();
  var objHTML = objs.map(function (o) {
    var on = chosen.indexOf(o.id) > -1;
    return '<li><button class="obj" aria-pressed="' + on + '" data-obj="' + o.id + '"><span class="obj-box">' + (on ? "✓" : "") + '</span><span class="obj-code">' + esc(o.code) + '</span><span class="obj-text">' + esc(o.text) + '</span></button></li>';
  }).join("");
  var lad = ladder().map(function (r, i) { return '<div class="rung r' + i + '"><span class="label">' + r[0] + '</span><p>' + esc(r[1]) + '</p></div>'; }).join("");
  var source = isEY() ? "PE Objectives · 3–5 years" : (area() === "ATH" ? "PE Standards · " + YEAR_NAME[YEAR_IDX[S.grade]] + " (no tracker strand)" : S.grade + " PE Tracker · " + areaLabel(area()) + (u.area2 ? " + " + areaLabel(u.area2) : ""));

  var phases = L.phases.map(function (p) {
    var teach = p.teach ? '<div class="teach"><span class="label">' + (p.k === "warm" ? "Health & fitness talk" : "Teaching move") + '</span><div><b>' + esc(p.teach[0]) + '.</b> ' + esc(p.teach[1]) + '</div></div>' : "";
    var cue = p.cue ? '<span class="cue">Cue: “' + esc(p.cue) + '”</span>' : "";
    var builds = p.builds ? '<span class="tag" style="color:var(--sport-ink);border-color:var(--sport-ink)">Builds: ' + esc(p.builds) + '</span>' : "";
    var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("");
    return '<section class="phase' + (flashKey === p.k ? " flash" : "") + '">' +
      '<div class="clock"><div class="t">' + p.start + '′</div><div class="d">' + p.mins + ' min</div></div>' +
      '<div class="ph-body">' +
        '<div class="ph-top"><div><div class="ph-kind">' + p.kind + '</div><h3 class="ph-name">' + esc(p.name) + '</h3></div>' +
        '<button class="shuffle" data-roll="' + p.k + '" aria-label="Swap ' + esc(p.kind) + '">' + shuffleIcon + 'Swap</button></div>' +
        '<p class="ph-desc">' + esc(p.desc) + '</p>' + cue + teach +
        '<div class="tags">' + builds + tags + '</div>' +
        '<div class="adapt"><div><span class="k">Make it easier</span>' + esc(p.easier) + '</div><div><span class="k">Make it harder</span>' + esc(p.harder) + '</div></div>' +
      '</div></section>';
  }).join("");

  var unitMap = u.id === "other" ? "" : '<div class="umap"><span class="label">Unit map · tap a week</span><ol>' + [1,2,3,4,5,6].map(function (w) {
    var s = sp.skills[Math.min(w - 1, sp.skills.length - 1)][0];
    var note = w === 1 ? "Baseline" : w >= 5 ? "Assess" : "Build";
    return '<li><button data-week="' + w + '" aria-pressed="' + (w === S.week) + '"><b>Wk ' + w + '</b><span>' + esc(s) + '</span><em>' + note + '</em></button></li>';
  }).join("") + '</ol></div>';

  document.getElementById("sheet").innerHTML =
    '<header class="sheet-head">' +
      '<div class="meta-row"><span><b>' + S.grade + '</b></span><span>' + esc(u.id === "other" ? "Any sport" : u.name) + '</span><span>Week <b>' + S.week + '</b> of 4–6</span><span><b>' + S.mins + '</b> min</span><span>' + S.level + '</span></div>' +
      '<div class="sheet-title"><span class="ico">' + sportIcon(sp.id, 30, 1.9) + '</span><div><h2>' + esc(sp.name) + ': ' + esc(sk[0]) + '</h2><p>' + esc(sp.tag) + '</p></div></div>' +
      uoiHTML +
      '<div class="intent">' +
        '<div><h3 class="label">Learning intention</h3><p>Today we are working on <b>' + esc(sk[0]) + '</b>, using the cue to guide every rep.</p><span class="cue">“' + esc(sk[1]) + '”</span></div>' +
        '<div><h3 class="label">Success criteria: I can…</h3><ul>' + sk[2].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></div>' +
      '</div>' +
      '<div class="bar" role="img" aria-label="Minutes per phase">' + bar + '</div>' +
    '</header>' +
    '<section class="assess">' +
      '<div class="assess-head"><div><span class="label">Assess this lesson</span><h3>' + esc(source) + '</h3></div><div class="wk"><b>' + wk[0] + '.</b> ' + esc(wk[1]) + '</div></div>' +
      '<p class="note">Tap to choose the objectives you will watch for today. Two are suggested for week ' + S.week + '.</p>' +
      '<ul class="objs">' + objHTML + '</ul>' +
      '<div class="ladder">' + lad + '</div>' +
      '<p class="note">Tracker scoring: 1 = initial evidence · 2 = about 50% independent · 3 = consolidated (most of the time, independently and correctly). Update weekly, at least by the last day of each month.</p>' +
    '</section>' +
    '<div class="phases">' + phases + '</div>' +
    '<footer class="sheet-foot">' + unitMap + '<span class="label">Equipment</span><div class="gear">' + sp.equipment.map(function (e) { return '<span>' + esc(e) + '</span>'; }).join("") + '</div>' +
    '<p class="note">Easier/harder ideas use STEP: change the Space, Task, Equipment or People. Tags show which of the 7 Cs each phase leans on.</p></footer>';
}

function planText() {
  var L = build(), u = unit(), out = [], uoi = UOI[S.grade + "|" + S.unit];
  out.push(S.grade + " PE · " + (u.id === "other" ? "Any sport" : u.name) + " · Week " + S.week + " · " + S.mins + " min");
  out.push(L.sp.name.toUpperCase() + ": " + L.sk[0]);
  if (uoi) out.push("UOI link (" + uoi.theme + "): " + uoi.text);
  out.push("Learning intention: Today we are working on " + L.sk[0] + ", using the cue to guide every rep.");
  out.push("Cue: \"" + L.sk[1] + "\"");
  out.push("Success criteria: " + L.sk[2].join("; "));
  out.push("Assessment objectives:");
  chosenObj().forEach(function (o) { out.push("  [" + o.code + "] " + o.text); });
  ladder().forEach(function (r) { out.push("  " + r[0] + ": " + r[1]); });
  out.push("Equipment: " + L.sp.equipment.join(", "));
  out.push("");
  L.phases.forEach(function (p) {
    out.push(p.start + "–" + (p.start + p.mins) + " min | " + p.kind.toUpperCase() + ": " + p.name);
    out.push("  " + p.desc);
    if (p.teach) out.push("  " + (p.k === "warm" ? "Health talk" : "Teaching move") + ": " + p.teach[0] + ". " + p.teach[1]);
    out.push("  Easier: " + p.easier + "  Harder: " + p.harder);
  });
  return out.join("\n");
}

function toast(msg) {
  var r = document.getElementById("toastRoot");
  r.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(function () { r.innerHTML = ""; }, 2000);
}
function refresh(flash) { renderControls(); renderSheet(flash); save(); }
function setSport(id) { S.sport = id; S.skill = Math.min(S.week - 1, sport().skills.length - 1); rollAll(); }

document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  var d = b.dataset;
  if (d.grade) { S.grade = d.grade; S.level = defaultLevel(S.grade); S.mins = defaultMins(S.grade); S.obj = null; refresh(); }
  else if (d.unit) { S.unit = d.unit; var u = unit(); if (u.sports) setSport(u.sports[0]); S.obj = null; refresh(); }
  else if (d.group) { S.group = d.group; refresh(); }
  else if (d.sport) { setSport(d.sport); if (unit().id === "other") S.obj = null; refresh(); }
  else if (d.week) { S.week = +d.week; S.skill = Math.min(S.week - 1, sport().skills.length - 1); S.obj = null; refresh(); }
  else if (d.mins) { S.mins = +d.mins; refresh(); }
  else if (d.level) { S.level = d.level; refresh(); }
  else if (d.obj) {
    var cur = chosenObj().map(function (o) { return o.id; }), i = cur.indexOf(d.obj);
    if (i > -1) { if (cur.length > 1) cur.splice(i, 1); } else cur.push(d.obj);
    S.obj = cur; refresh();
  }
  else if (d.roll) { roll(d.roll); refresh(d.roll); }
  else if (b.id === "regen") { rollAll(); refresh(); toast("New lesson ready"); }
  else if (b.id === "copy") {
    var txt = planText();
    try {
      navigator.clipboard.writeText(txt).then(function () { document.getElementById("copyFallback").hidden = true; toast("Lesson copied"); }, function () { showFallback(txt); });
    } catch (err) { showFallback(txt); }
  }
});
function showFallback(txt) {
  var fb = document.getElementById("copyFallback"), ta = document.getElementById("copyText");
  ta.value = txt; fb.hidden = false; ta.focus(); ta.select();
}
document.getElementById("skill").addEventListener("change", function (e) { S.skill = +e.target.value; refresh(); });

refresh();
</script>
