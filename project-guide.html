:"Build a tiny magical home!","need":["Sticks and bark","Leaves and moss","Glue","A small base"],"steps":["Find sticks, leaves, and bark.","Build little walls on a base.","Add a roof of bark or leaves.","Make a tiny door and windows.","Decorate with flowers and pebbles!"],"tip":"Add a little path made of tiny stones.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Design a tiny magical home."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Gather materials and build."}]}],"t":"1 hour","g":"Just me","lv":1,"d":["Only take things that have already fallen to the ground.","Push sticks into a lump of clay to help them stand.","Overlap the pieces like roof tiles so 'rain' runs off.","An acorn cap makes a great door handle.","Think about what a tiny creature would want in a home."],"safe":"Don't pick living plants or peel bark from trees.","up":"Build a whole fairy village with a friend and connect the houses with paths.","q":["Who lives in your house? Tell their story.","Which natural material was best for building?"]},{"id":"boat","icon":"⛵","name":"Simple Boat","blurb":"Build a boat that floats!","need":["Foil, cork, or foam","Tape","A bowl of water","Small weights"],"steps":["Build a boat shape from foil or foam.","Float it in a bowl of water.","Add small weights one at a time.","See how much it holds before sinking.","Try a new design to hold more!"],"tip":"A wide, flat boat holds more than a skinny one.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Design a boat that floats."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Test how much it holds."}]}],"t":"45 min","g":"Me or a partner","lv":2,"d":["Fold the edges up to make walls that keep water out.","Place it gently on the water. Does it tip?","Coins, marbles, or paper clips work well. Count as you go.","Write down your number. That's your score to beat!","Change just one thing, like the shape or the height of the walls."],"safe":"Wipe up spills right away so no one slips.","up":"Add a sail and blow your boat across the bowl. Time it!","q":["Which design held the most, and why do you think so?","What did you change in your second boat?"]},{"id":"windmill","icon":"🌬️","name":"Windmill","blurb":"Build a spinner that catches wind!","need":["Paper","A pin or stick","A pencil with an eraser","Scissors"],"steps":["Cut a paper square.","Cut from each corner toward the middle.","Fold every other point to the center.","Pin it to a pencil eraser.","Blow on it or hold it in the wind!"],"tip":"Try different sizes to see which spins fastest.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Design a wind catcher."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Test which spins fastest."}]}],"t":"30 min","g":"Just me","lv":2,"d":["About as wide as your hand is a good size.","Stop cutting a thumb-width before the middle.","Don't crease the folds. Soft curves catch more wind.","Leave it a little loose so it can spin freely.","Try blowing from the front and from the side."],"safe":"Ask a grown-up to push the pin in and cover the sharp end.","up":"Test paper, card, and foil. Which material spins fastest?","q":["What makes your windmill spin?","How do real windmills help people?"]},{"id":"kite","icon":"🪁","name":"Build a Kite","blurb":"Make a kite and fly it!","need":["A plastic bag or paper","Thin sticks","String","Tape","A windy day"],"steps":["Make a diamond frame with sticks.","Cover it with a bag or paper.","Tape the edges down.","Tie on a long string and a tail.","Run outside and fly it!"],"tip":"Fly it in an open space away from trees and wires.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Design a kite that flies."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Test it and adjust the tail."}]}],"t":"2 hours","g":"Me or a partner","lv":3,"d":["Tie one long stick and one shorter stick into a cross.","Cut it a little bigger than the frame and fold the edges over.","Tape all the way along so wind can't sneak under.","The tail keeps the kite steady. Try ribbon about as long as your body.","Hold it up, let the wind catch it, and let the string out slowly."],"safe":"Never fly near roads, trees, or power lines, or in a storm.","up":"Try a longer and a shorter tail. Which flies steadier?","q":["What did the tail do for your kite?","What would you change to make it fly higher?"]},{"id":"greenhouse","icon":"🏡","name":"Mini Greenhouse","blurb":"Grow plants in a clear box!","need":["A clear plastic container","Soil","Seeds","Water"],"steps":["Put soil in a clear container.","Plant your seeds.","Water them a little.","Close the lid to keep it warm.","Watch your seeds sprout inside!"],"tip":"Open the lid sometimes for fresh air.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Watch how seeds sprout."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Check on it over time."}]}],"t":"2+ weeks","g":"Just me","lv":1,"d":["A clear salad box or a cut bottle works great.","Cress, beans, and lettuce sprout quickly.","The soil should be damp like a wrung-out sponge.","The lid traps warmth and water, like a real greenhouse.","Look for tiny water drops on the lid. That's the water cycle!"],"safe":"","up":"Plant the same seeds in an open pot and compare which sprouts first.","q":["Why do seeds sprout faster in a greenhouse?","Where did the water drops on the lid come from?"]}],"games":[{"id":"boardgame","icon":"🎲","name":"Invent a Board Game","blurb":"Make a game with your own rules!","need":["Cardboard","Markers","Dice","Small game pieces"],"steps":["Think of an idea, like a race to treasure.","Draw a path with spaces.","Make up the rules.","Add pieces and dice.","Play it and fix tricky parts!"],"tip":"Add 'lucky' and 'oops' spaces for surprises.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent your own game."},{"name":"Critical thinking","note":"Make rules that make sense."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Test it by playing together."}]}],"t":"2–3 days","g":"Me or a partner","lv":2,"d":["Your theme could be space, pirates, jungle, or your school!","Make 20 to 30 spaces with a clear START and FINISH.","Write the rules down in order: how to move, how to win.","Use buttons, erasers, or clay figures as pieces.","Watch where players get confused and rewrite that rule."],"safe":"","up":"Add a deck of challenge cards with questions or dares.","q":["What makes a game fun to play again and again?","What rule did you change after testing?"]},{"id":"cardboardgame","icon":"📦","name":"Cardboard Arcade Game","blurb":"Build an arcade game from cardboard!","need":["Cardboard boxes","Tape and glue","Markers","Balls or beanbags"],"steps":["Pick a game, like a ball toss or claw machine.","Build it from cardboard boxes.","Cut holes or targets (ask a grown-up).","Decorate it with bright colors.","Let friends play your game!"],"tip":"Make tickets and prizes for a real arcade feel.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent an arcade game."},{"name":"Critical thinking","note":"Make it work and be fun."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Build it step by step."}]}],"t":"2–3 days","g":"Small team","lv":3,"d":["Simple games work best: ball toss, ring toss, or skee-ball.","Tape boxes from the inside so it looks neat.","Make some targets small and worth more points.","Add the game's name and the points for each target.","Stand behind a line so the challenge is the same for everyone."],"safe":"A grown-up should do the cutting with a craft knife.","up":"Host a class arcade and invite another class to play.","q":["How did you make the game not too easy and not too hard?","What did players enjoy most?"]},{"id":"maze","icon":"🌀","name":"Design a Maze","blurb":"Make a maze for friends to solve!","need":["Paper","A pencil","A ruler"],"steps":["Mark a START and a FINISH.","Draw the correct path first.","Add fake paths and dead ends.","Erase any spots that give it away.","Give it to a friend to solve!"],"tip":"Make a big one on cardboard for marbles.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan paths and dead ends."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Make it clear for others."}]}],"t":"30 min","g":"Just me","lv":1,"d":["Put them far apart, like opposite corners.","Make it twisty! Draw lightly in pencil.","Dead ends that go a long way are the trickiest.","Trace the walls in pen when you're happy with it.","Time them, then try each other's mazes."],"safe":"","up":"Add a key to collect on the way that players must reach before the finish.","q":["How did you make your maze tricky but possible?","What did you notice when someone solved it?"]},{"id":"outdoorsport","icon":"🏃","name":"Invent an Outdoor Sport","blurb":"Make up your own sport or game!","need":["An open space","Balls, cones, or chalk","Friends"],"steps":["Think of how to score points.","Make up simple, fair rules.","Mark the play area with cones or chalk.","Teach your friends the rules.","Play, then fix rules that don't work!"],"tip":"Keep rules simple so everyone can join in fast.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent a new game."},{"name":"Critical thinking","note":"Make fair rules."}]},{"cat":"Communication","subs":[{"name":"Speaking","note":"Teach the rules clearly."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Play fair together."}]}],"t":"1 hour","g":"Small team","lv":2,"d":["Will players throw, kick, run, or hop to score?","Three to five rules is enough to start.","Make sure the space is big enough for everyone to move.","Show the game as well as explaining it.","After one round, ask: 'What would make this better?'"],"safe":"Check the ground is clear and agree on a 'stop' signal.","up":"Give your sport a name, a team cheer, and a scoreboard.","q":["Were your rules fair for everyone? How do you know?","What rule did you change and why?"]},{"id":"obstacle","icon":"🧗","name":"Obstacle Course","blurb":"Build a course to run through!","need":["Cones or chairs","Hula hoops","Ropes","An open space"],"steps":["Find a safe, open space.","Set up things to jump, crawl, and run around.","Walk through it slowly first.","Time each other going through.","Cheer everyone on!"],"tip":"Add a silly station, like spinning around 3 times.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Set up and try the course."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Cheer each other on."}]}],"t":"1 hour","g":"Small team","lv":1,"d":["Check for anything sharp or slippery first.","Mix it up: one balance, one crawl, one jump, one zigzag.","A slow walk shows if anything is too hard or unsafe.","Try to beat your own time, not just other people's.","High-fives at the finish line for everybody."],"safe":"One person on the course at a time. No climbing on furniture.","up":"Draw a map of your course with arrows and station names.","q":["Which station was the most challenging?","How did you encourage your teammates?"]},{"id":"miniolympics","icon":"🥇","name":"Mini Olympics","blurb":"Compete in fun, friendly events!","need":["An open space","Simple gear","Paper medals"],"steps":["Plan a few fun events, like a hop race.","Make teams.","Explain the rules.","Cheer and play fair.","Give out paper medals to everyone!"],"tip":"Make sure every event is safe and fun for all.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Play fair on a team."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Plan and run the events."}]}],"t":"2–3 days","g":"Whole class","lv":2,"d":["Mix running, throwing, and silly events so everyone can shine.","Make teams fair, with a mix of skills on each.","Show each event once so everyone understands.","Shake hands or bump elbows after each event.","Give medals for teamwork and effort as well as winning."],"safe":"Warm up first and have water nearby.","up":"Hold an opening ceremony with team flags and a parade.","q":["What does 'playing fair' mean to you?","How did you support someone on another team?"]},{"id":"treasurehunt","icon":"🗺️","name":"Treasure Hunt","blurb":"Hide clues that lead to treasure!","need":["Paper for clues","A small prize","Pencils"],"steps":["Pick a hiding spot for the treasure.","Write clues that point to the next clue.","Hide the clues around the area.","Give the first clue to your friends.","Watch them find the treasure!"],"tip":"Make clues with riddles or simple maps.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan clues in the right order."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Write clues others can solve."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["Choose somewhere safe that's not too easy to spot.","Work backwards from the treasure so the order is right.","Number the back of each clue in case one goes missing.","Read it together and let them work it out.","Stay quiet. No hints unless they're really stuck!"],"safe":"Hide clues only in places that are safe and allowed.","up":"Write one clue in a secret code and give hunters the key.","q":["Which clue was the cleverest?","What would make the next hunt even better?"]},{"id":"gameday","icon":"🎮","name":"Game Day","blurb":"Teach and play games all day!","need":["Board games or outdoor games","A space to play"],"steps":["Each person brings a favorite game.","Make small groups.","Teach your game to your group.","Play and have fun.","Switch games to try lots!"],"tip":"Mix quiet games and active games.","atls":[{"cat":"Communication","subs":[{"name":"Speaking","note":"Teach your game to others."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Play fair and have fun."}]}],"t":"2 hours","g":"Whole class","lv":1,"d":["Check that all the pieces are in the box.","Three or four people per group works well.","Explain how to win first, then how to take a turn.","Be a good winner and a good loser.","Use a timer and rotate every 15 minutes."],"safe":"","up":"Make a 'Top Games' chart where everyone rates the games with stars.","q":["How did you explain your game so others understood?","Which new game did you enjoy and why?"]},{"id":"puzzle","icon":"🧩","name":"Class Puzzle","blurb":"Make a big puzzle to solve!","need":["Thick cardboard","Markers","Scissors (ask a grown-up)"],"steps":["Draw a big picture on cardboard.","Color it brightly.","Draw puzzle-piece lines on the back.","Ask a grown-up to cut the pieces.","Mix them up and put it together!"],"tip":"Fewer, bigger pieces are easier for everyone.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan how pieces fit."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Work carefully to make it."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["Fill the whole space, right to the edges.","Lots of different colors make it easier to solve.","Aim for 12 to 20 big pieces with wiggly edges.","Number the back of the pieces lightly in case you get stuck.","Time yourself, then swap puzzles with a friend."],"safe":"Thick cardboard is tough to cut. Leave it to a grown-up.","up":"Make a class puzzle where each person decorates one piece.","q":["What made your puzzle easy or hard to solve?","How did you plan the piece shapes?"]},{"id":"cardgame","icon":"🃏","name":"Invent a Card Game","blurb":"Design your own deck and rules!","need":["Index cards or thick paper","Markers","Scissors","A friend to test with"],"steps":["Pick a theme, like monsters or animals.","Make 20 cards with pictures and numbers.","Decide how to win.","Write the rules on one card.","Play it with a friend and fix what's confusing!"],"tip":"Add a few special cards, like 'skip a turn' or 'swap hands'.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent cards and a theme."},{"name":"Critical thinking","note":"Make rules that are fair."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Write rules others can follow."}]}],"t":"2 hours","g":"Me or a partner","lv":2,"d":["Choose something you could draw 20 different versions of.","Cut all cards the same size so nobody can tell them apart from the back.","Highest number wins? Collect matching pairs? First to empty their hand?","Keep it to 5 rules or fewer.","Play three rounds. If the same person always wins, change a rule."],"safe":"","up":"Design a box for your deck with the game's name and a picture.","q":["How did you make sure your game was fair?","What did your tester help you improve?"]}],"community":[{"id":"recycleproject","icon":"♻️","name":"Recycling Project","blurb":"Help your school recycle more!","need":["Boxes or bins","Paper for signs","Markers"],"steps":["Make recycling bins from boxes.","Make clear signs: paper, cans, plastic.","Put them where everyone sees.","Tell other classes how to use them.","Check the bins and feel proud!"],"tip":"Use pictures on signs so everyone understands.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Help your whole school."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Teach others how to recycle."}]}],"t":"2+ weeks","g":"Whole class","lv":2,"d":["Use strong boxes and paint each a different color.","Glue a real example onto each sign.","Near the door and next to the trash can are good spots.","Give a 2-minute talk or make a short poster.","Count what you collect each week and share the total."],"safe":"Wear gloves when sorting, and no glass or sharp cans.","up":"Make a graph of how much your school recycles each week.","q":["Why does recycling help our planet?","How did you get others to join in?"]},{"id":"craftfair","icon":"🎪","name":"Craft Fair for Charity","blurb":"Make crafts to sell and help others!","need":["Craft supplies","Tables","Price tags","A grown-up helper"],"steps":["Pick crafts to make, like cards or bracelets.","Make lots of them.","Set up tables with price tags.","Sell them at your fair.","Give the money to a good cause!"],"tip":"Pick one charity together so you know who you're helping.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Plan and make the crafts."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Work together to help others."}]}],"t":"2+ weeks","g":"Whole class","lv":3,"d":["Choose things you can make well, lots of times.","Set a goal, like 5 each, and check the quality.","Make prices easy numbers so adding up is simple.","Take turns as sellers, cashiers, and greeters.","Count the money together and write a note to the charity."],"safe":"A grown-up looks after the money box.","up":"Make a poster showing how the money will help.","q":["Who did our fair help, and how?","What did you learn about working with money?"]},{"id":"service","icon":"💗","name":"Community Service","blurb":"Do something kind for your town!","need":["An idea to help","A grown-up helper","Friends"],"steps":["Think about who needs help nearby.","Pick one way to help, like making cards.","Make a plan with a grown-up.","Do your kind project together.","See how good it feels to help!"],"tip":"Even small kind acts make a big difference.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Do something kind for others."}]},{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan the best way to help."}]}],"t":"1 week","g":"Small team","lv":2,"d":["Think about school, neighbors, animals, and nature.","Small ideas work: litter pick-up, thank-you cards, a toy drive.","Write down who does what, when, and what you need.","Take 'before' and 'after' notes or drawings.","Share your project at an assembly to inspire others."],"safe":"Always have a grown-up with you when helping in the community.","up":"Write a thank-you letter to someone who helps your community every day.","q":["Who did you help, and how do you know it mattered?","What else could we do next?"]},{"id":"minilibrary","icon":"📚","name":"Mini Library","blurb":"Start a little lending library!","need":["A box or shelf","Books to share","A sign-out sheet"],"steps":["Find a box or shelf for books.","Ask everyone to bring books to share.","Make a simple sign-out sheet.","Show classmates how to borrow.","Keep it tidy and add new books!"],"tip":"Sort books by type so they're easy to find.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Organize and run the library."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Share books with classmates."}]}],"t":"1 week","g":"Small team","lv":2,"d":["Decorate it so it looks inviting.","Ask families first, and put a name label inside each book.","Columns: name, book title, date out, date back.","Explain the rules: one book at a time, back in one week.","Choose librarians of the week to look after it."],"safe":"","up":"Add 'staff picks': little cards saying why you loved a book.","q":["Which book would you recommend and why?","What makes a library work well for everyone?"]},{"id":"bookexchange","icon":"🔄","name":"Book Exchange","blurb":"Swap books with classmates!","need":["Books to share","A table","Paper for signs"],"steps":["Ask everyone to bring finished books.","Set them on a table.","Make a sign: take one, leave one.","Let everyone pick a new book.","Enjoy your new-to-you book!"],"tip":"Make sure books are gentle and ready to share.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Share books with classmates."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Set up and run the swap."}]}],"t":"1 hour","g":"Whole class","lv":1,"d":["Send a note home so families can help choose.","Sort them into piles: picture books, chapter books, fact books.","Make the sign big and colorful.","Give everyone a ticket for each book they brought.","Leftover books can go to another class or a charity."],"safe":"","up":"Slip a bookmark review inside your book for the next reader.","q":["Why is sharing books a good idea?","What book did you choose and why?"]},{"id":"penpal","icon":"✉️","name":"Pen Pal Program","blurb":"Write letters to new friends!","need":["Paper","Pencils","Envelopes","A grown-up helper"],"steps":["Ask a teacher to find a pen pal class.","Write a letter about yourself.","Ask your pen pal questions.","Send your letters together.","Get excited for a reply!"],"tip":"Draw a picture to send with your letter.","atls":[{"cat":"Communication","subs":[{"name":"Writing","note":"Write letters to new friends."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Build a friendship far away."}]}],"t":"2+ weeks","g":"Whole class","lv":2,"d":["It could be another school in your town or far away.","Share your hobbies, favorite food, and what school is like.","Ask at least 3 questions so they have lots to answer.","Check your spelling and write neatly.","Put a map on the wall showing where your pen pals live."],"safe":"Use first names only and let your teacher send the letters.","up":"Send a 'culture page' with your letters: drawings of your games, food, and school.","q":["What did you learn about your pen pal's life?","How are you alike and how are you different?"]},{"id":"culturalday","icon":"🌍","name":"Cultural Day","blurb":"Share food, music, and customs!","need":["Things from your culture","A grown-up helper","Open space"],"steps":["Pick something special from your family.","Ask a grown-up to help bring it in.","Set up a little display.","Share with your classmates.","Learn about everyone else's too!"],"tip":"Music and food are great ways to share.","atls":[{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Share your culture with others."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Learn about everyone's culture."}]}],"t":"1 week","g":"Whole class","lv":2,"d":["A food, a song, a game, clothing, or a story.","Ask them to tell you the story behind it too.","Add a label with the name and where it's from.","Explain what it is and why it matters to your family.","Ask kind questions and try something new."],"safe":"Tell your teacher about any food so allergies can be checked.","up":"Learn to say 'hello' and 'thank you' in every language in your class.","q":["What did you learn about a classmate's culture?","What are you proud to share about your family?"]},{"id":"familytree","icon":"🌳","name":"Family Tree","blurb":"Show your family and where you're from!","need":["Paper","Pencils and markers","Family info (ask at home)"],"steps":["Ask your family about relatives.","Draw a tree shape.","Add yourself at the bottom.","Add parents and grandparents going up.","Decorate and share your tree!"],"tip":"Add little drawings or photos of each person.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Find out about your family."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Share your family story."}]}],"t":"2–3 days","g":"Just me","lv":1,"d":["Ask for names and where each person was born.","Make the trunk wide and add lots of branches.","Write your name and draw yourself.","Families come in all shapes. Include everyone who is family to you.","Tell the class one family story you learned."],"safe":"","up":"Mark on a world map where your family members were born.","q":["What new thing did you learn about your family?","What makes your family special?"]},{"id":"timecapsule","icon":"📦","name":"Time Capsule","blurb":"Save things to open in the future!","need":["A box or jar","Letters and drawings","Small items"],"steps":["Find a strong box.","Write letters to your future selves.","Add drawings and small treasures.","Seal it and label the open date.","Hide it somewhere safe!"],"tip":"Add a class photo to see how you've grown.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Choose what the future should see."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Collect and store it safely."},{"name":"Reflection","note":"Think about who you are now."}]}],"t":"2 hours","g":"Whole class","lv":1,"d":["A tin or plastic box with a tight lid is best.","Write about your favorite things and what you hope for.","Add today's newspaper page or a list of prices.","Choose a date, like the last day of school or 5 years from now.","Give a note about it to the school office so it isn't forgotten."],"safe":"No food or anything that could spoil or leak.","up":"Predict the future: what will school be like when it's opened?","q":["What will future you think when you read your letter?","What do you hope has changed by then?"]},{"id":"quilt","icon":"🧵","name":"Class Quilt","blurb":"Everyone makes a square for one quilt!","need":["Paper or fabric squares","Markers","Tape or glue"],"steps":["Give everyone a square.","Decorate it to show who you are.","Lay all the squares out.","Tape or glue them together.","Hang it up for everyone to see!"],"tip":"A paper quilt is easy and looks great on a wall.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Everyone adds a piece."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Your square shows who you are."}]}],"t":"2 hours","g":"Whole class","lv":1,"d":["Cut all squares the same size.","Draw things you love, your name, or your family.","Arrange the colors so they're spread out.","Tape on the back so the front stays neat.","Add a title card explaining what your quilt shows."],"safe":"","up":"Choose a shared theme, like 'our hopes for this year'.","q":["What does your square say about you?","What do you notice when all the squares are together?"]}]}};

.head{border:1mm solid var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);border-radius:6mm;padding:5mm 6mm;display:flex;gap:5mm;align-items:center}
.head .ic{font-size:40pt;line-height:1}
.head .gn{font-family:'Fredoka';font-weight:600;font-size:9pt;letter-spacing:.3px;text-transform:uppercase;color:#5B567E}
.head h1{font-family:'Baloo 2';font-weight:800;font-size:27pt;line-height:1.02}
.head .bl{font-family:'Fredoka';font-weight:500;font-size:13pt;color:#5B567E}
.head .t{flex:1}
.facts{display:flex;gap:3mm}
.fact{flex:1;border:.5mm solid #DAD5EA;border-radius:3.5mm;padding:2mm 3.5mm;font-weight:800;font-size:11pt;display:flex;gap:2.5mm;align-items:center}
.fact small{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#5B567E}
.fact .e{font-size:15pt}
.nd{display:flex;gap:8mm;font-family:'Fredoka';font-weight:600;font-size:11pt}
.nd div{flex:1;border-bottom:.5mm solid #2D2A4A;padding-bottom:1mm}
.nd div:last-child{flex:.55}
h2{font-family:'Baloo 2';font-weight:700;font-size:15pt;display:flex;gap:2.5mm;align-items:center;margin-bottom:2mm;line-height:1.1}
.sec{break-inside:avoid}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm 6mm}
.need{display:flex;gap:2.5mm;align-items:flex-start;font-weight:700;font-size:12pt}
.box{flex:0 0 auto;width:4.6mm;height:4.6mm;border:.55mm solid var(--c);border-radius:1.2mm;margin-top:.5mm;background:#fff}
.steps{list-style:none;display:flex;flex-direction:column}
.steps li{display:flex;gap:4mm;align-items:flex-start;padding:3.8mm 0;border-bottom:.35mm dotted #CFC9E2}
.steps li:last-child{border-bottom:none}
.num{flex:0 0 auto;width:9mm;height:9mm;border-radius:50%;background:var(--c);color:#fff;font-family:'Fredoka';font-weight:600;font-size:13pt;display:grid;place-items:center;text-shadow:0 0 1.5px rgba(0,0,0,.45)}
.stx{flex:1}
.stx b{display:block;font-weight:800;font-size:13.5pt;line-height:1.25}
.stx span{display:block;font-weight:600;font-size:11.5pt;color:#4A4668}
.steps .box{width:6.5mm;height:6.5mm;border-radius:1.8mm;margin-top:1.2mm}
.callouts{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.co{border-radius:4mm;padding:3.5mm 4mm;display:flex;gap:3mm;align-items:flex-start;font-weight:700;font-size:11.5pt;line-height:1.3}
.co .e{font-size:17pt;line-height:1}
.co b{display:block;font-family:'Fredoka';font-weight:600;font-size:11pt}
.safe{background:#FFE9E9;border:.5mm solid #F2A7A7}.safe b{color:#B32424}
.tip{background:#FFF4CF;border:.5mm solid #EBCB6B}.tip b{color:#8F5A06}
.up{background:#E4F0FF;border:.5mm solid #9DBDF2}.up b{color:#1F5FBF}
.wide{grid-column:1/-1}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-family:'Fredoka';font-weight:500;font-size:8.5pt;color:#8A86A6;border-top:.3mm solid #E2DEEF;padding-top:2mm}
/* page 2 */
.p2h{display:flex;align-items:center;gap:4mm;border-bottom:1mm solid var(--c);padding-bottom:3mm}
.p2h .ic{font-size:24pt}
.p2h h1{font-family:'Baloo 2';font-weight:800;font-size:21pt;line-height:1}
.p2h .sub{font-family:'Fredoka';font-weight:500;font-size:10.5pt;color:#5B567E}
.sketch{flex:1;min-height:45mm;border:.6mm dashed var(--c);border-radius:5mm;display:flex}
.sketch span{margin:3mm 4mm;font-weight:700;font-size:9.5pt;color:#8A86A6}
.q{font-weight:800;font-size:11.5pt;margin-top:1mm}
.line{border-bottom:.35mm solid #B9B4D1;height:8.6mm}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:2mm 5mm}
.sk{display:flex;align-items:center;gap:2.5mm;border:.45mm solid color-mix(in srgb,var(--a) 45%,#fff);background:color-mix(in srgb,var(--a) 8%,#fff);border-radius:3.5mm;padding:2mm 3mm}
.sk .e{font-size:14pt}
.sk .n{flex:1;line-height:1.2}
.sk .n b{display:block;font-family:'Fredoka';font-weight:600;font-size:10.5pt}
.sk .n small{font-size:8.5pt;font-weight:700;color:#5B567E}
.sk .n i{font-style:normal;font-size:7.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#5B567E}
.faces{font-size:13pt;letter-spacing:1mm;white-space:nowrap}
.key{font-weight:700;font-size:9pt;color:#5B567E;margin-top:1.5mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.note{border:.5mm solid #DAD5EA;border-radius:4mm;padding:2.5mm 4mm;height:25mm;font-family:'Fredoka';font-weight:600;font-size:10pt;color:#5B567E}
`;
function printGuide(e){const {p,cat,no}=e;const n=String(no).padStart(2,'0');
 const subs=p.atls.flatMap(a=>a.subs.map(s=>({a:a.cat,...s})));
 const co=[];
 if(p.safe)co.push(`<div class="co safe"><span class="e">🦺</span><div><b>Stay safe</b>${pesc(p.safe)}</div></div>`);
 co.push(`<div class="co tip"><span class="e">💡</span><div><b>Bonus tip</b>${pesc(p.tip)}</div></div>`);
 co.push(`<div class="co up ${co.length%2===0?'wide':''}"><span class="e">🚀</span><div><b>Level up</b>${pesc(p.up)}</div></div>`);
 const foot=pg=>`<div class="foot"><span>Project Picker · ${pesc(cat.title)}</span><span>Guide #${n} · ${pesc(p.name)} · page ${pg} of 2</span></div>`;
 const lines=k=>'<div class="line"></div>'.repeat(k);
 return `<div class="page" style="--c:${cat.color}">
 <div class="head"><div class="ic">${p.icon}</div><div class="t"><div class="gn">Guide #${n} · ${cat.icon} ${pesc(cat.title)}</div><h1>${pesc(p.name)}</h1><div class="bl">${pesc(p.blurb)}</div></div></div>
 <div class="facts"><div class="fact"><span class="e">⏱</span><span><small>Time</small>${pesc(p.t)}</span></div><div class="fact"><span class="e">👥</span><span><small>Who</small>${pesc(p.g)}</span></div><div class="fact"><span class="e">${'⭐'.repeat(p.lv)}</span><span><small>Challenge</small>${LEVEL[p.lv]}</span></div></div>
 <div class="nd"><div>Name:</div><div>Date:</div></div>
 <div class="sec"><h2>🧰 What You Need <span style="font-family:Nunito;font-weight:700;font-size:9.5pt;color:#8A86A6">tick each one when it's ready</span></h2><div class="needs">${p.need.map(x=>`<div class="need"><span class="box"></span>${pesc(x)}</div>`).join('')}</div></div>
 <div class="sec"><h2>👣 Steps to Follow</h2><ol class="steps">${p.steps.map((s,i)=>`<li><div class="num">${i+1}</div><div class="stx"><b>${pesc(s)}</b><span>${pesc(p.d[i])}</span></div><span class="box"></span></li>`).join('')}</ol></div>
 <div class="callouts">${co.join('')}</div>
 ${foot(1)}</div>
 <div class="page" style="--c:${cat.color}">
 <div class="p2h"><div class="ic">${p.icon}</div><div><h1>My Project Page</h1><div class="sub">${pesc(p.name)} · Name: ______________________</div></div></div>
 <div class="sec" style="flex:1;display:flex;flex-direction:column"><h2>✏️ My Plan</h2><div class="sketch"><span>Draw or write your idea before you start.</span></div></div>
 <div class="sec"><h2>💭 Think About It</h2>${p.q.map(q=>`<div class="q">${pesc(q)}</div>${lines(2)}`).join('')}<div class="q">Next time, I would…</div>${lines(1)}</div>
 <div class="sec"><h2>🌟 Skills I Built</h2><div class="skills">${subs.map(s=>{const m=ATL[s.a];return `<div class="sk" style="--a:${m[1]}"><span class="e">${m[0]}</span><div class="n"><i>${pesc(s.a)}</i><b>${pesc(s.name)}</b><small>${pesc(s.note)}</small></div><span class="faces">😀🙂🤔</span></div>`}).join('')}</div><div class="key">Circle a face for each skill: 😀 I did this really well · 🙂 I did this · 🤔 I'm still practicing</div></div>
 <div class="two"><div class="note">⭐ I am proud of…</div><div class="note">✍️ A note from my teacher or grown-up</div></div>
 ${foot(2)}</div>`;}

</script>
<script>
(function () {
  const DATA = window.DATA;
  const app = document.getElementById('app');
  const backBtn = document.getElementById('backBtn');
  const crumb = document.getElementById('crumb');

  /* ---------- index every guide ---------- */
  const ALL = [];
  DATA.categories.forEach(c => DATA.projects[c.id].forEach(p => {
    ALL.push({ cat: c, p, key: c.id + '-' + p.id, no: ALL.length + 1 });
  }));
  const byKey = {};
  ALL.forEach(e => byKey[e.key] = e);
  const pad = n => String(n).padStart(2, '0');

  const timeBucket = t => /min|hour/.test(t) ? 'quick' : /day|1 week/.test(t) ? 'days' : 'long';
  const groupFits = (g, f) =>
    f === 'any' ? true :
    f === 'solo' ? (g === 'Just me' || g === 'Me or a partner') :
    f === 'team' ? (g === 'Me or a partner' || g === 'Small team') :
    g === 'Whole class';
  const stars = n => '⭐'.repeat(n);
  const LEVEL = ['', 'Easy start', 'Getting tricky', 'Big challenge'];

  /* ---------- saved on this device only (falls back to memory) ---------- */
  const store = { steps: {}, needs: {}, favs: {} };
  try {
    const raw = localStorage.getItem('project-picker-v2');
    if (raw) Object.assign(store, JSON.parse(raw));
  } catch (e) {}
  function save() {
    try { localStorage.setItem('project-picker-v2', JSON.stringify(store)); } catch (e) {}
  }
  const doneSteps = key => store.steps[key] || (store.steps[key] = []);
  const gotNeeds = key => store.needs[key] || (store.needs[key] = []);
  const toggle = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };

  /* ---------- state ---------- */
  let query = '';
  const filt = { time: 'any', group: 'any' };
  let lastSurprise = null;

  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h === 'search') return { view: 'search' };
    if (h === 'favorites') return { view: 'favs' };
    if (byKey[h]) return { view: 'project', e: byKey[h] };
    const cat = DATA.categories.find(c => c.id === h);
    if (cat) return { view: 'category', cat };
    return { view: 'home' };
  }
  function go(hash) {
    if (location.hash.replace(/^#/, '') === hash) render();
    else location.hash = hash;
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });

  backBtn.addEventListener('click', () => {
    const r = route();
    if (r.view === 'project') go(r.e.cat.id);
    else go('');
  });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function render() {
    const r = route();
    backBtn.classList.toggle('show', r.view !== 'home');
    if (r.view === 'home') renderHome();
    else if (r.view === 'category') renderCategory(r.cat);
    else if (r.view === 'project') renderProject(r.e);
    else if (r.view === 'favs') renderList('⭐', 'My Favorites', ALL.filter(e => store.favs[e.key]), 'Tap the star on any project to save it here.');
    else renderSearch();
  }

  function cardHtml(e, i, showCat) {
    const p = e.p, done = doneSteps(e.key).length, total = p.steps.length;
    const tag = done > 0
      ? `<div class="chev">${done === total ? '✓ Done!' : done + '/' + total + ' done'}</div>`
      : `<div class="chev">Let's go →</div>`;
    return `
      <button class="card" style="--c:${e.cat.color}; animation-delay:${Math.min(i, 12) * 0.04}s" data-go="${e.key}">
        ${store.favs[e.key] ? '<div class="fav-dot" aria-label="Favorite">⭐</div>' : ''}
        <div class="gno">#${pad(e.no)}</div>
        <div class="ic">${p.icon}</div>
        <div class="nm">${esc(p.name)}</div>
        <div class="bl">${esc(showCat ? e.cat.title : p.blurb)}</div>
        <div class="meta"><span>⏱ ${esc(p.t)}</span><span>👥 ${esc(p.g)}</span></div>
        ${tag}
      </button>`;
  }
  function wireCards() {
    app.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(el.dataset.go)));
  }

  /* ---------- HOME ---------- */
  function renderHome() {
    crumb.innerHTML = '';
    const finished = ALL.filter(e => doneSteps(e.key).length === e.p.steps.length).length;
    const favCount = ALL.filter(e => store.favs[e.key]).length;
    let html = `
      <div class="screen">
        <div class="hero">
          <div class="mascot">🚀</div>
          <h1>Find Your <span class="pop1">Perfect</span> <span class="pop2">Project!</span></h1>
          <p>Tap a box below to start. We'll help you pick something awesome and show you exactly what to do! 🌟</p>
          <button class="big-surprise" id="homeSurprise">🎲 Don't know? Surprise me!</button>
          <form class="search" id="searchForm" role="search">
            <span aria-hidden="true">🔎</span>
            <input id="searchBox" type="search" placeholder="Search ${ALL.length} projects… try “robot”" aria-label="Search projects" autocomplete="off">
          </form>
          <div class="statline">
            <div class="stat">📚 <b>${ALL.length}</b> project guides</div>
            <div class="stat">🏆 <b>${finished}</b> finished</div>
            ${favCount ? `<button class="stat chip" id="favLink">⭐ <b>${favCount}</b> favorite${favCount > 1 ? 's' : ''} →</button>` : ''}
          </div>
        </div>
        <div class="grid two">`;
    DATA.categories.forEach((c, i) => {
      html += `
        <button class="card" style="--c:${c.color}; animation-delay:${i * 0.05}s" data-go="${c.id}">
          <div class="ic">${c.icon}</div>
          <div class="nm">${esc(c.title)}</div>
          <div class="bl">${esc(c.blurb)}</div>
          <div class="chev">${DATA.projects[c.id].length} ideas →</div>
        </button>`;
    });
    html += `</div></div>`;
    app.innerHTML = html;
    wireCards();
    document.getElementById('homeSurprise').addEventListener('click', () => surprise(ALL));
    const fl = document.getElementById('favLink');
    if (fl) fl.addEventListener('click', () => go('favorites'));
    document.getElementById('searchForm').addEventListener('submit', ev => {
      ev.preventDefault();
      query = document.getElementById('searchBox').value.trim();
      if (query) go('search');
    });
  }

  function surprise(list) {
    if (!list.length) return;
    let pick;
    do { pick = list[Math.floor(Math.random() * list.length)]; }
    while (list.length > 1 && pick.key === lastSurprise);
    lastSurprise = pick.key;
    burst();
    go(pick.key);
  }

  /* ---------- CATEGORY ---------- */
  function renderCategory(cat) {
    crumb.innerHTML = `<b>${esc(cat.title)}</b>`;
    const mine = ALL.filter(e => e.cat.id === cat.id);
    const shown = mine.filter(e =>
      (filt.time === 'any' || timeBucket(e.p.t) === filt.time) && groupFits(e.p.g, filt.group));
    const chip = (kind, val, label) =>
      `<button class="chip ${filt[kind] === val ? 'on' : ''}" data-f="${kind}:${val}" aria-pressed="${filt[kind] === val}">${label}</button>`;
    let html = `
      <div class="screen" style="--c:${cat.color}">
        <div class="section-title"><span class="tag">${cat.icon}</span> ${esc(cat.title)}</div>
        <div class="section-sub">Pick one to see how to make it! 👇</div>
        <div class="filters">
          <div class="frow"><span class="lbl">⏱ Time</span>
            ${chip('time', 'any', 'Any')}${chip('time', 'quick', 'Quick (today)')}${chip('time', 'days', 'A few days')}${chip('time', 'long', 'Long project')}
          </div>
          <div class="frow"><span class="lbl">👥 Who</span>
            ${chip('group', 'any', 'Anyone')}${chip('group', 'solo', 'On my own')}${chip('group', 'team', 'With friends')}${chip('group', 'class', 'Whole class')}
          </div>
        </div>`;
    if (shown.length) {
      html += `<div class="grid two">` + shown.map((e, i) => cardHtml(e, i)).join('') + `</div>
        <button class="surprise-btn" id="surprise">🎲 Surprise Me!</button>`;
    } else {
      html += `<div class="empty"><span class="big">🔍</span>No projects match those buttons. Try “Any” or “Anyone”!</div>`;
    }
    html += `</div>`;
    app.innerHTML = html;
    wireCards();
    app.querySelectorAll('[data-f]').forEach(el => el.addEventListener('click', () => {
      const [k, v] = el.dataset.f.split(':');
      filt[k] = v;
      renderCategory(cat);
    }));
    const s = document.getElementById('surprise');
    if (s) s.addEventListener('click', () => surprise(shown));
  }

  /* ---------- SEARCH + FAVORITES ---------- */
  function renderSearch() {
    const q = query.toLowerCase();
    const hits = !q ? [] : ALL.filter(e => {
      const p = e.p;
      return (p.name + ' ' + p.blurb + ' ' + p.need.join(' ') + ' ' + e.cat.title).toLowerCase().includes(q);
    });
    renderList('🔎', `Results for “${query}”`, hits, 'Nothing found. Try a shorter word, like “paint” or “game”.', true);
  }
  function renderList(icon, title, list, emptyMsg, isSearch) {
    crumb.innerHTML = `<b>${esc(isSearch ? 'Search' : title)}</b>`;
    let html = `<div class="screen">
      <div class="section-title"><span class="tag">${icon}</span> ${esc(title)}</div>`;
    if (isSearch) html += `
      <form class="search" id="searchForm" role="search" style="margin:0 0 22px">
        <span aria-hidden="true">🔎</span>
        <input id="searchBox" type="search" value="${esc(query)}" aria-label="Search projects" autocomplete="off">
      </form>`;
    html += list.length
      ? `<div class="section-sub">${list.length} project${list.length > 1 ? 's' : ''}</div><div class="grid two">` + list.map((e, i) => cardHtml(e, i, true)).join('') + `</div>`
      : `<div class="empty"><span class="big">🤔</span>${esc(emptyMsg)}</div>`;
    html += `</div>`;
    app.innerHTML = html;
    wireCards();
    const f = document.getElementById('searchForm');
    if (f) f.addEventListener('submit', ev => {
      ev.preventDefault();
      query = document.getElementById('searchBox').value.trim();
      renderSearch();
    });
  }

  /* ---------- PROJECT DETAIL ---------- */
  const ATL_META = {
    "Thinking": { icon: "🧠", color: "#FF6B6B" },
    "Social": { icon: "🤝", color: "#F15BB5" },
    "Communication": { icon: "💬", color: "#4D96FF" },
    "Self-Management": { icon: "⏰", color: "#FF9F1C" },
    "Research": { icon: "🔍", color: "#52B788" },
  };

  function renderProject(e) {
    const cat = e.cat, p = e.p, key = e.key;
    crumb.innerHTML = `${esc(cat.title)} › <b>${esc(p.name)}</b>`;
    const got = gotNeeds(key), done = doneSteps(key);

    const needsHtml = p.need.map((n, i) =>
      `<button class="pill ${got.includes(i) ? 'got' : ''}" data-need="${i}" aria-pressed="${got.includes(i)}"><span class="box"></span>${esc(n)}</button>`).join('');

    const stepsHtml = p.steps.map((s, i) =>
      `<li><button class="step ${done.includes(i) ? 'done' : ''}" data-step="${i}" aria-pressed="${done.includes(i)}">
        <div class="num"></div>
        <div class="tx"><b>${esc(s)}</b><span class="how">${esc(p.d[i])}</span></div>
        <div class="check"></div>
      </button></li>`).join('');

    const atlsHtml = (p.atls || []).map(a => {
      const m = ATL_META[a.cat] || { icon: "✨", color: "#9B5DE5" };
      return `<div class="atl" style="--ac:${m.color}">
        <div class="atl-head"><div class="atl-ic">${m.icon}</div><div class="atl-cat">${esc(a.cat)} Skills</div></div>
        <ul class="atl-subs">${a.subs.map(s =>
          `<li class="atl-sub"><span class="atl-sub-name">${esc(s.name)}</span><span class="atl-sub-note">${esc(s.note)}</span></li>`).join('')}</ul>
      </div>`;
    }).join('');

    app.innerHTML = `
      <div class="screen" style="--c:${cat.color}">
        <div class="detail-head" style="--c:${cat.color}">
          <button class="fav-btn ${store.favs[key] ? 'on' : ''}" id="fav" aria-pressed="${!!store.favs[key]}" aria-label="Save as favorite">⭐</button>
          <div class="gnum">Guide #${pad(e.no)} · ${esc(cat.title)}</div><br>
          <div class="big-ic">${p.icon}</div>
          <h2>${esc(p.name)}</h2>
          <div class="tagline">${esc(p.blurb)}</div>
          <div class="facts">
            <div class="fact"><span class="fe">⏱</span><span><small>Time</small>${esc(p.t)}</span></div>
            <div class="fact"><span class="fe">👥</span><span><small>Who</small>${esc(p.g)}</span></div>
            <div class="fact"><span class="fe">${stars(p.lv)}</span><span><small>Challenge</small>${LEVEL[p.lv]}</span></div>
          </div>
        </div>

        ${p.safe ? `<div class="safebox"><div class="se">🦺</div><div class="stx"><b>Stay safe:</b> ${esc(p.safe)}</div></div>` : ''}

        <div class="panel">
          <h3><span class="e">🧰</span> What You Need</h3>
          <div class="needs">${needsHtml}</div>
          <div class="hint">Tap each thing when you've got it ready.</div>
        </div>

        <div class="panel">
          <h3><span class="e">👣</span> Steps to Follow</h3>
          <ol class="steps" id="steps">${stepsHtml}</ol>
          <div class="progress-wrap"><div class="progress-bar" id="bar" style="background:${cat.color}"></div></div>
          <div class="progress-label" id="plabel"></div>
          <div class="celebrate" id="celebrate">🎉 You did it! Amazing work! 🎉</div>
        </div>

        <div class="panel">
          <h3><span class="e">⭐</span> Make It Even Better</h3>
          <div class="tipbox"><div class="bulb">💡</div><div class="tiptx"><b>Try this:</b> ${esc(p.tip)}</div></div>
          <div class="upbox"><div class="ue">🚀</div><div class="utx"><b>Level up:</b> ${esc(p.up)}</div></div>
        </div>

        <div class="panel">
          <h3><span class="e">💭</span> Think About It</h3>
          <ul class="qs">${p.q.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
        </div>

        <div class="panel" style="margin-bottom:8px">
          <h3><span class="e">🌟</span> Skills You'll Build</h3>
          <div class="atl-grid">${atlsHtml}</div>
        </div>

        <div class="printcard" id="printCard" ${printMode ? '' : 'hidden'}>
          <div class="pe">🖨️</div>
          <div class="ptx"><b>Printable guide</b>Two pages: the steps on the front, and a planning and reflection page on the back.</div>
          <button class="print-btn" id="printBtn">${printMode === 'save' ? '⬇️ Get the PDF' : '🖨️ Print or save as PDF'}</button>
        </div>
        <div class="printmsg" id="printMsg" role="status"></div>
        <div class="next-row">
          <button class="surprise-btn plain" id="more">${cat.icon} More ${esc(cat.title)}</button>
          <button class="surprise-btn" id="again">🎲 Surprise me again</button>
        </div>
      </div>`;

    app.querySelectorAll('[data-need]').forEach(el => el.addEventListener('click', () => {
      toggle(got, +el.dataset.need); save();
      el.classList.toggle('got'); el.setAttribute('aria-pressed', el.classList.contains('got'));
    }));
    app.querySelectorAll('[data-step]').forEach(el => el.addEventListener('click', () => {
      toggle(done, +el.dataset.step); save();
      el.classList.toggle('done'); el.setAttribute('aria-pressed', el.classList.contains('done'));
      updateProgress(p, done, true);
    }));
    document.getElementById('fav').addEventListener('click', ev => {
      if (store.favs[key]) delete store.favs[key]; else store.favs[key] = 1;
      save();
      ev.currentTarget.classList.toggle('on', !!store.favs[key]);
      ev.currentTarget.setAttribute('aria-pressed', !!store.favs[key]);
    });
    document.getElementById('printBtn').addEventListener('click', () => printout(e));
    document.getElementById('more').addEventListener('click', () => go(cat.id));
    document.getElementById('again').addEventListener('click', () => surprise(ALL));
    updateProgress(p, done, false);
  }

  function updateProgress(p, done, celebrateNow) {
    const total = p.steps.length, n = done.length;
    document.getElementById('bar').style.width = Math.round((n / total) * 100) + '%';
    document.getElementById('plabel').textContent = n === 0 ? 'Tap a step when you finish it!' : `${n} of ${total} steps done`;
    document.getElementById('celebrate').classList.toggle('show', n === total);
    if (n === total && celebrateNow) burst();
  }

  /* ---------- printable PDF ---------- */
  // 'save'  = published page: hand over the ready-made PDF through the downloads capability
  // 'print' = opened as a plain file: build the same two pages and use the browser's print dialog
  let printMode = window.claude ? null : 'print';
  let downloads = null;
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(ns => {
      if (!ns) return;
      downloads = ns; printMode = 'save';
      const card = document.getElementById('printCard'), btn = document.getElementById('printBtn');
      if (card) { card.hidden = false; btn.textContent = '⬇️ Get the PDF'; }
    }).catch(() => {});
  }
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const pdfName = e => pad(e.no) + '-' + e.cat.id + '-' + slug(e.p.name) + '.pdf';
  let busy = false;
  async function printout(e) {
    const msg = document.getElementById('printMsg'), btn = document.getElementById('printBtn');
    const say = t => { if (msg) msg.textContent = t; };
    if (busy) return;
    if (printMode === 'save' && downloads) {
      busy = true; btn.disabled = true; say('Getting your guide ready…');
      try {
        const res = await fetch('guides/' + pdfName(e));
        if (!res.ok) throw { code: 'missing' };
        const blob = await res.blob();
        await downloads.save({ filename: pdfName(e), data: blob });
        say('Saved! Open the PDF and print it double-sided. 🎉');
      } catch (err) {
        const code = err && err.code;
        say(code === 'declined' ? 'No problem. Tap the button when you want it.'
          : code === 'rate_limited' ? 'One moment… try again in a few seconds.'
          : code === 'missing' ? 'Sorry, this printout could not be found.'
          : 'Sorry, the PDF could not be saved here.');
      }
      busy = false; btn.disabled = false;
      return;
    }
    // plain-file mode: render the two pages in a hidden frame and print that
    const old = document.getElementById('printFrame');
    if (old) old.remove();
    const f = document.createElement('iframe');
    f.id = 'printFrame';
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    f.srcdoc = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>' + esc('Guide #' + pad(e.no) + ' ' + e.p.name) + '</title>'
      + '<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">'
      + '<style>' + PRINT_CSS + '</style></head><body>' + printGuide(e) + '</body></html>';
    f.onload = () => {
      const w = f.contentWindow;
      const fire = () => { try { w.focus(); w.print(); say('In the print window, choose “Save as PDF” to keep a copy.'); } catch (x) { say('Sorry, printing is not available here.'); } };
      const ready = w.document.fonts && w.document.fonts.ready;
      if (ready) Promise.race([ready, new Promise(r => setTimeout(r, 2500))]).then(fire); else fire();
    };
    say('Opening the print window…');
    document.body.appendChild(f);
  }

  /* ---------- confetti burst ---------- */
  let lastBurst = 0;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burst() {
    const now = Date.now();
    if (calm || now - lastBurst < 1500) return;
    lastBurst = now;
    const emojis = ['🎉', '⭐', '🎊', '✨', '🌟', '🥳'];
    for (let i = 0; i < 24; i++) {
      const e = document.createElement('div');
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      e.style.cssText = `position:fixed;left:${50 + (Math.random() * 40 - 20)}%;top:40%;font-size:${1.4 + Math.random() * 1.4}rem;z-index:99;pointer-events:none;`;
      document.body.appendChild(e);
      const dx = (Math.random() - 0.5) * 600, dy = -(150 + Math.random() * 300), rot = (Math.random() - 0.5) * 720;
      e.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 1, offset: 0.7 },
        { transform: `translate(${dx * 1.2}px, ${dy + 500}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 1600 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => e.remove();
    }
  }

  /* ---------- background doodles ---------- */
  (function () {
    const set = ['✏️', '🎨', '📚', '⭐', '🚀', '🧩', '🌈', '✂️', '🔬', '🎭', '💡', '🏆'];
    const c = document.getElementById('doodles');
    set.forEach(emo => {
      const d = document.createElement('div');
      d.className = 'doodle';
      d.textContent = emo;
      d.style.left = (5 + Math.random() * 90) + 'vw';
      d.style.top = (5 + Math.random() * 90) + 'vh';
      d.style.animationDelay = (Math.random() * 5) + 's';
      d.style.animationDuration = (6 + Math.random() * 5) + 's';
      d.style.fontSize = (1.6 + Math.random() * 1.6) + 'rem';
      c.appendChild(d);
    });
  })();

  render();
})();
</script>
</body>
</html>
