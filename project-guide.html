<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm menu on the left, one big friendly task at a time on the right, one bright colour per step. */
:root{
  color-scheme:light;
  --paper:#FFFBF3; --card:#FFFFFF; --ink:#2B1F0E; --muted:#6B5744; --line:#EBDAC4;
  --berry:#D6336C; --berry-soft:#FFEAF3; --sun:#FFB830; --leaf:#2F9E5B;
  --display:"Baloo 2","Nunito","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --body:"Nunito","Hiragino Maru Gothic ProN","Yu Gothic UI","Trebuchet MS",system-ui,sans-serif;
  --r:20px; --side:264px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:100%;scroll-behavior:smooth;}
body{font-family:var(--body);font-weight:600;background:var(--paper);color:var(--ink);font-size:1.0625rem;line-height:1.55;min-height:100%;}
button,input,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;}
:focus-visible{outline:3px solid #1C7ED6;outline-offset:2px;border-radius:8px;}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}html{scroll-behavior:auto;}}

/* colour sets: --c strong, --cl light, --cd dark text */
.c-sun{--c:#FFB830;--cl:#FFF6DC;--cd:#6B4B00;}
.c-leaf{--c:#5DC887;--cl:#E4F8EC;--cd:#17603A;}
.c-sky{--c:#5BC8F5;--cl:#E0F5FF;--cd:#0B5C7D;}
.c-clay{--c:#FF8A5C;--cl:#FFF0E8;--cd:#8F370E;}
.c-berry{--c:#FF7FAB;--cl:#FFEAF3;--cd:#96204F;}
.c-plum{--c:#A58CF0;--cl:#EEE8FF;--cd:#44289F;}
.c-teal{--c:#3FD0E0;--cl:#DFF8FB;--cd:#0A5F6B;}
.c-gold{--c:#F5B93B;--cl:#FFF3D1;--cd:#6B4B00;}

/* ── menu ── */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:2.5px solid var(--line);overflow-y:auto;z-index:200;display:flex;flex-direction:column;padding-bottom:20px;}
.logo{padding:18px 16px 14px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px;}
.logo .owl{font-size:2.6rem;line-height:1;}
.logo h1{font-size:1.25rem;}
.logo p{font-size:.85rem;color:var(--muted);font-weight:700;}
.sec{padding:16px 16px 6px;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--berry);}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;background:none;border:0;border-left:5px solid transparent;text-align:left;font-weight:800;font-size:1rem;color:var(--ink);}
.nav:hover{background:#FFF4EA;}
.nav[aria-current="page"]{background:var(--berry-soft);border-left-color:var(--berry);color:#96204F;}
.nav .ic{font-size:1.35rem;width:1.8rem;text-align:center;flex-shrink:0;}
.badge{width:2rem;height:2rem;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.nav .mark{margin-left:auto;font-size:1.1rem;opacity:.25;filter:grayscale(1);}
.nav.done .mark{opacity:1;filter:none;}
.overlay{display:none;position:fixed;inset:0;background:rgba(43,31,14,.4);z-index:150;}

/* ── main ── */
.main{margin-left:var(--side);min-width:0;}
.top{position:sticky;top:0;z-index:100;background:rgba(255,251,243,.96);border-bottom:2px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.btn.menu-btn{display:none;}
.prog{flex:1;min-width:150px;}
.prog-text{font-size:.9rem;font-weight:800;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.saved{color:var(--leaf);font-weight:800;font-size:.85rem;opacity:0;transition:opacity .3s;}
.saved.on{opacity:1;}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:4px;max-width:340px;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB830,#FF7FAB);border-radius:10px;transition:width .4s;}
.size{display:flex;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);}
.size button{background:none;border:0;min-width:46px;min-height:44px;font-weight:900;}
.size button+button{border-left:2px solid var(--line);}
.size button:hover{background:var(--berry-soft);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);font-weight:800;font-size:1rem;text-align:center;}
.btn:hover{border-color:var(--berry);}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff;box-shadow:0 4px 0 #A3245A;}
.btn.primary:hover{background:#C2255C;}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #A3245A;}
.btn.big{font-size:1.15rem;min-height:58px;padding:12px 26px;}
.btn.small{min-height:42px;padding:6px 12px;font-size:.92rem;border-radius:12px;}
.btn[disabled]{opacity:.6;cursor:wait;}

.panel{display:none;padding:28px 32px 90px;max-width:1080px;}
.panel.active{display:block;}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--berry);margin-bottom:4px;}
.ptitle{font-size:1.9rem;margin-bottom:16px;}
.sub{font-size:1.3rem;margin:28px 0 12px;}
.lead{max-width:62ch;margin-bottom:18px;color:var(--muted);font-weight:700;}

/* ── home ── */
.hero{background:linear-gradient(135deg,#FF9E4F 0%,#F0568C 55%,#7C5CE0 100%);color:#fff;border-radius:28px;padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
.hero .owl{font-size:4.2rem;line-height:1;}
.hero h2{font-size:2.1rem;margin-bottom:6px;}
.hero p{font-weight:700;max-width:46ch;font-size:1.08rem;}
.hero>div{flex:1;min-width:240px;}
.box{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);padding:20px;}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.field label{display:block;font-weight:900;margin-bottom:6px;}
.field input{width:100%;min-height:52px;border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;background:var(--paper);}
.field input:focus,textarea:focus{outline:none;border-color:#1C7ED6;background:#fff;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.how div{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);padding:16px;font-weight:700;}
.how b{display:block;font-family:var(--display);font-size:1.15rem;}
.how .n{display:inline-flex;width:2rem;height:2rem;border-radius:50%;background:var(--sun);align-items:center;justify-content:center;font-weight:900;margin-bottom:6px;}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.tile{background:var(--cl);border:2.5px solid var(--c);border-radius:var(--r);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative;font-weight:800;color:var(--cd);}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.tile .em{font-size:1.9rem;line-height:1;}
.tile small{font-size:.8rem;font-weight:900;letter-spacing:.06em;}
.tile .star{position:absolute;top:10px;right:10px;font-size:1.4rem;opacity:.2;filter:grayscale(1);}
.tile.done .star{opacity:1;filter:none;}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.qcard{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:16px;text-align:left;font-weight:800;display:flex;gap:10px;align-items:center;min-height:68px;}
.qcard:hover{border-color:var(--berry);}
.qcard span{font-size:1.7rem;}
.qcard small{display:block;color:var(--muted);font-weight:700;font-size:.85rem;}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700;min-height:44px;}

/* ── steps ── */
.dots{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.dot{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);font-weight:900;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.dot.done{background:#FFF3CC;border-color:var(--sun);}
.dot[aria-current="step"]{border-color:var(--berry);background:var(--berry-soft);box-shadow:0 0 0 4px rgba(214,51,108,.15);}
.shero{background:var(--cl);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;}
.bubble{width:84px;height:84px;border-radius:22px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;line-height:1;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.bubble span{font-size:.7rem;font-weight:900;margin-top:6px;color:var(--ink);letter-spacing:.05em;}
.shero h2{font-size:1.7rem;margin-bottom:4px;}
.shero p{font-weight:700;max-width:60ch;margin-bottom:10px;}
.owltip{background:#FFFBE6;border:2.5px solid #FFE066;border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;font-weight:700;color:#5C4700;max-width:820px;}
.owltip>span{font-size:1.6rem;line-height:1.2;}
.qlist{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;max-width:820px;}
.q{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:16px 18px;}
.q.ok{border-color:#8ADBB0;}
.qhead{display:flex;gap:12px;align-items:flex-start;}
.qicon{font-size:1.7rem;line-height:1.2;flex-shrink:0;}
.qtext{font-weight:900;font-size:1.12rem;flex:1;line-height:1.35;}
.qok{color:var(--leaf);font-weight:900;font-size:1.3rem;visibility:hidden;}
.q.ok .qok{visibility:visible;}
.qhint{color:var(--muted);font-weight:700;margin:6px 0 8px;}
.qex{background:var(--paper);border-left:5px solid var(--sun);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.97rem;margin-bottom:10px;}
textarea{width:100%;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);font-weight:700;line-height:1.5;resize:vertical;min-height:5.5rem;}
.qtools{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
.out{display:inline-flex;gap:8px;align-items:center;background:var(--cl);color:var(--cd);border:2.5px solid var(--c);border-radius:30px;padding:8px 16px;font-weight:900;}
.navrow{display:flex;gap:12px;margin-top:26px;padding-top:20px;border-top:2px solid var(--line);max-width:820px;}
.navrow .primary{flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:46px;border-radius:30px;border:2.5px solid var(--line);background:var(--card);padding:6px 14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;}
.chip[aria-pressed="true"]{background:#E4F8EC;border-color:#2F9E5B;color:#17603A;}
.chip[aria-pressed="true"]::after{content:"✓";font-weight:900;}
.ticks{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.tick{display:flex;gap:12px;align-items:center;font-weight:800;min-height:44px;}
.tick input{width:28px;height:28px;accent-color:var(--leaf);flex-shrink:0;}

/* drawing pad */
.padwrap{border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:8px;}
#pad{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;}
.padtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--line);}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);}
.sofar{background:var(--paper);border:2.5px dashed var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-weight:700;}
.sofar b{font-weight:900;}
.sofar li{margin-left:1.2rem;margin-top:4px;}
.party{background:linear-gradient(135deg,#FFF6DC,#FFEAF3);border:2.5px solid #FFD6A5;border-radius:var(--r);padding:22px;margin-top:20px;text-align:center;max-width:820px;}
.party .em{font-size:3.2rem;line-height:1;}
.party h3{font-size:1.5rem;margin:6px 0;}
.party p{max-width:46ch;margin:0 auto 14px;font-weight:700;color:var(--muted);}

/* ── ideas ── */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.idea{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;}
.idea.picked{border-color:#2F9E5B;background:#F3FCF6;}
.idea .em{font-size:2.6rem;line-height:1;}
.idea h3{font-size:1.3rem;}
.idea p{font-weight:700;color:var(--muted);}
.idea ul{margin-left:1.2rem;font-weight:700;font-size:.97rem;}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{border-radius:20px;padding:3px 10px;font-size:.85rem;font-weight:800;background:var(--paper);border:2px solid var(--line);}
.idea .row{margin-top:auto;padding-top:8px;}

/* ── materials ── */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:8px;}
.mat{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;}
.mat.on{border-color:#2F9E5B;}
.mathead{display:flex;gap:12px;align-items:center;}
.mathead .em{font-size:2.3rem;line-height:1;}
.mathead h3{font-size:1.2rem;flex:1;}
.p{border-radius:20px;padding:3px 10px;font-size:.88rem;font-weight:800;border:2px solid;display:inline-flex;gap:4px;align-items:center;}
.p-strong{background:#FFF0E8;color:#8F370E;border-color:#FFB899;}
.p-light{background:#E0F5FF;color:#0B5C7D;border-color:#8ADDF5;}
.p-flexible{background:#EEE8FF;color:#44289F;border-color:#C4B0F5;}
.p-waterproof{background:#E4F8EC;color:#17603A;border-color:#8ADBB0;}
.p-mouldable{background:#FFEAF3;color:#96204F;border-color:#FFB3D4;}
.p-conductive{background:#FFF3CC;color:#6B4B00;border-color:#FFD966;}
.p-natural{background:#F0FBF4;color:#2D6A4F;border-color:#95D5B2;}
.p-decorative{background:#F5F3FF;color:#5E35B1;border-color:#C4B0F5;}
button.p{min-height:44px;padding:6px 14px;font-size:.95rem;}
button.p[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);}
.uses{font-weight:700;font-size:.97rem;}
.uses b{font-weight:900;}
.rows{display:flex;flex-direction:column;gap:8px;max-width:820px;}
.rowc{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:800;}
.rowc small{display:block;color:var(--muted);font-weight:700;font-size:.92rem;}
.rowc .em{font-size:1.6rem;}
label.rowc{cursor:pointer;min-height:56px;}
label.rowc input{width:30px;height:30px;accent-color:var(--leaf);flex-shrink:0;}

/* ── cards for presenting / tips / words ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);padding:18px;}
.card .em{font-size:2.4rem;line-height:1;display:block;margin-bottom:8px;}
.card h3{font-size:1.2rem;margin-bottom:4px;}
.card p{font-weight:700;color:var(--muted);}
.card ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.card li{background:var(--paper);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.95rem;}

/* dialog + toast */
dialog{border:0;border-radius:var(--r);padding:24px;max-width:420px;width:calc(100% - 32px);margin:auto;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);}
dialog::backdrop{background:rgba(43,31,14,.5);}
dialog h3{font-size:1.4rem;margin-bottom:8px;}
dialog p{font-weight:700;margin-bottom:18px;}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:800;padding:12px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:600;max-width:calc(100% - 32px);text-align:center;}
#toast.on{opacity:1;transform:translate(-50%,0);}
.warn{background:#FFF0E8;border:2.5px solid #FFB899;color:#8F370E;border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:16px;}

@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .25s;}
  .side.open{transform:none;}
  .overlay.open{display:block;}
  .main{margin-left:0;}
  .btn.menu-btn{display:inline-flex;}
  .top{padding:8px 16px;gap:8px;}
  .panel{padding:18px 16px 80px;}
  .path{grid-template-columns:repeat(2,1fr);}
  .how,.mine{grid-template-columns:1fr;}
  .pdf-long{display:none;}
}
@media (min-width:901px){.pdf-short{display:none;}}
@media (max-width:480px){
  .shero{flex-direction:column;}
  .navrow{flex-direction:column-reverse;}
  .mats{grid-template-columns:1fr;}
  .hero h2{font-size:1.7rem;}
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<nav class="side" id="side" aria-label="Menu"></nav>

<div class="main" id="main">
  <header class="top">
    <button class="btn small menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">☰ Menu</button>
    <div class="prog">
      <div class="prog-text"><span id="progText">⭐ 0 of 8 steps done</span><span class="saved" id="saved">✓ Saved</span></div>
      <div class="bar" aria-hidden="true"><i id="progBar"></i></div>
    </div>
    <div class="size" role="group" aria-label="Text size">
      <button id="sizeDown" aria-label="Make text smaller">A−</button>
      <button id="sizeUp" aria-label="Make text bigger">A+</button>
    </div>
    <button class="btn primary small" data-pdf="mine"><span>📄</span><span class="pdf-long">Download my notes (PDF)</span><span class="pdf-short">PDF</span></button>
  </header>
  <main id="panels"></main>
</div>

<dialog id="resetDlg" aria-labelledby="resetTitle">
  <h3 id="resetTitle">Start a new project?</h3>
  <p>This clears all your answers and your drawing on this device. Download your PDF first if you want to keep them.</p>
  <div class="row">
    <button class="btn" id="resetNo">No, keep my notes</button>
    <button class="btn primary" id="resetYes">Yes, start new</button>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═════════════ CONTENT ═════════════ */
const STEPS = [
 {n:1,icon:'🌱',color:'sun',short:'Your Big Idea',title:'Your Big Idea',
  intro:'Every project starts with an idea. Say what you want to make and why it matters.',
  tip:'There are no wrong answers. Type in the boxes. Your notes save by themselves.',
  out:'A Project Statement',
  qs:[
   {id:'s1q1',icon:'🤔',text:'What do you want to make or build?',hint:'Think of something you would love to create, or a problem you want to fix.',ex:'A robot arm, a bird feeder, a board game, or a plant waterer.',starter:'I want to make '},
   {id:'s1q2',icon:'❤️',text:'Why does it matter? What problem does it fix?',hint:'The best projects fix something that is annoying, hard, or missing.',ex:'My plants always die because I forget to water them.',starter:'It matters because '},
   {id:'s1q3',icon:'👥',text:'Who will use your project?',hint:'Think about who it will help.',ex:'Me, my family, my class, younger kids, older people, or pets.',starter:'It is for '},
   {id:'s1q4',icon:'🌟',text:'Write one sentence about your whole project.',hint:'Say what it is, who it is for, and why you are making it.',ex:'I am making a plant waterer for my mum so her flowers do not die.',starter:'I am making a '}
  ]},
 {n:2,icon:'🛠️',color:'leaf',short:'Materials',title:'Materials and Properties',
  intro:'What will you build with? Each material is good at different things. Pick the ones that fit your project.',
  tip:'Not sure what to pick? Open the Materials Guide in the menu.',
  out:'A Materials Map',
  qs:[
   {id:'s2q1',icon:'📦',text:'List everything you need.',hint:'Write every single thing. Tape and glue count too!',ex:'Cardboard, wooden sticks, paint, string, and glue.',starter:'I need '},
   {id:'s2q2',icon:'💪',text:'Why is each material a good choice?',hint:'Does it need to be strong, light, waterproof, or bendy?',ex:'Cardboard is good because it is light and easy to cut.',starter:'I chose '},

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='project-maker-notes-v2';
const blank=()=>({name:'',project:'',ideaId:'',answers:{},mats:[],drawing:'',drawn:false,checks:{},size:1});
let state=blank(), storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') state=Object.assign(blank(),s); localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t');}catch(e){storageOK=false;}
let saveT, savedT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state)); const el=$('#saved'); el.classList.add('on'); clearTimeout(savedT); savedT=setTimeout(()=>el.classList.remove('on'),1500);}
    catch(e){ if(storageOK){storageOK=false; renderWarn();} }
  },250);
}

function qHTML(q,s){
  let body='';
  if(q.type==='ticks'){
    body=`<div class="ticks">${q.ticks.map(t=>`<label class="tick"><input type="checkbox" id="c-${t[0]}" data-check="${t[0]}">${esc(t[1])}</label>`).join('')}</div>`;
  }else{
    const pad=q.type==='draw'?`
      <div class="padtools" role="group" aria-label="Drawing tools">
        ${[['#2B1F0E','Black'],['#E03131','Red'],['#1C7ED6','Blue'],['#2F9E5B','Green'],['#F08C00','Orange'],['#9C36B5','Purple']].map((c,i)=>`<button class="sw" style="background:${c[0]}" data-color="${c[0]}" aria-label="${c[1]} pen" aria-pressed="${i===0}"></button>`).join('')}
        <button class="btn small" data-color="erase" aria-pressed="false">🧽 Rubber</button>
        <button class="btn small" id="padUndo">↩️ Undo</button>
        <button class="btn small" id="padClear">🗑️ Clear</button>
      </div>
      <div class="padwrap"><canvas id="pad" width="900" height="540" aria-label="Drawing area for your blueprint"></canvas></div>
      <label class="qhint" for="a-${q.id}" style="display:block">Labels and sizes (you can also write these on paper):</label>`:'';
    const sofar=q.id==='s8q1'?`<div class="sofar" id="sofar"></div>`:'';
    body=`${sofar}${pad}<textarea id="a-${q.id}" data-q="${q.id}" rows="${q.rows||3}" placeholder="Type your answer here…"></textarea>
      <div class="qtools"><button class="btn small" data-starter="${q.id}">✏️ Help me start</button></div>`;
  }
  return `<div class="q" id="q-${q.id}">
    <div class="qhead"><span class="qicon">${q.icon}</span>${q.type==='ticks'?`<span class="qtext">${esc(q.text)}</span>`:`<label class="qtext" for="a-${q.id}">${esc(q.text)}</label>`}<span class="qok" aria-hidden="true">✓</span></div>
    <p class="qhint">${esc(q.hint)}</p>
    ${q.ex?`<div class="qex">📝 Example: ${esc(q.ex)}</div>`:''}
    ${body}</div>`;
}

/* ═════════════ DRAWING PAD ═════════════ */
let padApi=null;
function initPad(){
  const cv=$('#pad'), c=cv.getContext('2d'); let on=false,last=null,color='#2B1F0E',undo=[];
  const wipe=()=>{c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);};
  const load=()=>{ wipe(); undo=[]; if(state.drawn&&state.drawing){const im=new Image(); im.onload=()=>c.drawImage(im,0,0,cv.width,cv.height); im.src=state.drawing;} };
  const pos=e=>{const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  const snap=()=>{ try{undo.push(c.getImageData(0,0,cv.width,cv.height)); if(undo.length>12) undo.shift();}catch(e){} };
  const commit=()=>{ try{state.drawing=cv.toDataURL('image/jpeg',0.85); state.drawn=true;}catch(e){} save(); refresh(); };
  const seg=(a,b)=>{ c.strokeStyle=color==='erase'?'#fff':color; c.lineWidth=color==='erase'?30:6; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} snap(); on=true; last=pos(e); seg(last,[last[0]+.1,last[1]+.1]); });
  cv.addEventListener('pointermove',e=>{ if(!on) return; const p=pos(e); seg(last,p); last=p; });
  const end=()=>{ if(on){on=false; commit();} };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  $$('[data-color]').forEach(b=>b.addEventListener('click',()=>{ color=b.dataset.color; $$('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x===b)); }));
  $('#padUndo').addEventListener('click',()=>{ const im=undo.pop(); if(im){ c.putImageData(im,0,0); if(undo.length) commit(); else {state.drawing='';state.drawn=false;save();refresh();} } });
  $('#padClear').addEventListener('click',()=>{ snap(); wipe(); state.drawing=''; state.drawn=false; save(); refresh(); });
  load(); padApi={load};
}

let tts=null, reading=false;
function setReadLabels(){ $$('[data-read]').forEach(b=>b.textContent=reading?'⏹ Stop reading':'🔊 Read to me'); }
function stopReading(){
  if(!reading) return; reading=false; setReadLabels();

}
async function readStep(n){
  if(reading){ stopReading(); return; }
  const s=STEPS[n-1];
  const text=`Step ${s.n}. ${s.title}. ${s.intro} `+s.qs.map((q,i)=>`Question ${i+1}. ${q.text} ${q.hint}`).join(' ');
  reading=true; setReadLabels();
  try{
    if(tts) await tts.speak(text.slice(0,1900),{voice:'rounded',rate:0.9,language:'en'});
    else await new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.rate=0.9; u.lang='en'; u.onend=u.onerror=res; speechSynthesis.cancel(); speechSynthesis.speak(u); });
  }catch(e){}
  reading=false; setReadLabels();
}
function initReading(){
  const reveal=()=>$$('[data-read]').forEach(b=>b.hidden=false);
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('tts').then(t=>{ if(t){tts=t; reveal();} }).catch(()=>{});

}

/* ═════════════ PDF ═════════════ */
const PW=1654, PH=2339, MG=120;             // A4 at 200 dpi
const STEP_COL={sun:'#FFD479',leaf:'#9FE0B8',sky:'#A5E0F9',clay:'#FFBFA3',berry:'#FFB5CE',plum:'#CBBCF7',teal:'#9BE5EE',gold:'#F9D684'};
const PFONT='"Nunito","Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif';
const loadImg=src=>new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;});

async function makePdf(ideaId,mine){
  try{ await Promise.all([document.fonts.load('700 30px Nunito'),document.fonts.load('900 30px Nunito')]); }catch(e){}
  const idea=IDEAS.find(i=>i.id===ideaId)||null;
  const A=id=>mine?ans(id):'';
  const project=(mine&&state.project.trim())||(idea?idea.name:'');
  const who=mine?state.name.trim():'';
  let img=null; if(mine&&state.drawn&&state.drawing){ try{img=await loadImg(state.drawing);}catch(e){} }

  const cv=document.createElement('canvas'); cv.width=PW; cv.height=PH;
  const c=cv.getContext('2d'); c.textBaseline='top';
  const jpegs=[]; let y=0, page=0;
  const W=PW-2*MG, BOTTOM=PH-MG-30;
  const F=(w,s)=>`${w} ${s}px ${PFONT}`;
  const rr=(x,yy,w,h,r)=>{ c.beginPath(); c.moveTo(x+r,yy); c.arcTo(x+w,yy,x+w,yy+h,r); c.arcTo(x+w,yy+h,x,yy+h,r); c.arcTo(x,yy+h,x,yy,r); c.arcTo(x,yy,x+w,yy,r); c.closePath(); };
  function finish(){
    c.font=F(700,24); c.fillStyle='#8A7763'; c.textAlign='center';
    c.fillText(`${project?project+'  ·  ':''}My Project Notes  ·  Page ${page}`,PW/2,PH-90); c.textAlign='left';
    const b=atob(cv.toDataURL('image/jpeg',0.88).split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); jpegs.push(u);
  }
  function newPage(){ if(page) finish(); page++; c.fillStyle='#fff'; c.fillRect(0,0,PW,PH); y=MG; }
  const need=h=>{ if(y+h>BOTTOM) newPage(); };
  const CJK='\\u3000-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef';
  const TOK=new RegExp(`\\s+|[${CJK}]|[^\\s${CJK}]+`,'g');
  function wrap(str,font,maxW){
    c.font=font; const out=[];
    for(const para of String(str).split('\n')){
      let line='';
      for(const t of (para.match(TOK)||[''])){
        if(c.measureText(line+t).width<=maxW){ line+=t; continue; }
        if(line.trim()) out.push(line.trimEnd());
        line=t.trimStart();
        while(c.measureText(line).width>maxW){ let i=line.length-1; while(i>1&&c.measureText(line.slice(0,i)).width>maxW) i--; out.push(line.slice(0,i)); line=line.slice(i); }
      }
      out.push(line.trimEnd());
    }
    return out;
  }
  function text(str,o={}){
    const size=o.size||30, font=F(o.weight||700,size), x=o.x||MG, w=o.w||(W-(x-MG)), lh=size*(o.lh||1.42);
    for(const l of wrap(str,font,w)){ need(lh); c.font=font; c.fillStyle=o.color||'#2B1F0E'; c.fillText(l,x,y); if(o.bar){c.fillStyle=o.bar; c.fillRect(MG,y-4,10,lh);} y+=lh; }
    y+=(o.gap===undefined?12:o.gap);
  }
  function lines(n){ for(let i=0;i<n;i++){ need(72); y+=72; c.strokeStyle='#CDBBA5'; c.lineWidth=2; c.beginPath(); c.moveTo(MG,y-8); c.lineTo(PW-MG,y-8); c.stroke(); } y+=22; }
  function answer(val,col,n){ if(val){ y+=4; text(val,{size:31,weight:700,x:MG+34,bar:col,gap:26}); } else lines(n||3); }
  function tickRow(label,on){
    need(64); c.strokeStyle='#2B1F0E'; c.lineWidth=4; rr(MG,y+2,40,40,8); c.stroke();
    if(on){ c.strokeStyle='#2F9E5B'; c.lineWidth=7; c.lineCap='round'; c.beginPath(); c.moveTo(MG+8,y+24); c.lineTo(MG+17,y+34); c.lineTo(MG+33,y+10); c.stroke(); }
    const yy=y; text(label,{size:30,x:MG+62,gap:0}); y=Math.max(y,yy+46)+14;
  }
  function heading(label,col){ need(330); y+=14; c.fillStyle=col; rr(MG,y,W,86,22); c.fill(); c.font=F(900,40); c.fillStyle='#2B1F0E'; c.fillText(label,MG+28,y+20); y+=86+26; }
  function field(label,val){
    c.font=F(900,30); c.fillStyle='#6B5744'; c.fillText(label,MG,y+10); const x=MG+250;
    if(val){ const ls=wrap(val,F(900,40),W-250); c.font=F(900,40); c.fillStyle='#2B1F0E'; ls.slice(0,2).forEach((l,i)=>c.fillText(l,x,y+i*54)); y+=Math.min(ls.length,2)*54+16; }
    else{ c.strokeStyle='#CDBBA5'; c.lineWidth=2; c.beginPath(); c.moveTo(x,y+50); c.lineTo(PW-MG,y+50); c.stroke(); y+=76; }
  }

  /* cover */
  newPage();
  const g=c.createLinearGradient(0,0,PW,0); g.addColorStop(0,'#E8590C'); g.addColorStop(.55,'#D6336C'); g.addColorStop(1,'#6741D9');
  c.fillStyle=g; c.fillRect(0,0,PW,300);
  c.fillStyle='#fff'; c.font=F(900,92); c.fillText('🦉 My Project Notes',MG,78);
  c.font=F(700,34); c.fillText('My Project Maker  ·  plan it, build it, share it',MG,202);
  y=360;
  field('Project',project); field('Inventor',who);
  field('Date',mine?new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}):'');
  y+=10;

  /* starter notes for a chosen idea */
  if(idea){
    heading(`${idea.icon}  Starter notes: ${idea.name}`,'#FFE9A8');
    text(`${idea.level}  ·  ${idea.time}`,{size:28,color:'#6B5744'});
    text('The problem it fixes',{size:32,weight:900,gap:2}); text(idea.solves);
    text('You will need',{size:32,weight:900,gap:2}); idea.need.forEach(n=>text('•  '+n,{gap:2})); y+=12;
    text('How to build it',{size:32,weight:900,gap:2}); idea.steps.forEach((s,i)=>text(`${i+1}.  ${s}`,{gap:6})); y+=8;
    text('🤝 Ask a grown-up to help with',{size:32,weight:900,gap:2}); text(idea.adult);
    text('🧪 Test it',{size:32,weight:900,gap:2}); text(idea.test);
    text('These steps are a starting point. Change them to make the project your own!',{size:27,color:'#6B5744',gap:20});
  }else{
    text('Answer each question. If a space is empty, write on the lines with a pencil.',{size:28,color:'#6B5744',gap:16});
  }

  /* the 8 steps */
  for(const s of STEPS){
    const col=STEP_COL[s.color];
    heading(`${s.icon}  Step ${s.n}: ${s.title}`,col);
    if(s.n===2){
      const m=mine?state.mats:[];
      text('👆 My materials',{size:32,weight:900,gap:4});
      if(m.length) answer(m.join(', '),col);
      else text('Circle the ones you will use:  '+MATERIALS.map(x=>x.name).join('   ·   '),{size:28,color:'#6B5744',gap:24,lh:1.7});
    }
    for(const q of s.qs){
      need(210);
      text(`${q.icon}  ${q.text}`,{size:32,weight:900,gap:4});
      if(q.type==='ticks'){ y+=8; q.ticks.forEach(t=>tickRow(t[1],mine&&!!state.checks[t[0]])); y+=14; continue; }
      const val=A(q.id);
      if(!val) text(q.hint,{size:26,color:'#6B5744',gap:0});
      if(q.type==='draw'){
        const h=img?Math.round(W*img.height/img.width):760;
        need(h+30); y+=10;
        if(img) c.drawImage(img,MG,y,W,h);
        c.strokeStyle='#CDBBA5'; c.lineWidth=3; rr(MG,y,W,h,18); c.stroke(); y+=h+26;
        if(val) answer(val,col); else lines(2);
        continue;
      }
      answer(val,col,q.rows>=5?6:3);
    }
  }

  /* checklist */
  heading('✅  My checklist','#C9F0D8');
  STEPS.forEach(s=>tickRow(`Step ${s.n}: ${s.short}`,mine&&stepDone(s)));
  y+=18; text('Bonus checks',{size:32,weight:900,gap:10});
  BONUS.forEach(b=>tickRow(b[2],mine&&!!state.checks[b[0]]));
  y+=24; need(80); text('🎉 Well done, Inventor! Keep these notes with your project.',{size:32,weight:900,color:'#96204F'});
  finish();
  return pdfFromJpegs(jpegs);
}

function pdfFromJpegs(jpegs){
  const enc=new TextEncoder(), parts=[], xref=[]; let off=0;
  const push=d=>{ const u=typeof d==='string'?enc.encode(d):d; parts.push(u); off+=u.length; };
  const obj=(n,body)=>{ xref[n]=off; push(`${n} 0 obj\n${body}\nendobj\n`); };
  push('%PDF-1.4\n');
  const N=jpegs.length;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${N} /Kids [${jpegs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`);
  jpegs.forEach((jpg,i)=>{
    const p=3+i*3, content='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    obj(p+1,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    xref[p+2]=off;
    push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
    push(jpg); push('\nendstream\nendobj\n');
  });
  const total=2+N*3, start=off;
  push(`xref\n0 ${total+1}\n0000000000 65535 f \n`+Array.from({length:total},(_,i)=>String(xref[i+1]).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

let pdfBusy=false;
async function downloadPdf(ideaId,mine,btn){
  if(pdfBusy) return; pdfBusy=true;
  const old=btn?btn.innerHTML:''; if(btn){btn.disabled=true; btn.textContent='⏳ Making your PDF…';}
  try{
    const blob=await makePdf(ideaId,mine);
    const idea=IDEAS.find(i=>i.id===ideaId);
    const base=((mine&&state.project.trim())||(idea&&idea.name)||'my-project').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'')||'my-project';
    const filename=base.slice(0,60)+'-notes.pdf';
    if(window.claude&&typeof window.claude.use==='function'){
      let dl=null; try{dl=await window.claude.use('downloads');}catch(e){}
      if(!dl){ toast('Sorry, PDF downloads do not work in this view. Ask a grown-up for help.'); }
      else{
        try{ await dl.save({filename,data:blob}); toast('📄 Your PDF is saved!'); }
        catch(e){ toast(e&&e.code==='declined'?'OK! Tap the button again when you want your PDF.':e&&e.code==='rate_limited'?'Please wait a moment, then try again.':'Sorry, the PDF could not be saved here.'); }
      }
    }else{
      const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000); toast('📄 Your PDF is downloading!');
    }
  }catch(e){ toast('Sorry, something went wrong making the PDF. Please try again.'); }
  if(btn){btn.disabled=false; btn.innerHTML=old;} pdfBusy=false;
}

/* ═════════════ EVENTS ═════════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.pdf){ downloadPdf(state.ideaId,true,t); return; }
  if('ideaPdf' in t.dataset){ const id=t.dataset.ideaPdf; downloadPdf(id,!!id&&id===state.ideaId,t); return; }
  if(t.dataset.ideaPick){
    const idea=IDEAS.find(i=>i.id===t.dataset.ideaPick); state.ideaId=idea.id;
    if(!state.project.trim()||IDEAS.some(i=>i.name===state.project.trim())){ state.project=idea.name; $('#f-project').value=idea.name; }
    idea.mats.forEach(m=>{ if(!state.mats.includes(m)) state.mats.push(m); });
    save(); refresh(); toast(`${idea.icon} Great choice! Its notes are now in your PDF.`); return;
  }
  if(t.dataset.mat){ const m=t.dataset.mat, i=state.mats.indexOf(m); if(i<0) state.mats.push(m); else state.mats.splice(i,1); save(); refresh(); return; }
  if('filter' in t.dataset){ const f=t.dataset.filter; $$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===t)); $$('.mat').forEach(m=>m.hidden=!!f&&!m.dataset.props.split(' ').includes(f)); return; }
  if(t.dataset.starter){ const q=STEPS.flatMap(s=>s.qs).find(q=>q.id===t.dataset.starter), ta=$('#a-'+q.id); if(!ta.value.trim()){ ta.value=q.starter; state.answers[q.id]=q.starter; save(); } ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return; }
  if(t.dataset.read){ readStep(+t.dataset.read); return; }
  if(t.dataset.go){ show(t.dataset.go); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q){ state.answers[t.dataset.q]=t.value; save(); refresh(); }
  else if(t.dataset.field){ state[t.dataset.field]=t.value; save(); refresh(); }
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset.check) return;
  state.checks[t.dataset.check]=t.checked; save(); refresh();
});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.contains('open')?closeSide():openSide());
$('#overlay').addEventListener('click',closeSide);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSide(); });
$('#sizeUp').addEventListener('click',()=>{ state.size=Math.min(SIZES.length-1,state.size+1); applySize(); save(); });
$('#sizeDown').addEventListener('click',()=>{ state.size=Math.max(0,state.size-1); applySize(); save(); });
window.addEventListener('hashchange',()=>show(location.hash.slice(1),true));

/* ═════════════ START ═════════════ */
buildSide(); buildPanels(); renderWarn(); fillInputs(); applySize(); initPad(); refresh(); initReading();
$('#resetBtn').addEventListener('click',()=>{ const d=$('#resetDlg'); if(d.showModal) d.showModal(); else d.setAttribute('open',''); });
$('#resetNo').addEventListener('click',()=>$('#resetDlg').close());
$('#resetYes').addEventListener('click',()=>{ const size=state.size; state=blank(); state.size=size; doneBefore=[]; save(); fillInputs(); padApi.load(); refresh(); $('#resetDlg').close(); show('home'); toast('Fresh start! What will you build?'); });
show(location.hash.slice(1)||'home',true);
</script>
