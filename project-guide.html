<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Picker — Find Your Perfect Project!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg1: #FFF3E0;
    --bg2: #FFE8F0;
    --ink: #2D2A4A;
    --ink-soft: #5B567E;
    --card: #FFFFFF;
    --shadow: rgba(45, 42, 74, 0.14);
    --display: 'Baloo 2', cursive;
    --head: 'Fredoka', sans-serif;
    --body: 'Nunito', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: var(--body);
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 18%, #FFD6A5 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, #C7F0FF 0%, transparent 40%),
      radial-gradient(circle at 78% 88%, #FFC8DD 0%, transparent 45%),
      radial-gradient(circle at 20% 85%, #CDFFD8 0%, transparent 42%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* floating doodles */
  .doodle {
    position: fixed;
    font-size: 2.4rem;
    opacity: 0.5;
    pointer-events: none;
    animation: float 7s ease-in-out infinite;
    z-index: 0;
    filter: saturate(1.1);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding: 22px 18px 80px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    min-height: 52px;
  }
  .back-btn {
    border: none;
    background: var(--card);
    color: var(--ink);
    font-family: var(--head);
    font-weight: 600;
    font-size: 1rem;
    padding: 12px 20px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform .12s ease, box-shadow .12s ease;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
  }
  .back-btn.show { opacity: 1; transform: none; pointer-events: auto; }
  .back-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }

  .crumb {
    font-family: var(--head);
    font-weight: 500;
    color: var(--ink-soft);
    font-size: .95rem;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .crumb b { color: var(--ink); }

  /* ---------- Screen transitions ---------- */
  .screen { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop {
    from { opacity: 0; transform: scale(.96) translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Hero (home) ---------- */
  .hero { text-align: center; margin-bottom: 26px; }
  .hero .mascot {
    font-size: 4.6rem;
    display: inline-block;
    animation: bounce 2.4s ease-in-out infinite;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.12));
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }
  .hero h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    line-height: 1.02;
    margin: 6px 0 6px;
    color: var(--ink);
    letter-spacing: -.5px;
  }
  .hero h1 .pop1 { color: #FF6B6B; }
  .hero h1 .pop2 { color: #4D96FF; }
  .hero h1 .pop3 { color: #52B788; }
  .hero p {
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    color: var(--ink-soft);
    font-weight: 700;
    max-width: 560px;
    margin: 0 auto;
  }
  .big-surprise {
    margin-top: 18px;
    border: none;
    background: linear-gradient(135deg, #FF6B6B, #FF9F1C, #FFB703);
    background-size: 200% 200%;
    color: #fff;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    padding: 16px 32px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 7px 0 rgba(190,90,30,.35);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: shimmer 4s ease infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .big-surprise:hover { transform: translateY(-3px) scale(1.03); }
  .big-surprise:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(190,90,30,.35); }

  .section-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    margin: 4px 0 18px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title .tag {
    font-size: 2rem;
  }
  .section-sub {
    font-weight: 700;
    color: var(--ink-soft);
    margin: -10px 0 20px;
    font-size: 1.05rem;
  }

  /* ---------- Card grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .grid.two { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

  .card {
    --c: #FF6B6B;
    position: relative;
    border: none;
    text-align: left;
    background: var(--card);
    border-radius: 22px;
    padding: 18px 16px 16px;
    cursor: pointer;
    box-shadow: 0 7px 0 var(--shadow);
    transition: transform .14s ease, box-shadow .14s ease;
    overflow: hidden;
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 132px;
    animation: cardIn .5s backwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(.95); }
    to { opacity: 1; transform: none; }
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 8px;
    background: var(--c);
  }
  .card:hover { transform: translateY(-5px) rotate(-1deg); box-shadow: 0 12px 0 var(--shadow); }
  .card:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--shadow); }
  .card .ic {
    font-size: 2.5rem;
    line-height: 1;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.1));
  }
  .card .nm {
    font-family: var(--head);
    font-weight: 600;
    font-size: 1.08rem;
    color: var(--ink);
    line-height: 1.12;
  }
  .card .bl {
    font-size: .86rem;
    font-weight: 600;
    color: var(--ink-soft);
    line-height: 1.25;
  }
  .card .chev {
    margin-top: auto;
    align-self: flex-end;
    font-family: var(--head);
    font-weight: 600;
    color: var(--c);
    font-size: .9rem;
  }

  /* ---------- Detail screen ---------- */
  .detail-head {
    background: var(--card);
    border-radius: 26px;
    padding: 24px 22px;
    box-shadow: 0 8px 0 var(--shadow);
    position: relative;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .detail-head::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: var(--c);
    opacity: .14;
  }
  .detail-head .big-ic {
    font-size: 3.6rem;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,.12));
  }
  .detail-head h2 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    margin: 6px 0 4px;
    color: var(--ink);
    line-height: 1.04;
  }
  .detail-head .tagline {
    font-family: var(--head);
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--c);
  }

  .panel {
    background: var(--card);
    border-radius: 22px;
    padding: 20px 20px 22px;
    box-shadow: 0 7px 0 var(--shadow);
    margin-bottom: 20px;
  }
  .panel h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--ink);
  }
  .panel h3 .e { font-size: 1.4rem; }

  .needs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pill {
    background: var(--bg2);
    border: 2.5px dashed var(--c);
    color: var(--ink);
    font-weight: 700;
    font-size: .95rem;
    padding: 8px 14px;
    border-radius: 14px;
  }

  .steps { list-style: none; counter-reset: s; }
  .step {
    counter-increment: s;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 2px dotted #EDE9F5;
    cursor: pointer;
  }
  .step:last-child { border-bottom: none; }
  .step .num {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--c);
    color: #fff;
    font-family: var(--head);
    font-weight: 600;
    font-size: 1.15rem;
    display: grid;
    place-items: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
    transition: transform .15s ease;
  }
  .step .num::before { content: counter(s); }
  .step .tx {
    font-weight: 700;
    font-size: 1.08rem;
    line-height: 1.35;
    padding-top: 5px;
    color: var(--ink);
    flex: 1;
  }
  .step .check {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 9px;
    border: 3px solid #E2DEEF;
    margin-top: 8px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 1.1rem;
    transition: all .15s ease;
  }
  .step.done .tx { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 2px; }
  .step.done .num { transform: scale(.9); opacity: .65; }
  .step.done .check { background: var(--c); border-color: var(--c); }
  .step.done .check::before { content: "✓"; }

  /* ---------- ATL skills ---------- */
  .atl-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 600px) {
    .atl-grid { grid-template-columns: 1fr 1fr; }
  }
  .atl {
    --ac: #9B5DE5;
    background: color-mix(in srgb, var(--ac) 10%, #fff);
    border: 3px solid color-mix(in srgb, var(--ac) 32%, #fff);
    border-radius: 18px;
    padding: 14px 16px 12px;
  }
  .atl-head {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 10px;
  }
  .atl-ic {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 13px;
    background: var(--ac);
    display: grid;
    place-items: center;
    font-size: 1.4rem;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  .atl-cat {
    font-family: var(--head);
    font-weight: 600;
    font-size: 1.12rem;
    color: var(--ink);
    line-height: 1.1;
  }
  .atl-subs {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .atl-sub {
    position: relative;
    padding-left: 22px;
    line-height: 1.3;
  }
  .atl-sub::before {
    content: "";
    position: absolute;
    left: 4px; top: 7px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ac);
  }
  .atl-sub-name {
    display: block;
    font-family: var(--head);
    font-weight: 600;
    font-size: .98rem;
    color: var(--ink);
  }
  .atl-sub-note {
    display: block;
    font-weight: 700;
    font-size: .85rem;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .tipbox {
    background: linear-gradient(135deg, #FFF6D6, #FFE9B8);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    box-shadow: 0 6px 0 rgba(214,168,40,.25);
  }
  .tipbox .bulb { font-size: 1.9rem; flex: 0 0 auto; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.15) rotate(6deg);} }
  .tipbox .tiptx { font-weight: 700; font-size: 1.02rem; line-height: 1.35; }
  .tipbox .tiptx b { color: #B5710B; }

  /* progress bar on detail */
  .progress-wrap {
    margin: 18px 0 4px;
    background: #ECE8F6;
    border-radius: 999px;
    height: 16px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--c);
    border-radius: 999px;
    transition: width .4s cubic-bezier(.2,.9,.3,1.4);
  }
  .progress-label {
    text-align: center;
    font-family: var(--head);
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 8px;
    font-size: .98rem;
  }
  .celebrate {
    text-align: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.3rem;
    color: #52B788;
    margin-top: 6px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .celebrate.show { opacity: 1; animation: pop .5s; }

  .surprise-btn {
    display: block;
    margin: 22px auto 0;
    border: none;
    background: linear-gradient(135deg, #FF6B6B, #FF9F1C);
    color: #fff;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.2rem;
    padding: 16px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 7px 0 rgba(190,60,40,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .surprise-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(190,60,40,.35); }

  .foot {
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 30px;
    font-size: .9rem;
    opacity: .8;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .back-btn { padding: 10px 16px; font-size: .92rem; }
  }


  /* ================= New in the expanded version ================= */
  button { font-family: inherit; }
  :focus-visible { outline: 4px solid #4D96FF; outline-offset: 3px; }

  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 999px;
    padding: 6px 8px 6px 20px; max-width: 520px; margin: 20px auto 0;
    box-shadow: 0 6px 0 var(--shadow);
  }
  .search span { font-size: 1.3rem; }
  .search input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-family: var(--head); font-weight: 500; font-size: 1.08rem; color: var(--ink);
    padding: 10px 0;
  }
  .search input::placeholder { color: #A8A3C2; }
  .search .clear {
    border: none; background: var(--bg2); color: var(--ink); width: 38px; height: 38px;
    border-radius: 50%; font-size: 1rem; cursor: pointer; font-weight: 800;
  }

  .statline {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px 0 4px;
  }
  .stat {
    background: var(--card); border-radius: 999px; padding: 8px 16px;
    font-family: var(--head); font-weight: 600; font-size: .95rem; color: var(--ink-soft);
    box-shadow: 0 4px 0 var(--shadow);
  }
  .stat b { color: var(--ink); }

  .filters { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .frow .lbl { font-family: var(--head); font-weight: 600; color: var(--ink-soft); font-size: .92rem; min-width: 74px; }
  .chip {
    border: none; background: var(--card); color: var(--ink);
    font-family: var(--head); font-weight: 600; font-size: .92rem;
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 var(--shadow); transition: transform .12s ease;
  }
  .chip:active { transform: translateY(2px); }
  .chip.on { background: var(--c, #2D2A4A); color: #fff; }

  .card .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .card .meta span {
    font-size: .74rem; font-weight: 800; color: var(--ink-soft);
    background: #F3F0FA; border-radius: 999px; padding: 3px 8px; white-space: nowrap;
  }
  .card .fav-dot { position: absolute; top: 14px; right: 12px; font-size: 1.1rem; }
  .card .gno {
    position: absolute; top: 16px; right: 12px; font-family: var(--head); font-weight: 600;
    font-size: .74rem; color: #B3AECB;
  }
  .card .fav-dot + .gno { right: 38px; }

  .empty {
    text-align: center; background: var(--card); border-radius: 22px; padding: 30px 20px;
    box-shadow: 0 7px 0 var(--shadow); font-weight: 700; color: var(--ink-soft); font-size: 1.05rem;
  }
  .empty .big { font-size: 3rem; display: block; margin-bottom: 6px; }

  .detail-head .gnum {
    display: inline-block; font-family: var(--head); font-weight: 600; font-size: .85rem;
    color: var(--ink-soft); background: #F3F0FA; border-radius: 999px; padding: 4px 12px; margin-bottom: 4px;
  }
  .facts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
  .fact {
    background: color-mix(in srgb, var(--c) 12%, #fff);
    border-radius: 14px; padding: 8px 14px; font-weight: 800; font-size: .95rem; color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .fact small { display: block; font-size: .7rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; }
  .fact .fe { font-size: 1.3rem; }
  .fav-btn {
    position: absolute; top: 18px; right: 18px; z-index: 2;
    border: none; background: var(--card); width: 54px; height: 54px; border-radius: 50%;
    font-size: 1.6rem; cursor: pointer; box-shadow: 0 5px 0 var(--shadow);
    transition: transform .15s ease; filter: grayscale(1); opacity: .6;
  }
  .fav-btn.on { filter: none; opacity: 1; transform: scale(1.08) rotate(-8deg); }

  .pill { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: var(--body); transition: all .15s ease; }
  .pill .box {
    width: 20px; height: 20px; border-radius: 6px; border: 2.5px solid var(--c); background: #fff;
    display: grid; place-items: center; font-size: .8rem; color: #fff; flex: 0 0 auto;
  }
  .pill.got { background: color-mix(in srgb, var(--c) 16%, #fff); border-style: solid; }
  .pill.got .box { background: var(--c); }
  .pill.got .box::before { content: "✓"; }
  .hint { font-weight: 700; color: var(--ink-soft); font-size: .9rem; margin-top: 12px; }

  .step { width: 100%; background: none; border-left: none; border-right: none; border-top: none; text-align: left; font-family: var(--body); }
  .step .tx { padding-top: 3px; }
  .step .how {
    display: block; font-weight: 600; font-size: .95rem; color: var(--ink-soft);
    margin-top: 4px; line-height: 1.4; text-decoration: none;
  }
  .step.done .how { text-decoration: none; opacity: .7; }
  .step.done .tx b { text-decoration: line-through; text-decoration-thickness: 2px; }
  .step.done .tx { text-decoration: none; }
  .step .tx b { font-weight: 800; }

  .safebox {
    background: linear-gradient(135deg, #FFE5E5, #FFD3D3);
    border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start;
    box-shadow: 0 6px 0 rgba(214,60,60,.2); margin-bottom: 20px;
  }
  .safebox .se { font-size: 1.9rem; flex: 0 0 auto; }
  .safebox .stx { font-weight: 700; font-size: 1.02rem; line-height: 1.35; }
  .safebox .stx b { color: #B32424; }

  .upbox {
    background: linear-gradient(135deg, #E3F4FF, #D6E6FF);
    border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start;
    box-shadow: 0 6px 0 rgba(60,110,214,.2); margin-top: 14px;
  }
  .upbox .ue { font-size: 1.9rem; flex: 0 0 auto; }
  .upbox .utx { font-weight: 700; font-size: 1.02rem; line-height: 1.35; }
  .upbox .utx b { color: #1F5FBF; }

  .qs { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .qs li {
    background: #F7F4FD; border-radius: 14px; padding: 12px 14px 12px 46px; position: relative;
    font-weight: 700; font-size: 1.02rem; line-height: 1.35;
  }
  .qs li::before { content: "💭"; position: absolute; left: 13px; top: 10px; font-size: 1.3rem; }

  .printcard {
    background: var(--card); border-radius: 22px; padding: 18px 20px; margin-top: 20px;
    box-shadow: 0 7px 0 var(--shadow); display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    border: 3px dashed color-mix(in srgb, var(--c) 55%, #fff);
  }
  .printcard[hidden] { display: none; }
  .printcard .pe { font-size: 2.4rem; }
  .printcard .ptx { flex: 1 1 220px; font-weight: 700; color: var(--ink-soft); font-size: .98rem; line-height: 1.35; }
  .printcard .ptx b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--ink); }
  .print-btn {
    border: none; background: var(--ink); color: #fff; font-family: var(--display); font-weight: 800;
    font-size: 1.1rem; padding: 14px 24px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .12s ease, box-shadow .12s ease;
  }
  .print-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .print-btn:disabled { opacity: .6; cursor: wait; }
  .printmsg { text-align: center; font-weight: 700; color: var(--ink-soft); min-height: 1.4em; margin-top: 10px; }
  .printnote {
    text-align: center; font-weight: 700; color: var(--ink-soft); font-size: .95rem; margin: 18px 0 0;
  }
  .printnote b { color: var(--ink); }
  .next-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
  .next-row .surprise-btn { margin: 0; font-size: 1.05rem; padding: 14px 24px; }
  .next-row .plain {
    background: var(--card); color: var(--ink); box-shadow: 0 7px 0 var(--shadow);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

"],"tip":"Use big words and one main picture so it's easy to read.","atls":[{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Make a clear message with words and art."},{"name":"Media literacy","note":"Use design tools well."}]},{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Choose what looks best."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["A grown-up can log in for you. Choose 'Poster' so it prints at the right size.","Pick a template that already matches the feeling of your message.","Keep the title short, 5 words or fewer, and make it the biggest thing on the page.","Use just 2 or 3 colors and 1 or 2 fonts so it doesn't look messy.","Zoom out and check: can you read it from across the room?"],"safe":"Only use Canva with a grown-up, and never type your full name or address.","up":"Make a second version for a different audience, like little kids or parents. What changes?","q":["What is the ONE thing you want people to remember from your poster?","How did you decide which colors and fonts to use?"]},{"id":"recycleart","icon":"♻️","name":"Recycling Art","blurb":"Turn trash into treasure!","need":["Clean recycling (bottles, caps, boxes)","Glue and tape","Paint"],"steps":["Collect clean things you'd throw away.","Wash them and let them dry.","Think about what to build, like an animal.","Glue and tape the pieces together.","Paint and decorate it!"],"tip":"Bottle caps make great eyes and buttons!","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Imagine new uses for old things."},{"name":"Transfer","note":"Turn one idea into a new object."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Collect and clean materials first."}]}],"t":"2 hours","g":"Me or a partner","lv":2,"d":["Ask at home and at school. Look for boxes, tubes, caps, and cartons.","Sticky or wet materials won't hold glue or paint, so dry them fully.","Lay the pieces out on the table and move them around before you stick anything."," rate!"],"tip":"Plan with a pencil sketch before painting.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Paint it as a team."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Share a message through art."}]}],"t":"2–3 days","g":"Whole class","lv":3,"d":["List ideas, then vote. The theme should mean something to everyone.","Draw a small plan on paper first, then copy it big in light pencil.","Write names on the plan so everyone knows their space.","Paint backgrounds first and details last. Rinse brushes between colors.","Step back and look from far away, then touch up any gaps."],"safe":"Wear an old shirt and cover the floor before opening any paint.","up":"Hide 5 tiny surprises in the mural and make a 'can you find it?' list for visitors.","q":["How did your group agree on one idea?","What does your mural tell people about your class?"]},{"id":"gallery","icon":"🏛️","name":"Class Art Gallery","blurb":"Show off everyone's art like a museum!","need":["Artwork from the class","Tape or string","Paper for labels"],"steps":["Ask everyone to pick one piece of art.","Find a wall or hallway to use.","Hang the art in a neat row.","Make a label with each artist's name.","Invite other classes to look!"],"tip":"Give your gallery a fun name on a big sign.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Set up the gallery as a team."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Make labels and explain the art."}]}],"t":"2–3 days","g":"Whole class","lv":2,"d":["Each artist chooses the piece they feel proudest of.","Ask your teacher which wall you can use and for how long.","Hang art at kids' eye level with the same space between each piece.","Write the title, artist, and what it's made from on each label.","Make invitations and choose guides to show visitors around."],"safe":"","up":"Add a comment box where visitors can leave kind notes for the artists.","q":["What did you learn from looking at your classmates' art?","How did it feel to see your work on display?"]},{"id":"costumes","icon":"👗","name":"Design Costumes","blurb":"Make costumes for characters or themes!","need":["Old clothes or fabric","Cardboard","Tape and glue","Markers"],"steps":["Pick a character or theme you love.","Look at pictures to get ideas.","Use cardboard and fabric for big pieces.","Decorate with colors and details.","Try it on and show your friends!"],"tip":"Ask a grown-up before cutting any clothes.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Design a costume from your imagination."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Gather materials first."},{"name":"Staying focused","note":"Build it one piece at a time."}]}],"t":"2 hours","g":"Me or a partner","lv":2,"d":["It could be from a book, history, or your own imagination.","Notice the 3 things that make the character easy to recognize.","Cardboard is great for hats, shields, and wings. Fabric is great for capes.","Paint, foil, and markers turn plain cardboard into something special.","Move, sit, and walk in it. Fix anything that falls off or pokes."],"safe":"Make sure you can see, breathe, and walk easily in your costume.","up":"Design the costume on paper first with labels, like a real costume designer.","q":["How does your costume show who the character is?","What problem did you have to solve while building it?"]},{"id":"logo","icon":"✨","name":"Class Logo","blurb":"Design a symbol for your class!","need":["Paper","Pencils and markers"],"steps":["Talk about what your class is like.","Sketch some logo ideas.","Pick simple shapes and colors.","Vote on the best one.","Draw the final logo neatly!"],"tip":"Simple logos are easy to remember.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Turn ideas into one simple symbol."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Decide together as a class."}]}],"t":"1 hour","g":"Whole class","lv":2,"d":["Write down 5 words that describe your class.","Everyone draws at least 3 quick ideas. Quick and messy is fine!","A good logo still looks clear when it's tiny.","Put the sketches up and give everyone one or two votes.","Use a ruler and a black outline, then add your class colors."],"safe":"","up":"Put your logo on a class flag, door sign, or badge.","q":["What does each shape or color in the logo stand for?","How did the class decide fairly?"]},{"id":"clay","icon":"🏺","name":"Clay Creatures","blurb":"Shape clay into animals and pots!","need":["Air-dry clay","A cup of water","A pencil or stick for details","Paint"],"steps":["Roll a ball of clay in your hands.","Press your thumb in to make a pinch pot.","Add legs, ears, or a tail to make a creature.","Smooth the joins with a wet finger.","Let it dry, then paint it!"],"tip":"Scratch both pieces before joining so they stick together.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Turn a lump into a creature."}]},{"cat":"Self-Management","subs":[{"name":"Managing feelings","note":"Fix cracks calmly and keep going."},{"name":"Staying focused","note":"Work slowly on small details."}]}],"t":"2–3 days","g":"Just me","lv":2,"d":["A ball the size of a small orange is just right.","Pinch and turn, pinch and turn, to make the walls even.","Roll little sausages and balls for the extra parts.","Just a drop of water. Too much makes the clay soggy.","Drying takes a day or two. Paint only when it's hard."],"safe":"Clay is not for eating. Wash your hands when you finish.","up":"Make a whole family of creatures in different sizes.","q":["What was tricky about making the parts stick?","What would you sculpt next?"]}],"writing":[{"id":"comic","icon":"💥","name":"Comic Book Series","blurb":"Make your own comic with heroes!","need":["Paper","Pencils and markers","A ruler"],"steps":["Think up a hero and a problem to solve.","Draw boxes called panels on your paper.","Draw the story one panel at a time.","Add speech bubbles for talking.","Color it and add a cool title!"],"tip":"Make a few in a row to turn it into a SERIES!","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent heroes and a story."},{"name":"Critical thinking","note":"Decide what happens in each panel."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Tell the story with pictures and bubbles."}]}],"t":"2 hours","g":"Me or a partner","lv":2,"d":["Give your hero a name, a special power, and one weakness.","Use a ruler. Six panels on a page is a good start.","Sketch lightly in pencil first: beginning, problem, solution.","Write the words first, then draw the bubble around them so they fit.","Outline in black pen before coloring to make it pop."],"safe":"","up":"End on a cliffhanger so readers can't wait for issue 2!","q":["What makes your hero interesting?","Which panel tells the most with the fewest words?"]},{"id":"storybook","icon":"📖","name":"Storybook","blurb":"Write and draw your own book!","need":["Paper","Pencils and crayons","A stapler (ask a grown-up)"],"steps":["Make up a story with characters.","Write one or two sentences per page.","Draw a picture for each page.","Make a cover with a title and your name.","Staple the pages into a book!"],"tip":"Read your book out loud to the class.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent a whole new story."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Match words to each picture."}]}],"t":"2–3 days","g":"Just me","lv":2,"d":["Decide who it's about, where it happens, and what goes wrong.","Plan a beginning, a middle, and an end before you write.","Leave the top half of each page for the picture.","Add the title, your name as author, and a picture that gives a hint.","Number your pages so they stay in the right order."],"safe":"Ask a grown-up to do the stapling.","up":"Add an 'About the Author' page with a drawing of yourself.","q":["What is the problem in your story and how is it , editors, and a layout team.","Ask real people questions and write down exactly what they say.","Every picture needs a caption that explains it.","Give your paper a name, a date, and big headlines."],"safe":"Ask people before using their name or photo.","up":"Interview a grown-up at school, like the principal, the nurse, or the cook.","q":["How did you make sure your facts were true?","What makes a headline exciting to read?"]},{"id":"magazine","icon":"📑","name":"Class Magazine","blurb":"Make a magazine full of fun pages!","need":["Paper","Markers","A computer (optional)"],"steps":["Pick fun sections like jokes, art, and facts.","Each person makes a page.","Add pictures and color.","Put the pages in order.","Make a cover and share it!"],"tip":"Add puzzles or a quiz for readers.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan what goes in the magazine."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Write pages for readers."},{"name":"Media literacy","note":"Choose good pictures."}]}],"t":"1 week","g":"Whole class","lv":2,"d":["Vote on a magazine name and 5 or 6 sections.","Sign up for a page so every section gets covered.","Use bold titles so readers know what each page is about.","Put the most exciting page near the front.","The cover should tease what's inside, like a real magazine."],"safe":"","up":"Add a 'letters from readers' page for the next issue.","q":["Who is your magazine for, and how did you make it fun for them?","What did you learn from a classmate's page?"]},{"id":"encyclopedia","icon":"📚","name":"Topic Encyclopedia","blurb":"Make a fact book about things you love!","need":["Paper or a computer","Books or safe websites","A grown-up helper"],"steps":["Pick a topic, like sharks or planets.","Find true facts from books or websites.","Write one page for each fact or part.","Add pictures and labels.","Put the pages together into a fact book!"],"tip":"Put your facts in ABC order like a real encyclopedia.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Find true facts from good sources."},{"name":"Media literacy","note":"Tell real facts from made-up ones."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Explain facts in your own words."}]}],"t":"1 week","g":"Me or a partner","lv":3,"d":["Pick something you already love. You'll enjoy the research more.","Use at least two sources and check that they agree.","Write in your own words. Don't copy sentences from the book.","Label the parts of your drawings with lines and words.","Add a contents page at the front and a list of your sources at the back."],"safe":"Only use websites a grown-up has checked.","up":"Add a glossary: a list of tricky words and what they mean.","q":["What is the most surprising fact you found?","How do you know your facts are true?"]},{"id":"storychain","icon":"🔗","name":"Story Chain","blurb":"Everyone adds to one big story!","need":["A notebook or big paper","Pencils"],"steps":["The first person starts the story.","Pass it to the next person.","Keep passing it around the class.","Read what came before, then add on.","Read the whole silly story at the end!"],"tip":"Set a timer so everyone gets a turn.","atls":[{"cat":"Social","subs":[{"name":"Working with others","note":"Build one story together."}]},{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Add a new idea to the story."},{"name":"Critical thinking","note":"Make your part fit."}]}],"t":"45 min","g":"Whole class","lv":1,"d":["Begin with a character and a place, then stop mid-sentence!","Each writer adds two or three sentences.","Fold or pass the paper along quietly so the story stays a surprise.","Keep the same characters so the story makes sense.","Choose a reader with a big voice, or take turns reading."],"safe":"","up":"Add a rule: every person must use one mystery word pulled from a hat.","q":["How did you make your part fit with what came before?","What was the funniest twist in the story?"]},{"id":"diary","icon":"📔","name":"Class Diary","blurb":"Write about what your class does!","need":["A notebook","A pencil"],"steps":["Pick one writer each day.","Write the date at the top.","Write the best thing that happened.","Add a small drawing.","Read old pages to remember fun days!"],"tip":"Take turns so everyone gets a day.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Write a little each day."},{"name":"Reflection","note":"Think back on the best moments."}]},{"cat":"Communication","subs":[{"name":"Writing","note":"Describe the day clearly."}]}],"t":"2+ weeks","g":"Whole class","lv":1,"d":["Make a calendar so everyone knows their day.","Add the day of the week and the weather too.","Write 3 to 5 sentences. Include how the class felt.","Draw the moment you want to remember most.","Read one old page aloud each Friday."],"safe":"","up":"At the end of term, vote for the 'Top 5 Days' and make a poster.","q":["What moment would you never want to forget?","How has our class changed since the first page?"]},{"id":"play","icon":"🎬","name":"Write a Play","blurb":"Write a script and act it out!","need":["Paper and pencil","Friends to act","A space to perform"],"steps":["Think of a fun story.","Decide who the characters are.","Write what each one says.","Give each friend a part.","Practice, then perform it!"],"tip":"Add simple costumes to make it more fun.","atls":[{"cat":"Communication","subs":[{"name":"Writing","note":"Write the lines."},{"name":"Speaking","note":"Say them loud and clear."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Perform together as a team."}]}],"t":"1 week","g":"Small team","lv":3,"d":["Keep it short, about 5 minutes, with a clear problem to solve.","Give every character a name and one special trait, like 'grumpy' or 'brave'.","Write the character's name, then a colon, then their words.","Let people choose, or pull names from a hat to keep it fair.","Run through it at least three times. Face the audience and speak up!"],"safe":"","up":"Add stage directions in brackets, like (whispers) or (jumps up).","q":["How did you show a character's feelings using only their words?","What did your team do well together?"]},{"id":"recipebook","icon":"🍪","name":"Class Recipe Book","blurb":"Collect yummy recipes from every family!","need":["Paper","Pencils and crayons","A favorite family recipe","A grown-up at home to help"],"steps":["Ask at home for a favorite family recipe.","Write the list of ingredients.","Write the steps in order with numbers.","Draw the finished food.","Put everyone's pages into one book!"],"tip":"Add a sentence about why this food is special to your family.","atls":[{"cat":"Communication","subs":[{"name":"Writing","note":"Write steps others can follow."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Collect a recipe from home."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Build one book as a class."}]}],"t":"1 week","g":"Whole class","lv":2,"d":["Simple recipes are best, like a snack, a drink, or a family dish.","Write how much of each thing, like 2 cups or 1 spoon.","Start each step with a doing word: mix, pour, stir, bake.","Add labels to your drawing so it looks delicious.","Sort the pages into snacks, meals, and sweets, then add a cover."],"safe":"Note any nuts, milk, or eggs so people with allergies know.","up":"Add a world map showing where each recipe comes from.","q":["Why is your recipe special to your family?","What makes instructions easy to follow?"]}],"performing":[{"id":"puppet","icon":"🧦","name":"Puppet Show","blurb":"Make puppets and put on a show!","need":["Socks or paper bags","Buttons and yarn","Glue","A table to hide behind"],"steps":["Make puppets from socks or bags.","Add eyes, hair, and a mouth.","Think up a short, fun story.","Hide behind a table and hold them up.","Use silly voices and perform!"],"tip":"A cardboard box makes a great puppet stage.","atls":[{"cat":"Communication","subs":[{"name":"Speaking","note":"Use fun voices for your puppets."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Put on the show with friends."}]}],"t":"2 hours","g":"Small team","lv":2,"d":["Put your hand inside first to check where the mouth will be.","Give each puppet a face that shows its personality.","Two or three characters and one problem is plenty.","Keep your puppet high so the audience can't see your arm.","Only move the puppet that is talking so people know who it is."],"safe":"Ask a grown-up to help with hot glue or sewing.","up":"Add background music or a painted scenery backdrop.","q":["How did you make your puppet's voice match its personality?","What did the audience enjoy most?"]},{"id":"shadowpuppet","icon":"🌑","name":"Shadow Puppet Play","blurb":"Tell a story with shadows!","need":["Cardboard cutouts","Sticks","A flashlight","A white sheet"],"steps":["Cut character shapes from cardboard.","Tape each one to a stick.","Hang a white sheet and shine a light behind it.","Hold puppets between the light and sheet.","Move them to tell your story!"],"tip":"The closer to the light, the bigger the shadow!","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Figure out how shadows make shapes."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Tell a story with shadow shapes."}]}],"t":"2 hours","g":"Small team","lv":2,"d":["Simple, bold shapes work best. Side views are easiest to recognize.","Tape the stick to the back and check it doesn't flop over.","Make the room as dark as you can.","Stand to the side so your own shadow stays out of the story.","Practice moving slowly. Fast movements are hard to follow."],"safe":"Use a flashlight, never a candle. Don't shine it in anyone's eyes.","up":"Cut tiny holes for eyes, or tape colored plastic over a hole for stained-glass shadows.","q":["What happens to a shadow when the puppet moves closer to the light?","How did you tell the story without showing faces?"]},{"id":"talent","icon":"⭐","name":"Talent Show","blurb":"Show off what you're great at!","need":["A space to perform","A sign-up list","An audience"],"steps":["Make a list of who wants to perform.","Each person picks a talent.","Practice your act a few times.","Set up chairs for the audience.","Take turns showing your talents!"],"tip":"Have a host to introduce each act.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Plan and practice your act."},{"name":"Managing feelings","note":"Stay calm in front of others."}]},{"cat":"Communication","subs":[{"name":"Speaking","note":"Perform for the audience."}]}],"t":"1 week","g":"Whole class","lv":2,"d":["Write names and acts on a sign-up sheet.","Anything counts: singing, jokes, magic, juggling, drawing fast!","Keep each act under 2 minutes and time it.","Make a running order and mark where performers stand.","Clap loudly for everyone. Being a great audience is a talent too!"],"safe":"","up":"Design a printed program listing every act.","q":["How did you feel before and after performing?","What did you learn about a classmate that surprised you?"]},{"id":"stopmotion","icon":"🎞️","name":"Stop-Motion Animation","blurb":"Make toys move in a movie!","need":["A tablet or camera (ask a grown-up)","Toys or clay","A steady spot"],"steps":["Set up your toys in a scene.","Take one photo.","Move the toys a tiny bit.","Take another photo. Keep going!","Play the photos fast to see them move!"],"tip":"The smaller you move things, the smoother it looks.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Plan a story that moves."},{"name":"Critical thinking","note":"Plan each tiny movement."}]},{"cat":"Self-Management","subs":[{"name":"Managing feelings","note":"Stay patient through many photos."}]}],"t":"2 hours","g":"Me or a partner","lv":3,"d":["Tape down the background and put your camera on a stand so it can't wiggle.","Keep your hands and shadow out of the picture.","Tiny means about the width of your finger.","You need about 10 photos for each second of movie.","Use a free stop-motion app, or flip quickly through the photos."],"safe":"Ask a grown-up before using a camera or downloading an app.","up":"Add a title card, voices, and sound effects.","q":["Why do the photos look like they're moving?","What would make your next movie even smoother?"]},{"id":"podcast","icon":"🎙️","name":"Storytelling Podcast","blurb":"Record stories to listen to!","need":["A tablet or recorder (ask a grown-up)","A quiet room","A story"],"steps":["Pick a story to tell.","Practice reading it with feeling.","Find a quiet room.","Press record and tell your story.","Listen back and share it!"],"tip":"Make sound effects with your voice, like wind!","atls":[{"cat":"Communication","subs":[{"name":"Speaking","note":"Speak clearly so people can hear."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Practice before recording."},{"name":"Staying focused","note":"Record without losing your place."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["Choose your own story or a favorite short one.","Mark where to pause, get louder, or whisper.","Soft things like cushions and curtains stop echo.","Say the show name and your first name to start.","Record again if needed. Even real podcasters do lots of takes!"],"safe":"Use first names only and ask a grown-up before sharing a recording.","up":"Make a short intro jingle and give your podcast a name.","q":["How did you make your voice interesting to listen to?","What was hard about telling a story with no pictures?"]},{"id":"eduvideo","icon":"🎥","name":"Educational Video","blurb":"Teach something fun in a video!","need":["A tablet or camera (ask a grown-up)","A topic you know","Props"],"steps":["Pick a topic you can teach.","Plan what you'll say.","Practice talking clearly.","Record yourself teaching.","Show your video to the class!"],"tip":"Hold up pictures or objects to help explain.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Learn the topic well."}]},{"cat":"Communication","subs":[{"name":"Speaking","note":"Explain it clearly."},{"name":"Media literacy","note":"Use video to teach."}]}],"t":"2 hours","g":"Me or a partner","lv":2,"d":["Choose something you could explain to a younger kid.","Write 3 main points on a card: start, middle, end.","Look at the camera and talk slower than normal.","Film in a bright, quiet spot. Hold the camera sideways.","Ask viewers one quiz question at the end."],"safe":"Ask a grown-up before filming or sharing a video of yourself.","up":"Film a 'bloopers' ending or add a quiz to hand out.","q":["How do you know your audience understood?","What did you learn by teaching it to others?"]},{"id":"storytime","icon":"🌙","name":"Virtual Storytime","blurb":"Record yourself reading a book!","need":["A favorite book","A tablet or recorder (ask a grown-up)"],"steps":["Pick a fun book to read.","Practice with a happy voice.","Find a comfy, quiet spot.","Record yourself reading and showing pictures.","Share it so others enjoy storytime!"],"tip":"Pause and ask questions like a real storyteller.","atls":[{"cat":"Communication","subs":[{"name":"Speaking","note":"Read out loud with feeling."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Practice the book first."}]}],"t":"45 min","g":"Just me","lv":1,"d":["Choose a book with great pictures that takes about 5 minutes to read.","Give each character a different voice.","Sit with light on your face, not behind you.","Hold each page still for a few seconds so viewers can look.","It's a lovely gift for a younger class or a family member far away."],"safe":"Ask a grown-up before recording or sharing.","up":"Record a series, one book each week, for a younger class.","q":["Why did you choose this book?","How did you make the story exciting for listeners?"]},{"id":"anthem","icon":"🎵","name":"Class Anthem","blurb":"Write and sing a class song!","need":["Paper for words","Voices","Maybe instruments"],"steps":["Talk about what makes your class special.","Write fun words about it.","Pick a tune you all know.","Practice singing it together.","Perform your anthem proudly!"],"tip":"Borrow a tune you already love and add new words.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Make up words for your class."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Sing it together as a team."}]}],"t":"2 hours","g":"Whole class","lv":2,"d":["List things you're proud of, your class jokes, and what you love to do.","Short lines that rhyme are easiest to remember.","Count the beats so your new words fit the music.","Start slow, then speed up once everyone knows the words.","Add clapping or simple actions for the chorus."],"safe":"","up":"Add a second verse or a percussion part with homemade instruments.","q":["Which line of the song says the most about our class?","How did singing together make you feel?"]},{"id":"musicinstrument","icon":"🥁","name":"Make an Instrument","blurb":"Build something you can play!","need":["Boxes, cans, or tubes","Rubber bands","Rice or beans","Tape"],"steps":["Pick an instrument, like a shaker or drum.","Build it from your materials.","Test the sound it makes.","Decorate it.","Play a song with friends!"],"tip":"Rice in a bottle makes a great shaker.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Build something that makes sound."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Test which materials sound best."}]}],"t":"1 hour","g":"Just me","lv":2,"d":["Shakers and drums are easiest. Rubber-band guitars are trickier.","Seal the ends well so nothing spills out.","Try loose and tight bands, or more and less rice. Listen for the change.","Paint, stickers, and ribbon make it yours.","Agree on a beat and take turns playing solos."],"safe":"Tape lids on tightly. Rice and beans are not for eating!","up":"Make instruments with high and low sounds and play a pattern.","q":["What changes the sound of your instrument?","How did you keep a steady beat with others?"]},{"id":"dance","icon":"💃","name":"Dance Routine","blurb":"Make up a dance and perform it!","need":["A song you love","A clear space","A speaker","Friends"],"steps":["Pick a song with a strong beat.","Make up 4 moves you can repeat.","Put the moves in order.","Practice together until you match.","Perform it for an audience!"],"tip":"Count '5, 6, 7, 8' out loud so everyone starts together.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Invent your own moves."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Move in time as a team."}]},{"cat":"Self-Management","subs":[{"name":"Staying focused","note":"Practice until you remember it."}]}],"t":"2 hours","g":"Small team","lv":2,"d":["Choose about one minute of the song, with words that suit school.","Use your arms, feet, and a jump or a turn.","Each move lasts for 8 counts. Give each one a funny name.","Practice slowly without music first, then add the song.","Finish with a big frozen pose and a smile."],"safe":"Clear the floor and leave an arm's length between dancers.","up":"Add a part where everyone does a different solo move.","q":["How did your group remember the order of the moves?","How did the music change how you moved?"]}],"tech":[{"id":"geometrydash","icon":"🎮","name":"Design a Geometry Dash Level","blurb":"Build your own game level to play!","need":["A tablet or computer with the game","A grown-up's OK","Your ideas"],"steps":["Open the level builder in the game.","Plan a start, middle, and finish.","Add jumps and obstacles bit by bit.","Test it by playing it yourself.","Fix the tricky parts and share it!"],"tip":"Test often! Play your level after every few changes.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Design a level that's fun but fair."},{"name":"Critical thinking","note":"Fix parts that are too hard."}]},{"cat":"Self-Management","subs":[{"name":"Staying focused","note":"Test and improve as you build."}]}],"t":"2 hours","g":"Just me","lv":3,"d":["Tap 'Create' to find the editor. Give your level a name.","Draw your plan on paper first: easy start, harder middle, fun ending.","Build a small section, then stop. Don't build it all at once.","If you can't beat it in 5 tries, it's probably too hard.","Ask a friend to play it and watch where they get stuck."],"safe":"Play only with a grown-up's OK, and don't chat with strangers online.","up":"Match your jumps to the beat of the music.","q":["How did you make your level fun but fair?","What did you change after watching someone else play?"]},{"id":"canvaposter","icon":"🖌️","name":"Canva Poster","blurb":"Design a cool poster on the computer!","need":["A computer or tablet","A grown-up to help with Canva","A message"],"steps":["Open Canva and pick a poster size.","Choose a fun template.","Add your title and pictures.","Change colors and fonts.","Save it and print or share!"],"tip":"Use big words and one main picture so it's easy to read.","atls":[{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Make a clear message."},{"name":"Media literacy","note":"Use design tools well."}]},{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Choose what looks best."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["A grown-up can log in for you. Choose 'Poster' so it prints at the right size.","Pick a template that already matches the feeling of your message.","Keep the title short, 5 words or fewer, and make it the biggest thing on the page.","Use just 2 or 3 colors and 1 or 2 fonts so it doesn't look messy.","Zoom out and check: can you read it from across the room?"],"safe":"Only use Canva with a grown-up, and never type your full name or address.","up":"Make a second version for a different audience, like little kids or parents. What changes?","q":["What is the ONE thing you want people to remember from your poster?","How did you decide which colors and fonts to use?"]},{"id":"virtualmuseum","icon":"🖼️","name":"Virtual Museum","blurb":"Make a museum on the computer!","need":["A computer or tablet","Photos or facts","A grown-up helper"],"steps":["Pick a theme, like dinosaurs or space.","Find or draw pictures for exhibits.","Put each on its own slide.","Write a fun fact under each.","Give a tour of your museum!"],"tip":"A slideshow app works great for this.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Find facts for each exhibit."},{"name":"Media literacy","note":"Choose good pictures."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Give a tour of your museum."}]}],"t":"2–3 days","g":"Me or a partner","lv":2,"d":["Choose something you could find 6 to 8 'exhibits' for.","Your own drawings and photos are best. They belong to you!","Add an entrance slide with your museum's name.","Two short sentences per exhibit is enough.","Stand at the front like a museum guide and take questions."],"safe":"Only search for pictures with a grown-up.","up":"Add a 'gift shop' slide or a quiz at the exit.","q":["Which exhibit is the star of your museum and why?","Where did you find your facts?"]},{"id":"virtualfieldtrip","icon":"🌍","name":"Virtual Field Trip","blurb":"Take the class somewhere cool online!","need":["A computer","A grown-up helper","A place to explore"],"steps":["Pick a place, like a zoo or a far country.","Find safe online photos and videos.","Put them in the order of a tour.","Write what to look at on each stop.","Lead the class on the trip!"],"tip":"Pretend you're the tour guide and talk about each stop.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Find safe online info."},{"name":"Media literacy","note":"Pick good photos and videos."}]},{"cat":"Communication","subs":[{"name":"Speaking","note":"Lead others on the tour."}]}],"t":"2–3 days","g":"Me or a partner","lv":2,"d":["Pick somewhere you can't easily visit in real life.","Museums, zoos, and space agencies have great free tours.","Plan 5 or 6 stops: arrive, explore, see the best thing last.","Give one 'look for…' challenge at each stop.","Hand out pretend tickets and tell everyone to buckle up!"],"safe":"Only visit websites a grown-up has checked first.","up":"Make a postcard from the place for classmates to take home.","q":["What is the most amazing thing about this place?","How is it different from where we live?"]},{"id":"website","icon":"🌐","name":"Class Website","blurb":"Build a website for class news!","need":["A computer","A grown-up helper","Class info and pictures"],"steps":["Plan your pages, like News and Photos.","Ask a grown-up for a safe website tool.","Add text and pictures.","Pick fun colors and a title.","Share the link with families!"],"tip":"A few good pages is plenty!","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Plan how pages connect."}]},{"cat":"Communication","subs":[{"name":"Media literacy","note":"Share class news online."},{"name":"Sharing ideas","note":"Make it clear for visitors."}]}],"t":"2+ weeks","g":"Small team","lv":3,"d":["Draw each page as a box on paper and connect them with arrows.","Your teacher will set it up and keep it private for families.","Write short paragraphs with clear headings.","Use the same colors on every page so it feels like one site.","Ask someone to test every link before you share it."],"safe":"No last names, addresses, or photos without permission.","up":"Add a 'Meet the Team' page with drawings of everyone instead of photos.","q":["How did you make the site easy for visitors to use?","What job did you do on the team?"]},{"id":"blog","icon":"📝","name":"Class Blog","blurb":"Post updates about your class!","need":["A computer","A grown-up helper","Things to share"],"steps":["Ask a teacher to set up a safe blog.","Think of something to share.","Write a short post.","Add a photo or drawing.","Post it for families to read!"],"tip":"Take turns so everyone gets to write.","atls":[{"cat":"Communication","subs":[{"name":"Writing","note":"Write posts for others."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Take turns and post on time."}]}],"t":"2+ weeks","g":"Whole class","lv":2,"d":["Your teacher chooses who can read it.","A trip, an experiment, a visitor, or something you learned.","Write a catchy title and 3 to 5 sentences.","Draw a picture and take a photo of it if you don't have a real photo.","Read your post out loud to catch mistakes before posting."],"safe":"First names only. A teacher checks every post.","up":"End each post with a question for readers to answer at home.","q":["Who reads our blog, and what would they like to know?","How is writing for the internet different from writing in a notebook?"]},{"id":"digitalstory","icon":"📱","name":"Digital Storybook","blurb":"Make a story you click through!","need":["A computer or tablet","A story idea","A grown-up helper"],"steps":["Write a short story.","Make one slide per part.","Add pictures to each slide.","Add buttons to go to the next page.","Click through to test it!"],"tip":"Add a fun sound when you turn the page.","atls":[{"cat":"Thinking","subs":[{"name":"Creative thinking","note":"Plan a click-through story."},{"name":"Transfer","note":"Mix words, pictures, buttons."}]},{"cat":"Communication","subs":[{"name":"Media literacy","note":"Use the screen to tell a story."}]}],"t":"2–3 days","g":"Me or a partner","lv":2,"d":["Plan 6 to 8 parts on paper first.","Put only one or two sentences on each slide.","Draw them yourself or use the shapes and drawing tools.","Ask a grown-up to show you how to link a shape to the next slide.","Fix any button that goes to the wrong place."],"safe":"","up":"Add a choice! Let the reader pick between two different endings.","q":["How is a click-through story different from a paper book?","What part will readers like most?"]},{"id":"scrapbook","icon":"📓","name":"Digital Scrapbook","blurb":"Collect photos and memories on screen!","need":["A computer or tablet","Photos","A grown-up helper"],"steps":["Gather photos from the year.","Make a page per memory.","Add photos and write about them.","Decorate with colors and stickers.","Share it with the class!"],"tip":"Add the date so you remember when it happened.","atls":[{"cat":"Self-Management","subs":[{"name":"Organization","note":"Gather and sort memories."},{"name":"Reflection","note":"Look back on the year."}]},{"cat":"Communication","subs":[{"name":"Sharing ideas","note":"Share moments with the class."}]}],"t":"1 week","g":"Small team","lv":2,"d":["Ask your teacher for class photos, or draw the memories.","Put the memories in time order, like a timeline.","Write who, what, and how it felt.","Pick one color theme so pages match.","Present it on the big screen at the end of the year."],"safe":"Only use photos your teacher says are OK to share.","up":"Add a 'quotes of the year' page with funny things people said.","q":["Which memory are you most thankful for?","What did our class get better at this year?"]},{"id":"appidea","icon":"📲","name":"Design an App","blurb":"Plan your own helpful app!","need":["Paper and pencil","Your ideas"],"steps":["Think of a problem an app could fix.","Draw what the screens look like.","Write what each button does.","Give it a name and a logo.","Show your plan and explain it!"],"tip":"You don't need a computer. Drawing the idea counts!","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Solve a problem with an app."},{"name":"Creative thinking","note":"Design new screens."}]},{"cat":"Communication","subs":[{"name":"Speaking","note":"Explain how your app works."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["Think about something that annoys you or someone you know.","Draw 3 phone-shaped boxes: home screen, main screen, and one more.","Add arrows from buttons to the screen they open.","A good app name is short and tells you what it does.","Pretend to tap the paper buttons while a friend 'uses' your app."],"safe":"","up":"Ask 3 people what they'd change, then draw version 2.","q":["Who would use your app, and how does it help them?","What feedback did you get?"]},{"id":"codestory","icon":"🐱","name":"Code an Animation","blurb":"Use coding blocks to make characters move!","need":["A tablet or computer","A block-coding app like ScratchJr","A grown-up helper"],"steps":["Open the app and pick a character.","Choose a background for your scene.","Snap blocks together to make it move.","Add a second character and a speech bubble.","Press the green flag and watch your story!"],"tip":"If something goes wrong, read your blocks one by one like a recipe.","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Put instructions in the right order."},{"name":"Creative thinking","note":"Design your own animated story."}]},{"cat":"Self-Management","subs":[{"name":"Managing feelings","note":"Fix bugs without giving up."}]}],"t":"1 hour","g":"Me or a partner","lv":2,"d":["A grown-up can help you open it the first time.","The background tells people where the story happens.","Start with a 'when flag tapped' block, then add move blocks.","Use a wait block so the characters take turns.","A mistake in code is called a bug. Finding it is called debugging!"],"safe":"Use coding apps with a grown-up's OK and don't share personal details.","up":"Add a second scene so your story has a beginning and an ending.","q":["What bug did you find, and how did you fix it?","What does your code tell the character to do?"]}],"science":[{"id":"volcano","icon":"🌋","name":"Model Volcano","blurb":"Make a volcano that erupts!","need":["Baking soda","Vinegar","A small bottle","Clay or paper"],"steps":["Build a volcano shape around a bottle.","Put baking soda in the bottle.","Stand back a little.","Pour in vinegar.","Watch it bubble and erupt!"],"tip":"Do this outside or on a tray for easy cleanup.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"See what happens when things mix."}]},{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Predict the eruption first."}]}],"t":"1 hour","g":"Me or a partner","lv":1,"d":["Leave the top of the bottle open. That's your crater!","Add 2 big spoonfuls, plus a squirt of dish soap for extra foam.","Write down what you think will happen before you pour.","Add red food coloring to the vinegar for a lava look.","Draw or describe what you saw as soon as it finishes."],"safe":"Wear goggles if you have them and don't touch your eyes.","up":"Test it: does more baking soda or more vinegar make a bigger eruption?","q":["What did you predict, and what really happened?","What do you think makes the bubbles?"]},{"id":"circuit","icon":"💡","name":"Simple Circuit","blurb":"Make a light turn on!","need":["A battery","A small bulb","Wires","A grown-up helper"],"steps":["Ask a grown-up to help with this.","Connect a wire from battery to bulb.","Connect another wire back to the battery.","Watch the bulb light up!","Try adding a switch."],"tip":"Only use small batteries, never wall outlets!","atls":[{"cat":"Thinking","subs":[{"name":"Critical thinking","note":"Figure out how to make it light up."}]},{"cat":"Research","subs":[{"name":"Information skills","note":"Learn how electricity flows."}]}],"t":"1 hour","g":"Me or a partner","lv":3,"d":["Lay everything out and name each part together.","Tape the wire firmly to one end of the battery.","Electricity needs a full loop to flow. That loop is the circuit.","If it doesn't light, check every connection is touching metal.","A paper clip that swings open and closed makes a simple switch."],"safe":"Stop if anything feels warm. Never use wall outlets or big batteries.","up":"Test objects in your loop: which ones let electricity through?","q":["Why does the bulb go out when the loop is broken?","Which materials let electricity flow?"]},{"id":"waterfilter","icon":"💧","name":"Water Filter","blurb":"Clean dirty water with science!","need":["A plastic bottle","Sand and gravel","A co ":"Information skills","note":"Learn what bugs like."}]},{"cat":"Self-Management","subs":[{"name":"Organization","note":"Build and place it carefully."}]}],"t":"1 hour","g":"Me or a partner","lv":1,"d":["A can with both ends smooth, or a small wooden box, is perfect.","Pack it tight so nothing falls out when you tip it.","Different bugs like different sized holes.","Put it low to the ground, facing away from wind and rain.","Look, but don't poke. Draw the guests you spot."],"safe":"Look with your eyes, not your hands, and wash up after.","up":"Make a guest book: draw each kind of bug that checks in.","q":["Why are bugs important for gardens?","Which materials did the bugs like best?"]},{"id":"habitat","icon":"🦋","name":"Wildlife Habitat","blurb":"Make a safe spot for animals!","need":["A small outdoor area","Plants","A water dish","Rocks"],"steps":["Find a safe spot outside with a grown-up.","Add plants animals like.","Put out a shallow dish of water.","Add rocks and logs for hiding.","Watch quietly to see visitors!"],"tip":"Flowers bring butterflies and bees.","atls":[{"cat":"Research","subs":[{"name":"Information skills","note":"Learn what animals need."}]},{"cat":"Social","subs":[{"name":"Working with others","note":"Help local wildlife together."}]}],"t":"2+ weeks","g":"Whole class","lv":3,"d":["Ask permission and choose a spot that won't be stepped on.","Local flowers and plants are best for local animals.","Put a few stones in the dish so tiny creatures can climb out.","Animals need safe places to hide from weather and hunters.","Visit at the same time each day and keep a visitor tally."],"safe":"Never touch wild animals. Watch from a distance.","up":"Make a sign that teaches others what lives here and how to protect it.","q":["What four things do animals need to live?","How did your class help local wildlife?"]},{"id":"naturejournal","icon":"📒","name":"Nature Journal","blurb":"Draw and write about nature!","need":["A notebook","Pencils and crayons","A spot ou
