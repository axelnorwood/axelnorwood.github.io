<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: pick your grade, pick what you are writing, then follow five numbered steps.
   One colour per grade (same as the original): 1 blue, 2 green, 3 yellow, 4 red, 5 purple. */
:root {
  color-scheme: light;
  --ink: #1f2440; --ink-soft: #454a68; --sky: #e6efff; --card: #ffffff; --line: #d5ddef;
  --go: #1f9d55; --yellow: #ffe53b;
  --display: 'Fredoka', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --gc: #2f6fd0; --gt: #dcebff; --r: 20px;
}
.g1 { --gc: #2f6fd0; --gt: #dcebff; } .g2 { --gc: #177a66; --gt: #d7f3ec; } .g3 { --gc: #8a5a00; --gt: #fff3b0; }
.g4 { --gc: #c7301a; --gt: #ffe3dd; } .g5 { --gc: #6b3fb0; --gt: #ece3fb; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--body); font-weight: 600; font-size: 18px; line-height: 1.5; color: var(--ink); background: var(--sky); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 4px solid #2f6fd0; outline-offset: 2px; border-radius: 6px; }
main:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; }
h1 { font-size: 36px; font-weight: 700; } h2 { font-size: 26px; font-weight: 600; } h3 { font-size: 21px; font-weight: 600; }

.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 3px solid var(--line); }
.top-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 24px; text-decoration: none; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--yellow); font-size: 22px; }
.grade-chip { min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--gt); color: var(--gc); font-weight: 800; font-size: 16px; border: 2px solid var(--gc); text-decoration: none; display: inline-flex; align-items: center; }
.search { flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: #f5f8ff; font-size: 17px; font-weight: 700; }
.search input:focus { border-color: #2f6fd0; outline: none; background: #fff; }

main { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 18px; }
.lead { font-size: 20px; font-weight: 700; color: var(--ink-soft); }
.crumb { font-weight: 800; font-size: 17px; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--card); align-self: flex-start; border: 2px solid var(--line); }
.crumb:hover { border-color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tile { display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; background: var(--card); border: 3px solid var(--card); border-radius: var(--r); padding: 14px; min-height: 92px; box-shadow: 0 4px 0 var(--line); transition: transform .1s; }
.tile:hover { border-color: var(--gc); transform: translateY(-2px); }
.tile .ico { width: 60px; height: 60px; border-radius: 18px; background: var(--gt); display: grid; place-items: center; font-size: 32px; flex-shrink: 0; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 22px; display: block; line-height: 1.2; }
.tile small { font-size: 16px; font-weight: 700; color: var(--ink-soft); display: block; line-height: 1.3; }
.tile .also { color: var(--gc); font-weight: 800; }
.grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.grade-btn { text-decoration: none; background: var(--gt); border: 4px solid var(--gc); border-radius: 26px; padding: 18px 10px; text-align: center; box-shadow: 0 6px 0 var(--gc); transition: transform .1s; }
.grade-btn:hover { transform: translateY(-3px); }
.grade-btn b { display: block; font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--gc); }
.grade-btn span { font-family: var(--display); font-weight: 600; font-size: 22px; }

.band { background: var(--gt); border-radius: 26px; padding: 18px; display: flex; align-items: center; gap: 16px; border: 3px solid var(--gc); }
.band .ico { width: 72px; height: 72px; border-radius: 22px; background: #fff; display: grid; place-items: center; font-size: 40px; flex-shrink: 0; }
.band p { font-weight: 700; color: var(--ink-soft); }
.band .tag { font-weight: 800; color: var(--gc); font-size: 16px; }

.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tab { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 16px; line-height: 1.2; text-align: center; min-height: 84px; }
.tab .n { width: 32px; height: 32px; border-radius: 50%; background: var(--gt); color: var(--gc); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; }
.tab:hover { border-color: var(--gc); }
.tab[aria-selected="true"] { background: var(--gc); border-color: var(--gc); color: #fff; }
.tab[aria-selected="true"] .n { background: #fff; }
@media (max-width: 560px) { .tabs { grid-template-columns: repeat(3, 1fr); } h1 { font-size: 30px; } .band .ico { width: 56px; height: 56px; font-size: 30px; } }

#panel { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--card); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card > h2, .card > h3 { display: flex; align-items: center; gap: 10px; }
.emo { width: 44px; height: 44px; border-radius: 14px; background: var(--gt); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
.q { font-size: 19px; font-weight: 800; color: var(--gc); }
.goal { font-size: 16px; font-weight: 700; color: var(--ink-soft); background: #f5f8ff; border-radius: 12px; padding: 8px 12px; }
.goal b { color: var(--ink); }
ul.plain { list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.dots { padding-left: 24px; display: flex; flex-direction: column; gap: 6px; }
ul.dots li::marker { color: var(--gc); }

/* sentence starters */
.starter { background: var(--gt); border-left: 6px solid var(--gc); border-radius: 12px; padding: 10px 14px; font-size: 19px; font-weight: 700; }
.blank { display: inline-block; width: 64px; border-bottom: 3px solid var(--ink); margin: 0 3px; transform: translateY(-3px); }
.row-l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lab { font-family: var(--display); font-weight: 600; font-size: 18px; background: var(--gc); color: #fff; border-radius: 10px; padding: 3px 12px; }
.lab.soft { background: none; color: var(--ink); padding: 0; flex-basis: 100%; }
.chip { background: var(--gt); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 18px; }

/* the example, on lined paper */
.spot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spot span { font-weight: 800; }
.spot button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 3px solid var(--hc); background: #fff; font-weight: 800; font-size: 17px; }
.spot button[aria-pressed="true"] { background: var(--hc); }
.paper { --lh: 34px; background: #fffef8; border-radius: 6px; border: 2px solid var(--line); padding: 34px 20px 34px 44px; font-size: 19px; line-height: var(--lh); font-weight: 600;
  background-image: linear-gradient(90deg, transparent 31px, #f3a6a0 31px, #f3a6a0 33px, transparent 33px), repeating-linear-gradient(transparent 0, transparent calc(var(--lh) - 1px), #cfe0f7 calc(var(--lh) - 1px), #cfe0f7 var(--lh)); box-shadow: 0 6px 0 var(--line); }
.paper > * + * { margin-top: var(--lh); }
.paper h3 { font-family: var(--display); font-size: 24px; line-height: var(--lh); font-weight: 600; }
.paper h4 { font-size: 19px; font-weight: 800; line-height: var(--lh); }
.paper h4 + * { margin-top: 0; }
.paper ul, .paper ol { padding-left: 28px; }
.paper .sign { margin-top: var(--lh); }
mark.hl { background: none; color: inherit; border-radius: 6px; padding: 2px 0; }
.show-k mark.hl-k { background: #b8efc4; } .show-t mark.hl-t { background: #bfdcff; } .show-f mark.hl-f { background: #ffc9dd; }

/* tick lists */
.progress { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.track { flex: 1 1 160px; height: 18px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--go); border-radius: 999px; transition: width .25s; }
.progress b { font-family: var(--display); font-weight: 600; font-size: 20px; }
.link-btn { font-weight: 800; font-size: 16px; text-decoration: underline; min-height: 44px; padding: 0 8px; }
.done-msg { background: #e3f8ea; border: 3px solid var(--go); border-radius: var(--r); padding: 14px 18px; font-family: var(--display); font-weight: 600; font-size: 22px; }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #f5f8ff; cursor: pointer; border: 2px solid transparent; }
.check:hover { border-color: var(--line); }
.check .box { width: 32px; height: 32px; border-radius: 10px; border: 3px solid #8a90ad; background: #fff; flex-shrink: 0; display: grid; place-items: center; color: transparent; font-weight: 800; font-size: 20px; line-height: 1; }
.check[aria-checked="true"] { background: #e3f8ea; }
.check[aria-checked="true"] .box { background: var(--go); border-color: var(--go); color: #fff; }
.check.star .box { border-radius: 50%; }
.check.star[aria-checked="true"] { background: #fff6c2; }
.check.star[aria-checked="true"] .box { background: #ffc928; border-color: #b07b00; color: var(--ink); }

.term { font-weight: inherit; text-decoration: underline dotted 2px; text-underline-offset: 4px; text-decoration-color: var(--gc); cursor: help; padding: 0; }
.term:hover { background: var(--yellow); border-radius: 4px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px 16px; pointer-events: none; }
.sheet-in { pointer-events: auto; max-width: 620px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(31,36,64,.35); display: flex; flex-direction: column; gap: 6px; }
.sheet h3 { font-size: 24px; color: var(--yellow); }
.sheet .eg { color: #dfe4ff; font-weight: 700; }
.sheet button { align-self: flex-end; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 800; }

.next { align-self: flex-end; min-height: 56px; padding: 0 24px; border-radius: 18px; background: var(--ink); color: #fff; font-family: var(--display); font-weight: 600; font-size: 20px; box-shadow: 0 5px 0 #0c0f24; }
.next:active { transform: translateY(3px); box-shadow: 0 2px 0 #0c0f24; }

details.fold { background: var(--card); border-radius: var(--r); overflow: hidden; }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; font-size: 21px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .n { width: 36px; height: 36px; border-radius: 50%; background: var(--gt); color: var(--gc); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
details.fold > summary::after { content: '+'; margin-left: auto; font-size: 28px; color: var(--gc); line-height: 1; }
details.fold[open] > summary::after { content: '\2212'; }
details.fold .in { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.sub { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--gc); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.uses { font-size: 16px; color: var(--ink-soft); }

.letters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.letter { background: var(--gt); border-radius: 16px; padding: 12px; }
.letter b { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--gc); line-height: 1; display: block; }
.letter i { font-style: normal; font-family: var(--display); font-weight: 600; font-size: 19px; display: block; }
.badge { font-size: 15px; font-weight: 800; background: var(--yellow); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.strip { border-radius: 10px; padding: 8px 12px; font-weight: 800; }
.acro { display: flex; flex-direction: column; gap: 8px; }
.acro div { display: flex; align-items: center; gap: 10px; }
.acro b { width: 46px; height: 46px; border-radius: 12px; background: var(--gc); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 26px; flex-shrink: 0; }
.acro input, .word-in { flex: 1; min-width: 0; min-height: 46px; border: none; border-bottom: 3px solid var(--line); background: #f5f8ff; border-radius: 10px 10px 0 0; padding: 0 12px; font-size: 19px; font-weight: 700; }
.acro input:focus, .word-in:focus { outline: none; border-color: var(--gc); background: #fff; }
.result { text-decoration: none; background: var(--card); border-radius: 16px; padding: 12px 16px; display: block; border: 3px solid var(--card); }
.result:hover { border-color: var(--gc); }
.result b { color: var(--gc); font-size: 16px; display: block; }
.result mark { background: var(--yellow); border-radius: 4px; }
.foot { text-align: center; font-size: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top">
  <a class="brand" href="#grades" id="brand"><span aria-hidden="true">✏️</span>Writing Helper</a>
  <a class="grade-chip" href="#grades" id="grade-chip" hidden></a>
  <form class="search" role="search" id="search-form"><input type="search" id="q" placeholder="Search for help…" aria-label="Search for help" autocomplete="off"></form>
</div></header>
<main id="view" tabindex="-1"></main>
<div class="sheet" id="sheet" hidden><div class="sheet-in" role="dialog" aria-labelledby="sheet-term">
  <h3 id="sheet-term"></h3><p id="sheet-def"></p><p class="eg" id="sheet-eg"></p>
  <button type="button" id="sheet-close">Got it</button>
</div></div>

<script id="data" type="application/json">{"packages":[{"id":"g1-story","grade":1,"genre":"Story / Narrative","kind":"story","example":{"blocks":[{"t":"p","text":"On Monday morning, I was getting ready for school when I noticed something strange. One of the buttons on my blue jacket was missing. “Oh no!” I said. I needed that jacket because it was cold outside."},{"t":"p","text":"I looked under my bed, but the button wasn’t there. I checked my backpack, but it wasn’t there either. I felt worried, so I asked my little sister if she had seen it. She pointed to the living room."},{"t":"p","text":"I hurried over and saw my dog, Momo, sitting on the carpet. Right in front of him was my shiny blue button! I picked it up and laughed. “Momo, you silly dog!” I said. I gave him a hug and put the button safely in my pocket."},{"t":"p","text":"When I got to school, I told my friends the whole story. They laughed and said Momo should come to class one day. I felt happy that I found my button and that my day turned out okay."}],"title":"The Lost Button"},"traits":[{"key":"ideas","goal":"A clear story idea with some details.","starters":[{"k":"s","text":"My story is about ________."},{"k":"s","text":"First, ________ happened."},{"k":"s","text":"Then, ________."},{"k":"s","text":"At the end, ________."},{"k":"s","text":"The problem in my story is ________."},{"k":"s","text":"The solution is ________."}],"checks":["I told what happened.","I added at least 2 details.","My idea makes sense."]},{"key":"organization","goal":"Clear beginning, middle, end.","starters":[{"k":"l","label":"Beginning","opts":["One day…","At the start…"]},{"k":"l","label":"Middle","opts":["Then…","After that…"]},{"k":"l","label":"End","opts":["Finally…","In the end…"]}],"checks":["I have a BME.","My events are in order.","My ending matches my story."]},{"key":"voice","goal":"Show feelings or personality using simple strategies.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"“________!” I said."},{"k":"s","text":"It was so ________!"},{"k":"s","text":"I was thinking ________."}],"checks":["I used feelings.","I used bold, CAPS, or ! to show emotion (optional).","My story sounds like me."]},{"key":"word choice","goal":"Simple but descriptive words.","starters":[{"k":"s","text":"My character is ________ (adjective)."},{"k":"s","text":"The place looks ________."},{"k":"s","text":"The object is ________."},{"k":"s","text":"I used words like ________, ________, ________ to describe."}],"checks":["I used adjectives.","I used accurate describing words.","I didn’t repeat the same word too much."]},{"key":"sentence fluency","goal":"Simple sentences with some variety.","starters":[{"k":"g","label":"I can start sentences with","items":["I…","Then…","After that…","Suddenly…","Finally…"]},{"k":"s","text":"I can join ideas with and, but, so."}],"checks":["My sentences are complete.","I used different beginnings.","My story is easy to read aloud."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a, an, the correctly."},{"k":"s","text":"I wrote I, We, They at the start of sentences."},{"k":"g","label":"I checked my verbs","items":["Today I play.","Yesterday I played."]},{"k":"s","text":"I ended sentences with . ? !"}],"checks":["Capital letter at the start.","Full stop at the end.","Proper nouns start with capitals.","I spelled simple words correctly.","My handwriting is neat and spaced."]}],"page":[{"title":"What my page should look like","items":["Title on the top line.","Finger space between words.","One idea per sentence.","New line for each part of the story (optional but encouraged).","Drawings may support the story but do not replace writing."]},{"title":"Beginning","items":["Introduce the character and setting.","Use a full sentence."]},{"title":"Middle","items":["Tell what happened in order.","Use then, after that, suddenly."]},{"title":"End","items":["Show how the problem was solved.","Tell how the character felt."]}],"challenge":["Add a second feeling.","Add a sound word (e.g., “POP!”, “WHOOSH!”).","Add a short dialogue line."]},{"id":"g1-letter","grade":1,"genre":"Letter Writing","kind":"letter","example":{"blocks":[{"t":"p","text":"How are you? I hope you are having a nice week. I am writing to tell you about our class trip to the park on Friday."},{"t":"p","text":"First, we played a big game of tag. I ran so fast that my shoes almost flew off! Then we had a picnic under the tall trees. I ate my sandwich and shared my strawberries with my friend Mayuri. After that, we looked for insects. I found a tiny green beetle, and it tickled my hand."},{"t":"p","text":"I wish you could have come with us. I miss you and hope I can visit you soon."}],"greeting":"Dear Grandma,","closing":"Love,","name":"AJ"},"traits":[{"key":"ideas","goal":"Share a clear message with simple details.","starters":[{"k":"s","text":"I am writing to tell you about ________."},{"k":"s","text":"One thing I want to share is ________."},{"k":"s","text":"First, ________."},{"k":"s","text":"Then, ________."},{"k":"s","text":"Another thing is ________."}],"checks":["I wrote about one main topic.","I added 2–3 details.","My ideas make sense."]},{"key":"organization","goal":"Follow the structure of a letter.","starters":[{"k":"l","label":"Greeting","opts":["Dear ________,"]},{"k":"l","label":"Opening","opts":["How are you? I am writing to ________."]},{"k":"l","label":"Middle","opts":["First… Then… After that…"]},{"k":"l","label":"Closing","opts":["I hope…","I wish…"]},{"k":"l","label":"Signoff","opts":["From,","Love,"]}],"checks":["I used greeting – body – closing – signature.","My ideas are in order.","My ending matches my message."]},{"key":"voice","goal":"Show feelings and personality.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"It was so ________!"},{"k":"s","text":"I want you to know that ________."},{"k":"s","text":"I wish you could ________."}],"checks":["I showed feelings.","I used ! or bold words to show emotion (optional).","My letter sounds like me."]},{"key":"word choice","goal":"Simple but descriptive words.","starters":[{"k":"s","text":"The place was ________."},{"k":"s","text":"The thing I liked most was ________."},{"k":"s","text":"It looked ________."},{"k":"s","text":"It felt ________."}],"checks":["I used adjectives.","My words help the reader imagine.","I didn’t repeat the same words too much."]},{"key":"sentence fluency","goal":"Simple sentences with some variety.","starters":[{"k":"g","label":"I can start sentences with","items":["I…","Then…","After that…","Also…"]},{"k":"s","text":"I can join ideas with and, but, so."}],"checks":["My sentences are complete.","I used different beginnings.","My letter is easy to read aloud."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a, an, the correctly."},{"k":"g","label":"I checked my verbs","items":["Today I play.","Yesterday I played."]},{"k":"s","text":"I used . ? ! correctly."},{"k":"s","text":"I started names with capital letters."}],"checks":["Capital letter at the start of each sentence.","Full stop at the end.","Proper nouns begin with capitals.","Simple words spelled correctly.","Neat handwriting and spacing."]}],"page":[{"title":"What my letter should look like","items":["Greeting at the top left: Dear ________,","Body: 3–5 sentences about one topic","Closing: Love, / From, / Sincerely,","Signature: Your name"]},{"title":"Remember","items":["One idea per sentence","Finger spaces","Use time words (first, then, after that)","Add feelings or opinions"]}],"challenge":["Add a question for the reader.","Add a second feeling.","Add a descriptive sentence about a place or object."]},{"id":"g1-info","grade":1,"genre":"Information / Nonfiction","kind":"info","example":{"blocks":[{"t":"p","text":"Penguins are birds that cannot fly, but they are amazing swimmers. They use their flippers to move quickly through the water. Penguins live in cold places like Antarctica, where there is lots of ice and snow."},{"t":"p","text":"Penguins eat fish, squid, and krill. They catch their food in the water. Sometimes they slide on their bellies to move faster on the ice."},{"t":"p","text":"Baby penguins are called chicks. They are soft and fluffy. Penguin parents take turns keeping the egg warm. When the chick hatches, the parents feed it until it can find food on its own."},{"t":"p","text":"Penguins are interesting animals because they work together, stay warm in groups, and take care of their babies."}],"title":"All About Penguins"},"traits":[{"key":"ideas","goal":"Share a clear topic with simple facts.","starters":[{"k":"s","text":"My topic is ________."},{"k":"s","text":"________ are ________."},{"k":"s","text":"They can ________."},{"k":"s","text":"They have ________."},{"k":"s","text":"They live in ________."},{"k":"s","text":"They eat ________."}],"checks":["I wrote about one topic.","I added true facts.","My ideas make sense."]},{"key":"organization","goal":"Clear sections or simple paragraphs.","starters":[{"k":"s","text":"First, I will tell you about ________."},{"k":"s","text":"Another fact is ________."},{"k":"s","text":"Also, ________."},{"k":"s","text":"Finally, ________."}],"checks":["I started with my topic sentence.","My facts are in order.","My ending tells why the topic is interesting or important."]},{"key":"voice","goal":"Sound interested and knowledgeable.","starters":[{"k":"s","text":"I think ________ are interesting because ________."},{"k":"s","text":"You might not know that ________."},{"k":"s","text":"It is amazing that ________."}],"checks":["I showed interest in my topic.","I used simple strategies like ! or bold words to show excitement (optional).","My writing sounds like me teaching someone."]},{"key":"word choice","goal":"Use simple but accurate nonfiction vocabulary.","starters":[{"k":"s","text":"They have ________ (body part)."},{"k":"s","text":"They can ________ (action)."},{"k":"s","text":"They live in ________ (habitat)."},{"k":"s","text":"They eat ________ (food)."},{"k":"s","text":"A special fact is ________."}],"checks":["I used topic words.","I used adjectives to describe.","My words help the reader learn."]},{"key":"sentence fluency","goal":"Simple sentences with some variety.","starters":[{"k":"s","text":"________ are…"},{"k":"s","text":"They can…"},{"k":"s","text":"They have…"},{"k":"s","text":"Also…"},{"k":"s","text":"Another fact is…"}],"checks":["My sentences are complete.","I used different beginnings.","My writing is easy to read aloud."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a, an, the correctly."},{"k":"g","label":"I checked my verbs","items":["Penguins swim.","Penguins swam yesterday."]},{"k":"s","text":"I used . ? ! correctly."},{"k":"s","text":"I started names and places with capital letters."}],"checks":["Capital letter at the start of each sentence.","Full stop at the end.","Proper nouns begin with capitals.","Simple words spelled correctly.","Neat handwriting and spacing."]}],"page":[{"title":"What my information text should look like","items":["Title at the top","Topic sentence","3–5 facts","Ending sentence","Optional: labelled picture or diagram"]},{"title":"What goes in each paragraph","items":["One idea per sentence","Finger spaces","Use nonfiction words (habitat, food, body parts, actions)","Use time or linking words (first, also, another fact)"]}],"challenge":["Add a labelled diagram","Add a comparison sentence (“They are like…”)","Add a fun fact"]},{"id":"g1-howto","grade":1,"genre":"Procedural / How-To","kind":"howto","example":{"blocks":[{"t":"h","text":"You will need"},{"t":"ul","items":["1 banana","1 apple","1 cup of grapes","A bowl","A spoon"]},{"t":"h","text":"Steps"},{"t":"ol","items":["First, wash the apple and grapes.","Next, peel the banana and cut it into small pieces.","Then, cut the apple into little cubes.","After that, put all the fruit into the bowl.","Finally, mix everything with a spoon and enjoy your fruit salad."]},{"t":"p","text":"Fruit salad is healthy and delicious. You can even add yogurt if you want to make it creamy."}],"title":"How to Make a Fruit Salad"},"traits":[{"key":"ideas","goal":"Explain how to do something with clear steps.","starters":[{"k":"s","text":"I am teaching you how to ________."},{"k":"s","text":"You will need ________."},{"k":"s","text":"First, ________."},{"k":"s","text":"Next, ________."},{"k":"s","text":"Then, ________."},{"k":"s","text":"Last, ________."}],"checks":["I wrote about one procedure.","I added clear steps.","My ideas make sense."]},{"key":"organization","goal":"Steps in order with a beginning and ending.","starters":[{"k":"l","label":"Materials","opts":["You will need…"]},{"k":"l","label":"Steps","opts":["First… Next… Then… After that… Finally…"]},{"k":"l","label":"Ending","opts":["Now you can enjoy/use/play with ________."]}],"checks":["I listed my materials.","My steps are in order.","My ending matches my procedure."]},{"key":"voice","goal":"Sound helpful and encouraging.","starters":[{"k":"s","text":"You can do this by ________."},{"k":"s","text":"It is fun to ________."},{"k":"s","text":"Be careful when you ________."},{"k":"s","text":"You might enjoy ________."}],"checks":["I used friendly, helpful words.","I used ! or bold words to show excitement (optional).","My writing sounds like me teaching someone."]},{"key":"word choice","goal":"Use clear action words and simple descriptive words.","starters":[{"k":"l","label":"","opts":["Wash","cut","mix","fold","glue","draw","pour"]},{"k":"s","text":"You need a ________ (tool)."},{"k":"s","text":"The ________ is ________ (adjective)."},{"k":"s","text":"A special tip is ________."}],"checks":["I used action verbs.","I used adjectives to describe materials.","My words help the reader follow the steps."]},{"key":"sentence fluency","goal":"Simple sentences with sequencing words.","starters":[{"k":"s","text":"First…"},{"k":"s","text":"Next…"},{"k":"s","text":"Then…"},{"k":"s","text":"After that…"},{"k":"s","text":"Finally…"}],"checks":["My sentences are complete.","I used different beginnings.","My writing is easy to read aloud."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a, an, the correctly."},{"k":"g","label":"I checked my verbs","items":["I cut the apple.","I mixed the fruit."]},{"k":"s","text":"I used . at the end of each step."},{"k":"s","text":"I started each step with a capital letter."}],"checks":["Capital letter at the start of each step.","Full stop at the end.","Proper nouns begin with capitals.","Simple words spelled correctly.","Neat handwriting and spacing."]}],"page":[{"title":"What my procedural text should look like","items":["Title at the top","Materials list","Numbered steps","Clear sequencing words","Optional: labelled picture"]},{"title":"Remember","items":["One action per step","Finger spaces","Use action verbs (cut, mix, fold, glue)","Use time words (first, next, then, finally)"]}],"challenge":["Add a safety tip","Add a “special trick” or “helpful hint”","Add a labelled diagram"]},{"id":"g1-journal","grade":1,"genre":"Journal","kind":"journal","example":{"blocks":[{"t":"p","text":"Today was a fun day at school. In the morning, we had P.E., and I learned how to dribble a basketball. At first it was hard, but then I got better. I felt proud of myself."},{"t":"p","text":"After lunch, I worked with my group to build a paper bridge. Our bridge was strong, and it held three toy cars. We cheered when it didn’t fall down."},{"t":"p","text":"I had a good day because I tried something new and worked well with my friends."}],"date":"January 28"},"traits":[{"key":"ideas","goal":"Share a clear event with simple details.","starters":[{"k":"s","text":"Today I ________."},{"k":"s","text":"One thing that happened was ________."},{"k":"s","text":"Another thing I did was ________."},{"k":"s","text":"I want to remember that ________."}],"checks":["I wrote about one day or one event.","I added 2–3 details.","My ideas make sense."]},{"key":"organization","goal":"Beginning → what happened → ending reflection.","starters":[{"k":"l","label":"Beginning","opts":["Today…","This morning…","After lunch…"]},{"k":"l","label":"Middle","opts":["Then… After that…"]},{"k":"l","label":"Ending","opts":["I felt ________ because ________."]}],"checks":["My ideas are in order.","I wrote a beginning, middle, and ending.","My ending tells how I felt."]},{"key":"voice","goal":"Show feelings and personal thoughts.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I was thinking ________."},{"k":"s","text":"It was so ________!"},{"k":"s","text":"I liked ________ because ________."}],"checks":["I showed feelings.","I used simple strategies like ! or bold words (optional).","My journal sounds like me."]},{"key":"word choice","goal":"Use simple but descriptive words.","starters":[{"k":"s","text":"The best part was ________."},{"k":"s","text":"It was ________ (adjective)."},{"k":"s","text":"The place looked ________."},{"k":"s","text":"The activity was ________."}],"checks":["I used adjectives.","My words help the reader imagine.","I didn’t repeat the same words too much."]},{"key":"sentence fluency","goal":"Simple sentences with some variety.","starters":[{"k":"g","label":"I can start sentences with","items":["Today…","Then…","After that…","I felt…"]},{"k":"s","text":"I can join ideas with and, but, so."}],"checks":["My sentences are complete.","I used different beginnings.","My journal is easy to read aloud."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a, an, the correctly."},{"k":"g","label":"I checked my verbs","items":["Today I play.","Yesterday I played."]},{"k":"s","text":"I used . ? ! correctly."},{"k":"s","text":"I started names and days with capital letters."}],"checks":["Capital letter at the start of each sentence.","Full stop at the end.","Proper nouns begin with capitals.","Simple words spelled correctly.","Neat handwriting and spacing."]}],"page":[{"title":"What my journal should look like","items":["Date at the top","3–5 sentences","One event or part of the day","Ending sentence with a feeling"]},{"title":"Remember","items":["One idea per sentence","Finger spaces","Use time words (today, then, after that)","Add feelings or thoughts"]}],"challenge":["Add a second feeling","Add a short dialogue line (“I said, ‘…’”)","Add a descriptive sentence about a place or activity"]},{"id":"g2-story","grade":2,"genre":"Fictional Narrative","kind":"story","example":{"blocks":[{"t":"p","text":"One sunny afternoon, Leo was building a giant marble track in his room. He reached into his marble jar, but his favourite blue marble was gone. “That’s strange,” he whispered. He always kept it in the jar because it rolled the fastest."},{"t":"p","text":"Leo searched under his bed, behind his bookshelf, and even inside his slippers. It was nowhere. He felt worried, so he decided to investigate. He followed a tiny trail of glitter that led out of his room and down the hallway. “This looks like fairy dust,” he said, feeling excited."},{"t":"p","text":"When he reached the living room, he saw something unbelievable. A small fairy with sparkly wings was trying to roll the blue marble across the carpet. “Oh! I didn’t mean to take it forever,” the fairy said. “I just wanted to see how fast it could go.”"},{"t":"p","text":"Leo laughed. “It’s okay. You can try it on my track instead.” The fairy’s eyes lit up. Together, they raced the marble again and again. It zoomed so fast that both of them cheered."},{"t":"p","text":"At the end of the day, the fairy returned the marble and promised to visit again. Leo felt proud that he solved the mystery—and happy to have a magical new friend."}],"title":"The Mystery of the Missing Marble"},"traits":[{"key":"ideas","goal":"A clear story idea with supporting details and a sense of audience.","starters":[{"k":"s","text":"My story is about ________ who wants ________."},{"k":"s","text":"The problem in my story is ________."},{"k":"s","text":"The character feels ________ because ________."},{"k":"s","text":"Important details are ________ and ________."},{"k":"s","text":"My story will entertain the reader by ________."}],"checks":["My idea is clear and stays on topic.","I added supporting details.","My story is written to entertain."]},{"key":"organization","goal":"Clear beginning, middle, and end with simple paragraphs.","starters":[{"k":"l","label":"Beginning","opts":["One day…","At the start…","My character was…"]},{"k":"l","label":"Middle","opts":["Then… After that… Suddenly…"]},{"k":"l","label":"End","opts":["Finally… In the end… The problem was solved when…"]}],"checks":["I used paragraphs (Beginning / Middle / End).","My events are in logical order.","My ending matches the problem."]},{"key":"voice","goal":"A consistent personal style and appropriate tone for storytelling.","starters":[{"k":"s","text":"My character felt ________ when ________."},{"k":"s","text":"“________!” the character shouted/whispered/sighed."},{"k":"s","text":"I want the reader to feel ________ during this part."},{"k":"s","text":"I chose this detail because ________."}],"checks":["My voice is consistent.","My tone matches a fiction story.","I used dialogue or feelings to show personality."]},{"key":"word choice","goal":"Deliberate vocabulary that adds detail and depth.","starters":[{"k":"s","text":"The setting looked ________ (adjective + noun)."},{"k":"s","text":"My character moved ________ (adverb)."},{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."}],"checks":["I used specific nouns and strong verbs.","I used adjectives and adverbs to add detail.","My words help the reader imagine the story."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and patterns; smooth rhythm.","starters":[{"k":"g","label":"I can start sentences with","items":["When…","As…","Suddenly…","While…","Later…"]},{"k":"s","text":"I can join ideas with and, but, so, when, if."}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["walked, played, found"]},{"k":"l","label":"Present","opts":["walks, plays, finds"]},{"k":"l","label":"Future","opts":["will walk, will play, will find"]},{"k":"s","text":"I used when and if to join ideas."},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my narrative should look like","items":["Title at the top","Three paragraphs (Beginning / Middle / End)","Dialogue with quotation marks (optional but encouraged)","Descriptive details","Clear problem + solution"]},{"title":"What goes in each paragraph","items":["Beginning: Introduce character + setting + hint of problem","Middle: Events build the problem; include feelings and actions","End: Solve the problem; show how the character changed or felt"]},{"title":"Grade 2 writing moves to try","items":["Use time words (when, suddenly, later, after that)","Use strong verbs (raced, whispered, discovered)","Use adjectives (sparkly wings, giant track)","Use dialogue to show voice","Use prepositions correctly (under, behind, inside, across)"]}],"challenge":["Add a second character with a different personality","Add a twist in the middle","Add a simile (“as fast as a rocket”)","Use a complex conjunction (when, if, because)"]},{"id":"g2-letter","grade":2,"genre":"Letter Writing","kind":"letter","example":{"blocks":[{"t":"p","text":"I hope you are having a wonderful week. I am writing to tell you about our class science experiment on plants because I think you would enjoy hearing about it."},{"t":"p","text":"Yesterday, we planted three different seeds: a bean, a sunflower seed, and a mystery seed. First, we put soil into small pots. Then we placed each seed inside and watered them carefully. I liked the bean seed the most because it was smooth and shiny."},{"t":"p","text":"Today, when I checked my pot, I saw a tiny green sprout! I felt excited because it means my plant is starting to grow. I wonder how tall it will get. I will water it every day and make sure it gets enough sunlight."},{"t":"p","text":"Thank you for reading my letter. I hope I can show you my plant when it gets bigger."}],"greeting":"Dear Ms. Tanaka,","closing":"Sincerely,","name":"Mina"},"traits":[{"key":"ideas","goal":"A clear purpose with supporting details and awareness of audience.","starters":[{"k":"s","text":"I am writing to tell you about ________."},{"k":"s","text":"I chose this topic because ________."},{"k":"s","text":"One important detail is ________."},{"k":"s","text":"Another thing I want you to know is ________."},{"k":"s","text":"I think you will enjoy hearing about ________."}],"checks":["My letter stays on topic.","I added supporting details.","I wrote with my reader in mind."]},{"key":"organization","goal":"Clear greeting, body paragraphs, closing, and signature.","starters":[{"k":"l","label":"Greeting","opts":["Dear ________,"]},{"k":"l","label":"Opening","opts":["I am writing to ________."]},{"k":"l","label":"Body Paragraph 1","opts":["First…","Yesterday…","At school…"]},{"k":"l","label":"Body Paragraph 2","opts":["Today…","Another thing…","I also want to tell you…"]},{"k":"l","label":"Closing","opts":["Thank you for…","I hope…","I look forward to…"]},{"k":"l","label":"Signoff","opts":["Sincerely,","From,"]}],"checks":["I used paragraphs.","My ideas are in logical order.","My ending matches my purpose."]},{"key":"voice","goal":"A consistent, appropriate tone for a friendly or formal letter.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I want you to know that ________."},{"k":"s","text":"I was thinking ________."},{"k":"s","text":"I hope you feel ________ when you read this."}],"checks":["My voice is consistent.","My tone matches the audience.","I used feelings or thoughts to show personality."]},{"key":"word choice","goal":"Deliberate vocabulary that adds detail and clarity.","starters":[{"k":"s","text":"The activity was ________ (adjective)."},{"k":"s","text":"The place looked ________."},{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."}],"checks":["I used specific nouns and strong verbs.","I used adjectives to add detail.","My words help the reader imagine."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and patterns; smooth rhythm.","starters":[{"k":"g","label":"I can start sentences with","items":["Yesterday…","Today…","When…","After that…","Later…"]},{"k":"s","text":"I can join ideas with and, but, so, when, if."}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["planted, watered, checked"]},{"k":"l","label":"Present","opts":["plant, water, check"]},{"k":"l","label":"Future","opts":["will plant, will water, will check"]},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my letter should look like","items":["Date at the top (optional)","Greeting","Two short paragraphs in the body","Closing + signature","Clear purpose and details"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Why you are writing + first details","Paragraph 2: More details + feelings or thoughts","Closing: Wrap up politely"]},{"title":"Grade 2 writing moves to try","items":["Use time words (yesterday, today, later)","Use strong verbs (noticed, wondered, explained)","Use adjectives (tiny sprout, shiny seed)","Use prepositions correctly (inside, behind, across)","Use quotation marks if including dialogue"]}],"challenge":["Add a question for the reader","Add a second paragraph with a new but related detail","Add a simile (“as bright as the sun”)","Use a complex conjunction (when, if, because)"]},{"id":"g2-info","grade":2,"genre":"Informational Text","kind":"info","example":{"blocks":[{"t":"p","text":"Sea turtles are amazing reptiles that live in warm oceans around the world. They have strong flippers that help them swim long distances. Their shells protect them from predators like sharks. Sea turtles can hold their breath for a very long time, which helps them stay underwater."},{"t":"p","text":"Sea turtles eat different foods depending on their species. Some sea turtles eat seaweed and seagrass, while others eat jellyfish, crabs, or small fish. Their sharp beaks help them bite and tear their food. Green sea turtles mostly eat plants, which is why their fat looks green."},{"t":"p","text":"Baby sea turtles have a difficult start to life. They hatch from eggs buried in the sand. When they crawl out of the nest, they must quickly reach the ocean before birds or crabs catch them. Only a few baby turtles survive to become adults."},{"t":"p","text":"Sea turtles are interesting animals because they travel far, live long lives, and help keep the ocean healthy."}],"title":"All About Sea Turtles"},"traits":[{"key":"ideas","goal":"A clear topic with supporting facts and awareness of audience.","starters":[{"k":"s","text":"My topic is ________."},{"k":"s","text":"________ are ________ because ________."},{"k":"s","text":"One important fact is ________."},{"k":"s","text":"Another fact is ________."},{"k":"s","text":"Readers will learn about ________."}],"checks":["My writing stays on topic.","I added supporting facts.","I wrote to teach the reader."]},{"key":"organization","goal":"Clear introduction, grouped facts, and a conclusion.","starters":[{"k":"l","label":"Introduction","opts":["________ are…","This text will teach you about…"]},{"k":"l","label":"Body Paragraph 1","opts":["First, I will explain…"]},{"k":"l","label":"Body Paragraph 2","opts":["Another important part is…"]},{"k":"l","label":"Conclusion","opts":["Now you know…","________ are important because…"]}],"checks":["I used paragraphs.","My facts are grouped by idea.","My ending wraps up the topic."]},{"key":"voice","goal":"A clear, knowledgeable tone that fits informational writing.","starters":[{"k":"s","text":"You might not know that ________."},{"k":"s","text":"It is interesting that ________."},{"k":"s","text":"Scientists believe ________."},{"k":"s","text":"I want readers to understand ________."}],"checks":["My tone is informative.","My voice is consistent.","I sound like I know my topic."]},{"key":"word choice","goal":"Accurate vocabulary and descriptive details that deepen understanding.","starters":[{"k":"s","text":"A key word for this topic is ________."},{"k":"s","text":"________ means ________."},{"k":"s","text":"They have ________ (body part) that helps them ________."},{"k":"s","text":"They live in ________ (habitat)."},{"k":"s","text":"A strong verb I used is ________."}],"checks":["I used topic-specific vocabulary.","I used adjectives and precise nouns.","My words help the reader learn."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and patterns; smooth rhythm.","starters":[{"k":"s","text":"________ can…"},{"k":"s","text":"They also…"},{"k":"s","text":"Another fact is…"},{"k":"s","text":"Because…"},{"k":"s","text":"When…"}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["lived, grew, ate"]},{"k":"l","label":"Present","opts":["live, grow, eat"]},{"k":"l","label":"Future","opts":["will live, will grow, will eat"]},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my informational text should look like","items":["Title at the top","Three paragraphs (Introduction / Facts / More Facts / Conclusion)","Topic-specific vocabulary","Clear, grouped ideas"]},{"title":"What goes in each paragraph","items":["Introduction: Introduce the topic","Body Paragraphs: Group facts by idea (habitat, diet, life cycle, etc.)","Conclusion: Wrap up with an interesting or important idea"]},{"title":"Grade 2 writing moves to try","items":["Use topic words (habitat, diet, features)","Use strong verbs (crawl, glide, protect)","Use adjectives (smooth shell, warm ocean)","Use prepositions correctly (in, under, across)","Use complex conjunctions (when, if, because)"]}],"challenge":["Add a labelled diagram","Add a comparison sentence (“They are similar to…”)","Add a fun fact paragraph"]},{"id":"g2-howto","grade":2,"genre":"Procedural Writing","kind":"howto","example":{"blocks":[{"t":"p","text":"Making a paper helicopter is fun and easy. You only need a few materials, and you can watch it spin through the air when you drop it."},{"t":"h","text":"You will need"},{"t":"ul","items":["1 sheet of paper","Scissors","A paper clip","Markers (optional)"]},{"t":"h","text":"Steps"},{"t":"ol","items":["First, cut your paper into a long rectangle.","Next, cut a straight line down the top half of the rectangle to make two wings.","Then, fold the bottom part of the paper up to make a small base.","After that, fold each wing in opposite directions.","Finally, clip a paper clip to the bottom so the helicopter spins better."]},{"t":"p","text":"Now your paper helicopter is ready. Hold it up high and let it go. Watch how it twirls as it falls."}],"title":"How to Make a Paper Helicopter"},"traits":[{"key":"ideas","goal":"Explain how to do something with clear, detailed steps.","starters":[{"k":"s","text":"This procedure will teach you how to ________."},{"k":"s","text":"You will need ________, ________, and ________."},{"k":"s","text":"One important step is ________."},{"k":"s","text":"Another step is ________."},{"k":"s","text":"This will help the reader ________."}],"checks":["My writing stays on topic.","I added supporting details.","I wrote to help the reader succeed."]},{"key":"organization","goal":"Clear materials list, sequenced steps, and a conclusion.","starters":[{"k":"l","label":"Introduction","opts":["Today I will teach you how to…"]},{"k":"l","label":"Materials","opts":["You will need…"]},{"k":"l","label":"Steps","opts":["First… Next… Then… After that… Finally…"]},{"k":"l","label":"Conclusion","opts":["Now you can…","Your ________ is ready."]}],"checks":["I used paragraphs.","My steps are in logical order.","My ending matches my purpose."]},{"key":"voice","goal":"A helpful, encouraging tone that fits procedural writing.","starters":[{"k":"s","text":"Be careful when you ________."},{"k":"s","text":"It is helpful to ________."},{"k":"s","text":"You might enjoy ________."},{"k":"s","text":"I want the reader to feel ________ when they try this."}],"checks":["My tone is friendly and helpful.","My voice is consistent.","I sound like I know how to do the task."]},{"key":"word choice","goal":"Clear action verbs and precise vocabulary.","starters":[{"k":"s","text":"First, cut/fold/mix/glue the ________."},{"k":"s","text":"Then, place/hold/attach the ________."},{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."}],"checks":["I used action verbs.","I used precise nouns and adjectives.","My words help the reader follow the steps."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and smooth sequencing.","starters":[{"k":"s","text":"First…"},{"k":"s","text":"Next…"},{"k":"s","text":"Then…"},{"k":"s","text":"After that…"},{"k":"s","text":"Finally…"},{"k":"s","text":"When you…"}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["folded, cut, attached"]},{"k":"l","label":"Present","opts":["fold, cut, attach"]},{"k":"l","label":"Future","opts":["will fold, will cut, will attach"]},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my procedural text should look like","items":["Title at the top","Introduction paragraph","Materials list","Numbered steps","Conclusion sentence or paragraph"]},{"title":"What goes in each paragraph","items":["Introduction: Explain what you will teach","Materials: List items clearly","Steps: One action per step, in order","Conclusion: Tell what the reader can do now"]},{"title":"Grade 2 writing moves to try","items":["Use action verbs (cut, fold, attach, mix)","Use time words (first, next, then, after that)","Use prepositions correctly (on, under, across)","Use adjectives to describe materials","Use complex conjunctions (when, if, because)"]}],"challenge":["Add a safety tip","Add a “special trick” or “helpful hint”","Add a labelled diagram","Add a simile (“fold it like a tiny book”)"]},{"id":"g2-persuade","grade":2,"genre":"Persuasive Writing","kind":"persuade","example":{"blocks":[{"t":"p","text":"I believe our school should have a class garden because it would help students learn in exciting new ways. A garden would teach us how plants grow. We could observe roots, stems, and leaves up close instead of only looking at pictures. This would make science lessons more interesting and easier to understand."},{"t":"p","text":"Another reason we need a garden is that it would help us take care of the environment. We could grow flowers that attract butterflies and bees. We could also plant vegetables and learn how to compost food scraps. This would show us how to protect nature and reduce waste."},{"t":"p","text":"Finally, a class garden would make our school a happier place. Students could relax, read, or draw in the garden. We could even share the vegetables we grow with our community. A garden would bring everyone together."},{"t":"p","text":"For these reasons, I strongly think our school should create a class garden. It would help us learn, help the environment, and help our school community."}],"title":"Why Our School Should Have a Class Garden"},"traits":[{"key":"ideas","goal":"A clear opinion with supporting reasons and awareness of audience.","starters":[{"k":"s","text":"I believe ________ because ________."},{"k":"s","text":"My opinion is ________."},{"k":"s","text":"One reason is ________."},{"k":"s","text":"Another reason is ________."},{"k":"s","text":"Readers should agree because ________."}],"checks":["My opinion is clear.","I gave at least two strong reasons.","My writing is meant to convince the reader."]},{"key":"organization","goal":"Introduction → reasons → conclusion, with simple paragraphs.","starters":[{"k":"l","label":"Introduction","opts":["I believe…","I think…","In my opinion…"]},{"k":"l","label":"Reason Paragraphs","opts":["One reason… Another reason…"]},{"k":"l","label":"Conclusion","opts":["For these reasons…","This is why…"]}],"checks":["I used paragraphs.","My reasons are in logical order.","My ending restates my opinion."]},{"key":"voice","goal":"A confident, convincing tone.","starters":[{"k":"s","text":"I strongly believe ________."},{"k":"s","text":"It is important because ________."},{"k":"s","text":"You should agree because ________."},{"k":"s","text":"I want the reader to feel ________."}],"checks":["My voice is confident.","My tone matches persuasive writing.","I used feelings or strong words to convince."]},{"key":"word choice","goal":"Persuasive vocabulary and precise details.","starters":[{"k":"s","text":"This will help ________."},{"k":"s","text":"It is beneficial because ________."},{"k":"s","text":"A strong word I used is ________."},{"k":"s","text":"A descriptive detail I added is ________."}],"checks":["I used persuasive words (important, helpful, beneficial).","I used specific nouns and strong verbs.","My words help convince the reader."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and smooth rhythm.","starters":[{"k":"g","label":"I can start sentences with","items":["First…","Another reason…","Also…","Finally…"]},{"k":"s","text":"I can join ideas with because, so, when, if."}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["helped, learned"]},{"k":"l","label":"Present","opts":["help, learn"]},{"k":"l","label":"Future","opts":["will help, will learn"]},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my persuasive text should look like","items":["Title at the top","Three paragraphs (Opinion / Reason 1 & 2 / Conclusion)","Clear opinion","Strong reasons","Audience awareness"]},{"title":"What goes in each paragraph","items":["Introduction: State your opinion clearly","Body Paragraph(s): Give reasons + details","Conclusion: Restate your opinion and wrap up"]},{"title":"Grade 2 writing moves to try","items":["Use persuasive words (important, helpful, should, must)","Use strong verbs (protect, improve, support)","Use adjectives (healthy garden, exciting project)","Use complex conjunctions (because, when, if)","Use topic-specific vocabulary"]}],"challenge":["Add a counterargument (“Some people think…, but…”)","Add a real-life example","Add a rhetorical question (“Wouldn’t you want…?”)","Use a simile (“as helpful as…”)"]},{"id":"g2-journal","grade":2,"genre":"Journal","kind":"journal","example":{"blocks":[{"t":"p","text":"Today was a busy and exciting day at school. In the morning, our class visited the library to choose new books. I picked a mystery book because I love trying to solve clues. While I was reading the first chapter, I already had a guess about who the thief might be."},{"t":"p","text":"After lunch, we worked on our group project about weather. My group made a poster about thunderstorms. I drew a huge lightning bolt, and my partner added facts about how thunder is made. We worked well together, and our poster looked bright and bold."},{"t":"p","text":"At the end of the day, I felt proud of myself. I tried my best in every activity, and I enjoyed learning new things. I can’t wait to read more of my mystery book tomorrow."}],"date":"January 28"},"traits":[{"key":"ideas","goal":"Share a clear event with supporting details and awareness of audience.","starters":[{"k":"s","text":"Today I ________."},{"k":"s","text":"One important thing that happened was ________."},{"k":"s","text":"Another thing I did was ________."},{"k":"s","text":"I want to remember that ________."}],"checks":["I stayed on topic.","I added supporting details.","My ideas make sense to the reader."]},{"key":"organization","goal":"Clear beginning, middle, and end with simple paragraphs.","starters":[{"k":"l","label":"Beginning","opts":["Today…","This morning…","After lunch…"]},{"k":"l","label":"Middle","opts":["Then… After that… Later…"]},{"k":"l","label":"End","opts":["I felt ________ because ________."]}],"checks":["I used paragraphs.","My ideas are in logical order.","My ending shows my feelings or reflection."]},{"key":"voice","goal":"A consistent personal voice that shows feelings and thoughts.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I was thinking ________."},{"k":"s","text":"It was so ________!"},{"k":"s","text":"I liked ________ because ________."}],"checks":["My voice is consistent.","My tone matches a personal journal.","I used feelings and thoughts to show personality."]},{"key":"word choice","goal":"Descriptive vocabulary that adds detail and clarity.","starters":[{"k":"s","text":"The best part was ________."},{"k":"s","text":"It looked ________ (adjective + noun)."},{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."}],"checks":["I used specific nouns and strong verbs.","I used adjectives to add detail.","My words help the reader imagine my day."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and smooth rhythm.","starters":[{"k":"g","label":"I can start sentences with","items":["Today…","Then…","After that…","When…","Later…"]},{"k":"s","text":"I can join ideas with and, but, so, when, if."}],"checks":["My sentences have variety.","My writing is easy to read aloud.","I used different lengths and patterns."]},{"key":"conventions","goal":"","starters":[{"k":"s","text":"I used a/an/the correctly."},{"k":"s","text":"I checked my verbs:"},{"k":"l","label":"Past","opts":["worked, visited, felt"]},{"k":"l","label":"Present","opts":["work, visit, feel"]},{"k":"l","label":"Future","opts":["will work, will visit, will feel"]},{"k":"s","text":"I used commas in a list: ________, ________, and ________."},{"k":"s","text":"I capitalized all proper nouns."}],"checks":["Capital letters and end punctuation are correct.","Commas used accurately in lists.","Spelling of simple and some complex words is correct.","Handwriting is neat and spaced."]}],"page":[{"title":"What my journal should look like","items":["Date at the top","Two or three short paragraphs","Clear beginning, middle, and end","Feelings and reflections"]},{"title":"What goes in each paragraph","items":["Paragraph 1: What happened first","Paragraph 2: What happened next","Paragraph 3: How you felt or what you learned"]},{"title":"Grade 2 writing moves to try","items":["Use time words (today, later, after that)","Use strong verbs (explored, created, discovered)","Use adjectives (bright poster, exciting chapter)","Use prepositions correctly (inside, behind, across)","Use complex conjunctions (when, if, because)"]}],"challenge":["Add a short dialogue line (“I said, ‘…’”)","Add a reflection (“Next time I want to…”)","Add a descriptive sentence about a place or activity","Add a simile (“as loud as thunder”)"]},{"id":"g3-story","grade":3,"genre":"Fictional Narrative","kind":"story","example":{"blocks":[{"t":"p","text":"Mira loved visiting her grandfather’s tiny clock shop at the end of Maple Street. Every shelf was filled with ticking clocks—tall ones, tiny ones, golden ones, and even one shaped like a cat. Mira’s favourite was the old wooden cuckoo clock that never worked. “One day,” her grandfather always said, “you’ll be the one to fix it.”"},{"t":"p","text":"One rainy afternoon, Mira decided to try. She carefully opened the back of the clock and discovered a small silver key hidden inside. “That’s strange,” she whispered. She had never seen it before. When she turned the key, the entire shop began to shimmer. The clocks ticked faster and faster until—WHOOSH!—a bright flash filled the room."},{"t":"p","text":"Suddenly, Mira found herself standing in a forest where giant gears turned like trees. A tiny mechanical bird fluttered toward her. “You must help us,” it chirped. “The Time Tree has stopped, and our world is slowing down.” Mira felt nervous, but she knew she had to try."},{"t":"p","text":"She followed the bird to a tall tree made of spinning wheels and glowing numbers. At the very top, a golden gear was missing. Mira reached into her pocket and felt the silver key. “Maybe this will work,” she said. She climbed carefully, slipped the key into the empty space, and turned it."},{"t":"p","text":"The Time Tree began to glow. The gears spun smoothly again. “You fixed it!” the bird cheered."},{"t":"p","text":"In another flash, Mira was back in the shop. The cuckoo clock chimed loudly for the first time in years. Her grandfather smiled. “I knew you could do it.”"},{"t":"p","text":"Mira grinned, wondering if the magical world had been real—or if the clock was simply full of surprises."}],"title":"The Clockmaker’s Apprentice"},"traits":[{"key":"ideas","goal":"A clear, focused main idea with depth and development.","starters":[{"k":"s","text":"My story is about ________ who must ________."},{"k":"s","text":"The main problem is ________, and it matters because ________."},{"k":"s","text":"A key moment in my story is when ________."},{"k":"s","text":"I developed my idea by adding details about ________."},{"k":"s","text":"My story will entertain the reader by ________."}],"checks":["My idea is clear, focused, and developed.","I stayed on task.","I added rich supporting details."]},{"key":"organization","goal":"Logical paragraphs, purposeful transitions, and well-integrated dialogue.","starters":[{"k":"l","label":"Beginning","opts":["Long ago…","One afternoon…","Meanwhile…"]},{"k":"l","label":"Middle","opts":["As the problem grew…","At the same time…","Because of this…"]},{"k":"l","label":"End","opts":["In the end…","Finally…","After everything that happened…"]},{"k":"g","label":"Dialogue (new speaker, new line)","items":["“________,” said ________.","On a new line: “________!”"]}],"checks":["I used indented paragraphs.","My transitions include next, after that, meanwhile, although, however.","My dialogue is correctly paragraphed."]},{"key":"voice","goal":"A consistent personal style and appropriate narrative tone.","starters":[{"k":"s","text":"My character felt ________ when ________."},{"k":"s","text":"I want the reader to sense ________ during this moment."},{"k":"s","text":"I chose this detail because it shows ________."},{"k":"s","text":"My narrator’s voice sounds ________ (curious, brave, worried)."}],"checks":["My voice is consistent.","My tone matches a fiction story.","I used feelings, thoughts, and reactions to show personality."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"The setting looks ________ (adjective + noun)."},{"k":"s","text":"My character moved ________ (adverb)."},{"k":"s","text":"I used sensory detail: I saw… I heard… I felt…"}],"checks":["I used specific nouns, strong verbs, precise adjectives, and adverbs.","My words create imagery.","My vocabulary adds depth."]},{"key":"sentence fluency","goal":"Varied sentence types, flowing rhythm, and complex structures.","starters":[{"k":"g","label":"I can start sentences with","items":["As…","While…","Although…","Because…","Suddenly…"]},{"k":"s","text":"I can use complex conjunctions: although, however, while, because, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used perfect tense when needed","items":["She has found…","They had climbed…"]},{"k":"s","text":"I checked my verbs: past, present, future, progressive."},{"k":"g","label":"I used commas after transitions","items":["Meanwhile, the clock ticked faster."]},{"k":"g","label":"I used quotation marks correctly","items":["“________,” she said."]},{"k":"g","label":"I used apostrophes for possession","items":["Mira’s key"]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my narrative should look like","items":["Title","4–6 paragraphs","Clear beginning, rising action, climax, resolution","Dialogue correctly paragraphed","Rich description and transitions"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce character + setting + hint of problem","Paragraph 2–3: Rising action, complications, dialogue","Paragraph 4: Climax","Paragraph 5: Resolution","Paragraph 6 (optional): Reflection or twist"]},{"title":"Grade 3 writing moves to try","items":["Use advanced transitions (meanwhile, although, however)","Use complex sentences","Use figurative language (simile, metaphor, personification)","Use precise verbs (darted, shimmered, whispered)","Use adverbial phrases (with careful steps, in the dim light)"]}],"challenge":["Add a subplot or secondary character","Add a twist in the climax","Use a metaphor (“The gears were a forest of turning metal”)","Use perfect tense accurately","Use purposeful interjections (“Wait!” “Oh no!”)"]},{"id":"g3-letter","grade":3,"genre":"Letter Writing","kind":"letter","example":{"blocks":[{"t":"p","text":"I hope you are doing well. I am writing to tell you about our class field trip to the Science Discovery Museum because I think you would enjoy hearing about what we learned."},{"t":"p","text":"When we first arrived, we explored the “Forces and Motion” exhibit. My favourite part was the wind tunnel. We tested how different shapes moved in the air. I discovered that a flat paper square spun wildly, while a curved shape glided smoothly. It reminded me of the paper helicopter we made last year."},{"t":"p","text":"After lunch, we visited the planetarium. The room became completely dark, and stars appeared all around us. The guide explained how constellations were used long ago to help people travel. I felt amazed when the ceiling lit up with swirling galaxies. It made me wonder what it would be like to visit another planet."},{"t":"p","text":"At the end of the trip, I felt inspired. I learned so many new things, and I want to read more about space. Thank you for teaching us to stay curious. I hope I can tell you more about what I discover."}],"greeting":"Dear Mr. Alvarez,","closing":"Sincerely,","name":"Hana"},"traits":[{"key":"ideas","goal":"A clear, focused purpose with developed supporting details.","starters":[{"k":"s","text":"I am writing to ________ because ________."},{"k":"s","text":"One important detail I want to share is ________."},{"k":"s","text":"Another thing I learned/noticed was ________."},{"k":"s","text":"This connects to ________ because ________."},{"k":"s","text":"My reader will understand ________ after reading this."}],"checks":["My purpose is clear and focused.","I added rich, relevant details.","My writing stays linked to the task."]},{"key":"organization","goal":"Logical paragraphs, transitions, and clear structure.","starters":[{"k":"l","label":"Opening","opts":["I hope you are doing well. I am writing to…"]},{"k":"l","label":"Body Paragraph 1","opts":["First…","To begin with…","When we arrived…"]},{"k":"l","label":"Body Paragraph 2","opts":["Later…","After that…","Meanwhile…"]},{"k":"l","label":"Closing","opts":["In the end…","I felt…","Thank you for…"]}],"checks":["I used indented paragraphs.","My ideas are in logical order.","I used transitions like after that, meanwhile, although."]},{"key":"voice","goal":"A consistent, appropriate tone that matches the audience.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I want you to know that ________."},{"k":"s","text":"I chose this detail because it shows ________."},{"k":"s","text":"My tone is ________ (respectful, friendly, enthusiastic)."}],"checks":["My voice is consistent.","My tone matches the audience (teacher, family member, principal).","I used feelings and reflections to show personality."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"The place looked ________ (adjective + noun)."},{"k":"s","text":"This detail helps the reader imagine ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","My vocabulary adds clarity and depth.","My words help the reader visualize."]},{"key":"sentence fluency","goal":"Varied sentence beginnings and complex structures.","starters":[{"k":"g","label":"I can start sentences with","items":["When…","Although…","Because…","As soon as…","While…"]},{"k":"s","text":"I can use conjunctions like although, however, because, while, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["After lunch, we visited the planetarium."]},{"k":"g","label":"I used quotation marks correctly if I included dialogue","items":["“________,” I said."]},{"k":"s","text":"I checked my verb tenses: past, present, future, progressive, perfect."},{"k":"g","label":"I used apostrophes for possession","items":["the guide’s explanation"]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my letter should look like","items":["Date (optional)","Greeting","Three or more paragraphs","Clear purpose","Detailed body","Polite closing and signature"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Purpose + context","Paragraph 2: First main detail","Paragraph 3: Second main detail","Paragraph 4: Reflection or closing"]},{"title":"Grade 3 writing moves to try","items":["Use advanced transitions (meanwhile, although, however)","Use complex sentences","Use precise verbs (explained, discovered, observed)","Use figurative language (a room filled with swirling galaxies)","Use topic-specific vocabulary"]}],"challenge":["Add a short anecdote or mini-story","Add a comparison (“It reminded me of…”)","Add a rhetorical question","Use perfect tense accurately (“I have learned…”)"]},{"id":"g3-info","grade":3,"genre":"Informational Text","kind":"info","example":{"blocks":[{"t":"p","text":"Coral reefs are one of the most diverse and important ecosystems on Earth. Although they look like colourful underwater plants, corals are actually tiny animals called polyps. These polyps live together in large groups and build hard skeletons that form the structure of the reef. Because reefs provide food and shelter for so many species, scientists often call them the “rainforests of the sea.”"},{"t":"p","text":"Many different animals depend on coral reefs to survive. Brightly coloured fish hide between the coral branches to stay safe from predators. Sea turtles visit reefs to find sponges to eat, while octopuses use their camouflage to blend into the rocks. Meanwhile, sharks patrol the deeper areas, keeping the food chain balanced. Without coral reefs, many ocean animals would lose their homes."},{"t":"p","text":"Coral reefs are also important for people. They protect coastlines from strong waves, and they support fishing communities around the world. In addition, coral reefs attract millions of tourists each year, which helps local economies. However, reefs are in danger because of pollution, overfishing, and rising ocean temperatures."},{"t":"p","text":"To protect coral reefs, scientists and communities are working together. Some groups plant new corals, while others create protected areas where fishing is limited. Even small actions—like reducing plastic waste—can help keep reefs healthy."},{"t":"p","text":"Coral reefs are beautiful, complex, and essential. By learning about them, we can understand why they must be protected for the future."}],"title":"The Amazing World of Coral Reefs"},"traits":[{"key":"ideas","goal":"A clear, focused topic with rich development and accurate details.","starters":[{"k":"s","text":"My topic is ________, and it is important because ________."},{"k":"s","text":"One key idea readers should know is ________."},{"k":"s","text":"This detail shows ________ because ________."},{"k":"s","text":"Another important fact is ________."},{"k":"s","text":"This information helps the reader understand ________."}],"checks":["My main idea is clear and focused.","I added rich, accurate supporting details.","My writing stays linked to the task."]},{"key":"organization","goal":"Logical paragraphs, clear sections, and advanced transitions.","starters":[{"k":"l","label":"Introduction","opts":["________ are…","This text will explain…"]},{"k":"g","label":"Body Paragraphs","items":["To begin with…","Another important part is…","Meanwhile…","In addition…"]},{"k":"l","label":"Conclusion","opts":["In conclusion…","This matters because…"]}],"checks":["I used indented paragraphs.","My ideas are logically grouped.","I used transitions like meanwhile, although, however, in addition."]},{"key":"voice","goal":"A consistent, knowledgeable, informative tone.","starters":[{"k":"s","text":"Scientists believe ________."},{"k":"s","text":"You might be surprised to learn that ________."},{"k":"s","text":"It is interesting that ________."},{"k":"s","text":"I want readers to understand ________."}],"checks":["My tone is informative and appropriate.","My voice is consistent.","I sound like I understand my topic."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth and clarity.","starters":[{"k":"s","text":"A topic-specific word I used is ________, which means ________."},{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and topic vocabulary.","My words add depth and clarity.","My vocabulary helps the reader understand and imagine."]},{"key":"sentence fluency","goal":"Varied sentence beginnings, complex structures, and smooth flow.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","In addition…"]},{"k":"s","text":"I can use conjunctions like although, however, because, while, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings and lengths."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["In addition, coral reefs protect coastlines."]},{"k":"g","label":"I used apostrophes for possession","items":["the ocean’s temperature"]},{"k":"g","label":"I checked my verb tenses","items":["present, past, future, progressive, perfect"]},{"k":"s","text":"I used quotation marks correctly if I included expert statements."}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my informational text should look like","items":["Title","4–5 paragraphs","Clear introduction","Grouped facts in logical sections","Conclusion that wraps up the topic"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the topic","Paragraph 2: First main idea","Paragraph 3: Second main idea","Paragraph 4: Third main idea or problem/solution","Paragraph 5: Conclusion"]},{"title":"Grade 3 wri
