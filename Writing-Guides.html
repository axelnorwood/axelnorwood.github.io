ting moves to try","items":["Use advanced transitions (meanwhile, although, however, in addition)","Use topic-specific vocabulary","Use complex sentences","Use figurative language when appropriate (e.g., “rainforests of the sea”)","Use adverbial phrases (in warm oceans, during the night, with careful movements)"]}],"challenge":["Add a comparison (“Coral reefs are similar to…”)","Add a cause-and-effect explanation","Add a labelled diagram or glossary","Use perfect tense accurately (“Scientists have discovered…”)"]},{"id":"g3-howto","grade":3,"genre":"Procedural Writing","kind":"howto","example":{"blocks":[{"t":"p","text":"Creating a mini volcano is an exciting science activity that shows how chemical reactions work. Before you begin, make sure you have all the materials ready so the experiment runs smoothly."},{"t":"h","text":"You will need"},{"t":"ul","items":["A small plastic bottle","Baking soda","Vinegar","Dish soap","Red food colouring","A tray","A funnel"]},{"t":"h","text":"Steps"},{"t":"ol","items":["First, place the plastic bottle in the centre of the tray. This will help catch the “lava” when it erupts.","Next, use the funnel to pour two spoonfuls of baking soda into the bottle.","After that, add a small squeeze of dish soap and a few drops of red food colouring. These ingredients make the eruption look foamy and bright.","Then, slowly pour vinegar into the bottle.","Finally, step back and watch as the mixture bubbles up and spills over the sides like real lava."]},{"t":"p","text":"Safety Tip: Although this experiment is safe, make sure to do it in a place where spills are easy to clean."},{"t":"p","text":"Now your volcano is complete. You can repeat the eruption by adding more baking soda and vinegar."}],"title":"How to Build a Mini Volcano"},"traits":[{"key":"ideas","goal":"A clear, focused procedure with rich development and accurate steps.","starters":[{"k":"s","text":"This procedure will teach you how to ________."},{"k":"s","text":"The purpose of this activity is to ________."},{"k":"s","text":"One important step is ________ because ________."},{"k":"s","text":"Another detail readers need to know is ________."},{"k":"s","text":"This helps the reader understand ________."}],"checks":["My purpose is clear and focused.","I added rich, accurate details.","My writing stays linked to the task."]},{"key":"organization","goal":"Logical paragraphs, clear sections, and advanced transitions.","starters":[{"k":"l","label":"Introduction","opts":["Today I will explain how to…"]},{"k":"l","label":"Materials","opts":["You will need…"]},{"k":"g","label":"Steps","items":["To begin…","After that…","Meanwhile…","As a final step…"]},{"k":"l","label":"Conclusion","opts":["Now you can…","Your ________ is ready."]}],"checks":["I used indented paragraphs.","My steps are in logical order.","I used transitions like meanwhile, although, however, after that."]},{"key":"voice","goal":"A consistent, helpful, confident tone.","starters":[{"k":"s","text":"Be careful when you ________."},{"k":"s","text":"It is helpful to ________."},{"k":"s","text":"You might notice that ________."},{"k":"s","text":"I want the reader to feel confident about ________."}],"checks":["My tone is helpful and appropriate.","My voice is consistent.","I sound like I understand the procedure."]},{"key":"word choice","goal":"Precise, rich vocabulary that adds clarity and depth.","starters":[{"k":"s","text":"A precise verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This material is important because ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and topic vocabulary.","My words add clarity and depth.","My vocabulary helps the reader follow the steps easily."]},{"key":"sentence fluency","goal":"Varied sentence beginnings, complex structures, and smooth flow.","starters":[{"k":"g","label":"I can start sentences with","items":["When…","Although…","As soon as…","While…","Because…"]},{"k":"s","text":"I can use conjunctions like although, however, because, while, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings and lengths."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["After that, pour the mixture into the bowl."]},{"k":"g","label":"I used apostrophes for possession","items":["the experiment’s result"]},{"k":"g","label":"I checked my verb tenses","items":["present, past, future, progressive, perfect"]},{"k":"g","label":"I used imperative verbs correctly","items":["Mix, pour, attach, fold"]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my procedural text should look like","items":["Title","Introduction paragraph","Materials list","Numbered steps","Conclusion or tip section"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the purpose","Paragraph 2: Materials","Paragraph 3: Steps","Paragraph 4: Conclusion or safety tip"]},{"title":"Grade 3 writing moves to try","items":["Use advanced transitions (meanwhile, although, however)","Use complex sentences","Use precise verbs (measure, attach, combine, observe)","Use topic-specific vocabulary","Use adverbial phrases (with careful movements, in a safe area)"]}],"challenge":["Add a “Why this works” science explanation","Add a labelled diagram","Add a troubleshooting section (“If it doesn’t work, try…”)","Use perfect tense accurately (“You have created…”)"]},{"id":"g3-persuade","grade":3,"genre":"Persuasive Writing","kind":"persuade","example":{"blocks":[{"t":"p","text":"I strongly believe our school should have a weekly Reading Afternoon because it would help students become better readers and more confident learners. Reading is one of the most important skills we use every day. If we had a special time each week to read quietly, students could explore new genres, discover new authors, and build stronger reading habits."},{"t":"p","text":"One reason we need a Reading Afternoon is that it would improve our focus. When we read during busy school days, we often have to stop for transitions or switch subjects quickly. However, a dedicated reading time would allow us to stay in one place and concentrate deeply. Research shows that longer reading sessions help students understand stories more clearly and remember information better."},{"t":"p","text":"Another reason is that Reading Afternoon would help students enjoy reading more. Some students only read because it is assigned. Meanwhile, others want more time to read books they love. A weekly reading session would give everyone the chance to choose books that interest them—mysteries, comics, science books, or even poetry. When students enjoy reading, they are more likely to read at home too."},{"t":"p","text":"Finally, Reading Afternoon would build a stronger school community. Teachers could recommend books, students could share their favourites, and classes could celebrate reading together. This would create a positive atmosphere where reading feels exciting instead of rushed."},{"t":"p","text":"For these reasons, I believe our school should start a weekly Reading Afternoon. It would help us focus, enjoy reading more, and grow as a community of readers."}],"title":"Why Our School Should Have a Weekly Reading Afternoon"},"traits":[{"key":"ideas","goal":"A clear, focused opinion with rich development and accurate support.","starters":[{"k":"s","text":"I strongly believe ________ because ________."},{"k":"s","text":"My opinion is ________, and it matters because ________."},{"k":"s","text":"One important reason is ________."},{"k":"s","text":"Another reason is ________."},{"k":"s","text":"This detail shows ________ because ________."}],"checks":["My opinion is clear and focused.","I added rich, relevant reasons.","My writing stays linked to the task."]},{"key":"organization","goal":"Logical paragraphs, transitions, and a clear persuasive structure.","starters":[{"k":"l","label":"Introduction","opts":["I believe…","In my opinion…"]},{"k":"g","label":"Reason Paragraphs","items":["To begin with…","Another important reason is…","Meanwhile…","Because of this…"]},{"k":"l","label":"Conclusion","opts":["For these reasons…","This is why…"]}],"checks":["I used indented paragraphs.","My reasons are in logical order.","I used transitions like meanwhile, although, however, in addition."]},{"key":"voice","goal":"A confident, consistent, persuasive tone.","starters":[{"k":"s","text":"I want the reader to understand that ________."},{"k":"s","text":"It is important because ________."},{"k":"s","text":"You might be surprised to learn that ________."},{"k":"s","text":"I chose this example because ________."}],"checks":["My voice is confident and consistent.","My tone matches persuasive writing.","I used feelings, emphasis, and strong statements to convince."]},{"key":"word choice","goal":"Rich, precise vocabulary that strengthens the argument.","starters":[{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A persuasive phrase I added is ________."},{"k":"s","text":"This detail helps the reader imagine ________."},{"k":"s","text":"This word shows ________ because ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","My vocabulary adds depth and clarity.","My words help convince the reader."]},{"key":"sentence fluency","goal":"Varied sentence beginnings, complex structures, and smooth flow.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","In addition…"]},{"k":"s","text":"I can use conjunctions like although, however, because, while, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings and lengths."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["In addition, students would enjoy reading more."]},{"k":"g","label":"I used apostrophes for possession","items":["the school’s reading time"]},{"k":"g","label":"I checked my verb tenses","items":["present, past, future, progressive, perfect"]},{"k":"s","text":"I used quotation marks correctly if I included examples of speech."}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my persuasive text should look like","items":["Title","4–5 paragraphs","Clear opinion","Strong reasons with details","Conclusion that restates the opinion"]},{"title":"What goes in each paragraph","items":["Paragraph 1: State opinion clearly","Paragraph 2: First reason + details","Paragraph 3: Second reason + details","Paragraph 4: Third reason or community impact","Paragraph 5: Conclusion"]},{"title":"Grade 3 writing moves to try","items":["Use advanced transitions (meanwhile, although, however, in addition)","Use complex sentences","Use precise verbs (improve, encourage, support)","Use persuasive vocabulary (essential, beneficial, strongly believe)","Use examples, comparisons, and explanations"]}],"challenge":["Add a counterargument (“Some people think…, however…”)","Add a real-world example","Add a rhetorical question"]},{"id":"g3-journal","grade":3,"genre":"Journal","kind":"journal","example":{"blocks":[{"t":"p","text":"Today was one of the most memorable days we’ve had in class this term. In the morning, our teacher surprised us with a “mystery challenge.” We had to work in groups to build the tallest tower using only paper, tape, and straws. At first, our tower kept falling over, which was frustrating. However, we noticed that folding the paper made it stronger, so we rebuilt the base. This time, it stood tall and steady."},{"t":"p","text":"After lunch, we presented our towers to the class. Some groups made wide, sturdy towers, while others built tall, thin ones. When it was our turn, I explained how we changed our design after it collapsed. I felt nervous speaking in front of everyone, but my group encouraged me. When our tower stayed standing during the “shake test,” we all cheered."},{"t":"p","text":"At the end of the day, I felt proud and more confident. I learned that mistakes can help you improve if you pay attention to them. I also realized how important teamwork is. I hope we do another challenge soon because it helped me grow as a learner."}],"date":"March 12"},"traits":[{"key":"ideas","goal":"A clear, focused event with rich development and reflection.","starters":[{"k":"s","text":"Today I experienced ________, which was important because ________."},{"k":"s","text":"One key moment was when ________."},{"k":"s","text":"This mattered to me because ________."},{"k":"s","text":"Another detail that stood out was ________."},{"k":"s","text":"I learned that ________."}],"checks":["My main idea is clear and focused.","I added rich, relevant details.","I stayed on topic."]},{"key":"organization","goal":"Logical paragraphs, transitions, and a clear beginning–middle–end.","starters":[{"k":"l","label":"Beginning","opts":["This morning…","At the start of the day…"]},{"k":"l","label":"Middle","opts":["Then… After that… Meanwhile…"]},{"k":"l","label":"End","opts":["In the end…","I realized…","I felt ________ because ________."]}],"checks":["I used indented paragraphs.","My ideas are in logical order.","I used transitions like meanwhile, although, however."]},{"key":"voice","goal":"A consistent, personal, reflective tone.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I want to remember this because ________."},{"k":"s","text":"I chose to write about this because ________."},{"k":"s","text":"This moment showed me that ________."}],"checks":["My voice is consistent and personal.","My tone matches a reflective journal.","I used feelings and thoughts to show personality."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth and clarity.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"The place looked ________ (adjective + noun)."},{"k":"s","text":"This detail helps the reader imagine ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","My vocabulary adds depth and clarity.","My words help the reader visualize."]},{"key":"sentence fluency","goal":"Varied sentence beginnings, complex structures, and smooth flow.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As soon as…","Even though…"]},{"k":"s","text":"I can use conjunctions like although, however, because, while, therefore."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","I varied my sentence beginnings and lengths."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["After lunch, we presented our towers."]},{"k":"g","label":"I used apostrophes for possession","items":["the group’s design"]},{"k":"g","label":"I checked my verb tenses","items":["present, past, future, progressive, perfect"]},{"k":"s","text":"I used quotation marks correctly if I included dialogue."}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of common and complex words is accurate."]}],"page":[{"title":"What my journal should look like","items":["Date","Three or more paragraphs","Clear beginning, middle, and end","Reflection at the end"]},{"title":"What goes in each paragraph","items":["Paragraph 1: What happened first","Paragraph 2: What happened next","Paragraph 3: Reflection—how you felt, what you learned"]},{"title":"Grade 3 writing moves to try","items":["Use advanced transitions (meanwhile, although, however)","Use complex sentences","Use precise verbs (observed, constructed, realized)","Use descriptive vocabulary","Use reflection to show growth"]}],"challenge":["Add a short dialogue line","Add a comparison (“It felt like…”)","Add a reflection about how this connects to another experience","Use perfect tense accurately (“I have learned…”)"]},{"id":"g4-story","grade":4,"genre":"Fictional Narrative","kind":"story","example":{"blocks":[{"t":"p","text":"Lena had explored every corner of her grandmother’s house—except the attic. It was the only place she wasn’t allowed to enter. “Too dusty,” her grandmother always said. But Lena suspected there was another reason. One stormy afternoon, when the wind rattled the windows and her grandmother was napping, Lena noticed the attic door was slightly open."},{"t":"p","text":"Curiosity tugged at her like an invisible string. She climbed the narrow staircase, each step creaking beneath her feet. The attic smelled of old books and cedar wood. Sunlight slipped through the small window, landing on a single object in the centre of the room: a silver lantern covered in swirling patterns."},{"t":"p","text":"“Hello?” Lena whispered, even though she knew no one was there."},{"t":"p","text":"As she reached for the lantern, it flickered to life. A soft blue glow filled the attic. Suddenly, the floorboards shimmered, and the room transformed. Instead of dusty boxes, Lena found herself standing in a forest of glowing trees. Their leaves sparkled like tiny stars. A fox with shimmering fur stepped forward."},{"t":"p","text":"“You’ve awakened the Lantern of Paths,” the fox said calmly. “It reveals the place you need most.”"},{"t":"p","text":"Lena’s heart pounded. “Why did it bring me here?”"},{"t":"p","text":"The fox tilted its head. “Because you’ve been feeling lost. This forest shows you the courage you already have.”"},{"t":"p","text":"Before Lena could reply, the lantern’s glow brightened. The forest dissolved, and she was back in the attic, holding the now-dim lantern. She heard her grandmother calling her name."},{"t":"p","text":"Lena hurried downstairs, the lantern’s warmth still lingering in her hands. She didn’t tell her grandmother what happened—not yet. But she knew she would return to the attic again, when she was ready to discover more."}],"title":"The Lantern in the Attic"},"traits":[{"key":"ideas","goal":"A clear, focused main idea with rich development and depth.","starters":[{"k":"s","text":"My story is about ________, who must ________."},{"k":"s","text":"The central problem is ________, and it matters because ________."},{"k":"s","text":"A key moment that develops the story is when ________."},{"k":"s","text":"This detail adds depth because ________."},{"k":"s","text":"I want the reader to understand that ________."}],"checks":["My idea is clear, focused, and developed.","I added rich, relevant details.","My story is clearly written to entertain."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Beginning","opts":["Long ago…","On a stormy afternoon…","Although everything seemed normal…"]},{"k":"l","label":"Middle","opts":["Meanwhile…","Despite this…","As the tension grew…"]},{"k":"l","label":"Climax","opts":["Suddenly…","At that moment…"]},{"k":"l","label":"Ending","opts":["In the end…","After everything that happened…"]},{"k":"g","label":"Dialogue (new speaker, new line)","items":["“________,” she said.","On a new line: “________!”","The character replied, “________.”"]}],"checks":["I used structured, indented paragraphs.","I used challenging transitions (meanwhile, nevertheless, despite).","I used stylistic devices (hooks, imagery, layout) to guide the reader."]},{"key":"voice","goal":"A consistent, appropriate narrative voice with a clearly maintained perspective.","starters":[{"k":"s","text":"I want the reader to sense ________ during this moment."},{"k":"s","text":"My character’s perspective is shown when ________."},{"k":"s","text":"This detail reveals the character’s feelings because ________."},{"k":"s","text":"My narrator’s voice sounds ________ (curious, brave, uncertain)."}],"checks":["My voice is consistent and appropriate.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary that creates atmosphere and mood.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase that builds atmosphere is ________."},{"k":"s","text":"The setting feels ________ because I described ________."},{"k":"s","text":"This word choice adds emotion because ________."}],"checks":["I used rich, precise vocabulary.","My words create mood and atmosphere.","I used loaded vocabulary to generate emotion."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Despite…","As soon as…","Because of this…"]},{"k":"s","text":"I can use complex conjunctions: although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["Meanwhile, the lantern glowed brighter."]},{"k":"g","label":"I used apostrophes for possession","items":["the fox’s voice"]},{"k":"g","label":"I used perfect tense when needed","items":["She had discovered the lantern."]},{"k":"g","label":"I used active/passive forms accurately","items":["The room was transformed by the light."]},{"k":"s","text":"I used quotation marks correctly for dialogue."}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my narrative should look like","items":["Title","4–7 structured paragraphs","Clear beginning, rising action, climax, resolution","Dialogue correctly paragraphed","Stylistic devices (hooks, imagery, layout)"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Hook + character + setting + hint of problem","Paragraph 2–3: Rising action with complications","Paragraph 4: Climax","Paragraph 5: Resolution","Paragraph 6–7 (optional): Reflection or twist"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use figurative language (simile, metaphor, personification)","Use adverbial phrases (with trembling hands, in the dim attic light)","Use active/passive voice purposefully","Use loaded vocabulary to build mood"]}],"challenge":["Add a symbolic object (like the lantern)","Add a subplot or secondary conflict","Add a twist ending","Use perfect tense accurately","Use purposeful passive voice for effect"]},{"id":"g4-letter","grade":4,"genre":"Letter Writing","kind":"letter","example":{"blocks":[{"t":"p","text":"I hope you are having a wonderful week. I am writing to tell you about our class’s environmental project because I think you would be proud of what we accomplished."},{"t":"p","text":"To begin with, our group investigated how much plastic waste our school produces each day. Although the task seemed overwhelming at first, we created a simple system to collect data. We placed labelled bins in the cafeteria and recorded the amount of plastic students threw away during lunch. Surprisingly, we discovered that most of the waste came from single-use drink containers."},{"t":"p","text":"After gathering the data, we designed a plan to reduce plastic waste. We created posters encouraging students to bring reusable bottles, and we presented our findings during assembly. Meanwhile, another group worked with the office staff to introduce a “refill station” near the gym. When we checked the bins again a week later, the amount of plastic had already decreased."},{"t":"p","text":"This project taught me a lot about teamwork and responsibility. I realized that even small changes can make a big difference when everyone participates. Thank you for inspiring us to take action and care for our environment. I hope we can share our final report with you soon."}],"greeting":"Dear Ms. Rivera,","closing":"Sincerely,","name":"Aria"},"traits":[{"key":"ideas","goal":"A clear, focused purpose with rich development and depth.","starters":[{"k":"s","text":"I am writing to ________ because ________."},{"k":"s","text":"One important detail I want to share is ________."},{"k":"s","text":"This matters because ________."},{"k":"s","text":"Another key point is ________."},{"k":"s","text":"This example shows ________ because ________."}],"checks":["My purpose is clear and focused.","I added rich, relevant details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Opening","opts":["I hope you are doing well. I am writing to…"]},{"k":"l","label":"Body Paragraph 1","opts":["To begin with…","Although…","At first…"]},{"k":"l","label":"Body Paragraph 2","opts":["Meanwhile…","In addition…","Despite this…"]},{"k":"l","label":"Closing","opts":["In the end…","This experience taught me…","Thank you for…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically sequenced.","I used transitions like meanwhile, nevertheless, despite.","I used stylistic devices (hook, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A consistent, appropriate tone with a clearly maintained perspective.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"I want you to understand that ________."},{"k":"s","text":"This detail shows my perspective because ________."},{"k":"s","text":"My tone is ________ (respectful, enthusiastic, reflective)."}],"checks":["My voice is consistent and appropriate.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth and clarity.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This word choice creates atmosphere because ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used rich, precise vocabulary.","My words add depth and emotion.","My vocabulary helps the reader understand and imagine."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Despite…","As a result…","Because of this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["In addition, we created posters."]},{"k":"g","label":"I used apostrophes for possession","items":["the project’s results"]},{"k":"g","label":"I used perfect tense when needed","items":["We had collected enough data."]},{"k":"g","label":"I used active/passive forms accurately","items":["The posters were displayed in the hallway."]},{"k":"s","text":"I used quotation marks correctly if I included dialogue."}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my letter should look like","items":["Date (optional)","Greeting","3–5 structured paragraphs","Clear purpose","Detailed body","Polite closing and signature"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Purpose + context","Paragraph 2: First main detail","Paragraph 3: Second main detail","Paragraph 4: Reflection or closing"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (investigated, encouraged, reduced)","Use figurative language when appropriate","Use stylistic devices (hooks, emphasis, layout)"]}],"challenge":["Add a short anecdote or mini-story","Add a comparison (“It reminded me of…”)","Add a rhetorical question","Use perfect tense accurately (“We have learned…”)","Use purposeful passive voice"]},{"id":"g4-info","grade":4,"genre":"Informational Text","kind":"info","example":{"blocks":[{"t":"p","text":"Honeybees are some of the most important insects on our planet, even though many people only notice them when they buzz past. A honeybee colony works like a well-organized city. Each bee has a specific job, and the survival of the hive depends on cooperation. Although bees are tiny, their impact on the environment is enormous."},{"t":"p","text":"Inside the hive, honeybees follow a strict system of roles. The queen bee lays thousands of eggs and keeps the colony growing. Worker bees, which are all female, clean the hive, feed the larvae, collect nectar, and protect the entrance. Meanwhile, drone bees have only one job: to mate with a queen. This division of labour allows the hive to function smoothly, even during difficult seasons."},{"t":"p","text":"Honeybees also play a crucial role in pollination. As bees travel from flower to flower collecting nectar, pollen sticks to their bodies. When they land on the next flower, some of the pollen rubs off, helping plants produce fruits and seeds. Without bees, many crops—such as apples, almonds, and strawberries—would struggle to grow. Therefore, bees are essential to global food production."},{"t":"p","text":"Unfortunately, honeybee populations are declining. Pesticides, habitat loss, and climate change all threaten their survival. In addition, diseases like varroa mites weaken entire colonies. Despite these challenges, scientists and communities are working together to protect bees by planting wildflowers, reducing pesticide use, and creating safe habitats."},{"t":"p","text":"Honeybees may be small, but their importance is enormous. By understanding how they live and why they matter, we can help protect them for the future."}],"title":"The Hidden Life of Honeybees"},"traits":[{"key":"ideas","goal":"A clear, focused topic with rich development and depth.","starters":[{"k":"s","text":"My topic is ________, and it is important because ________."},{"k":"s","text":"One key idea readers should understand is ________."},{"k":"s","text":"This detail adds depth because ________."},{"k":"s","text":"Another important fact is ________."},{"k":"s","text":"This information helps explain ________."}],"checks":["My main idea is clear and focused.","I added rich, accurate supporting details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful organizational devices.","starters":[{"k":"l","label":"Introduction","opts":["________ are…","This text will explain…"]},{"k":"g","label":"Body Paragraphs","items":["To begin with…","Meanwhile…","In addition…","Despite this…"]},{"k":"l","label":"Conclusion","opts":["In conclusion…","This matters because…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically grouped.","I used transitions like meanwhile, nevertheless, despite, in addition.","I used stylistic devices (headings, hooks, emphasis) to guide the reader."]},{"key":"voice","goal":"A consistent, knowledgeable, informative tone with a clearly maintained perspective.","starters":[{"k":"s","text":"Scientists believe ________."},{"k":"s","text":"You might be surprised to learn that ________."},{"k":"s","text":"It is important to understand that ________."},{"k":"s","text":"This detail shows ________ because ________."}],"checks":["My tone is informative and appropriate.","My perspective is clearly maintained.","I took creative risks with voice when appropriate."]},{"key":"word choice","goal":"Rich, precise vocabulary that creates clarity and depth.","starters":[{"k":"s","text":"A topic-specific word I used is ________, which means ________."},{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This word choice creates atmosphere because ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and topic vocabulary.","My words add depth and clarity.","My vocabulary helps the reader visualize and understand."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["In addition, bees help crops grow."]},{"k":"g","label":"I used apostrophes for possession","items":["the colony’s survival"]},{"k":"g","label":"I used perfect tense when needed","items":["Scientists have discovered new threats."]},{"k":"g","label":"I used active/passive forms accurately","items":["The flowers were pollinated by the bees."]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my informational text should look like","items":["Title","4–6 structured paragraphs","Clear introduction","Grouped facts in logical sections","Conclusion that wraps up the topic"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the topic","Paragraph 2: First main idea","Paragraph 3: Second main idea","Paragraph 4: Third main idea or problem/solution","Paragraph 5: Conclusion"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use topic-specific vocabulary","Use complex sentences","Use figurative language when appropriate","Use stylistic devices (headings, hooks, emphasis)"]}],"challenge":["Add a comparison (“Bees are similar to…”)","Add a cause-and-effect explanation","Add a labelled diagram or glossary","Use perfect tense accurately (“Scientists have observed…”)","Use purposeful passive voice"]},{"id":"g4-howto","grade":4,"genre":"Procedural Writing","kind":"howto","example":{"blocks":[{"t":"p","text":"Creating a shadow puppet show is an engaging way to combine storytelling, creativity, and science. Although it may look simple, a successful performance requires careful planning and attention to detail."},{"t":"h","text":"Materials"},{"t":"ul","items":["Cardboard or thick paper","Scissors","Wooden sticks or straws","Tape","A flashlight or lamp","A white sheet or blank wall","Markers (optional)"]},{"t":"h","text":"Steps"},{"t":"ol","items":["First, design your characters. Sketch simple shapes on cardboard, such as animals or people. Although detailed drawings look impressive, bold outlines create clearer shadows.","Next, cut out your characters carefully. Use scissors to follow the outline. Meanwhile, think about how each character will move during the performance.","After that, attach a stick to each puppet. Tape a wooden stick or straw to the back of the cardboard. Make sure it is secure so the puppet doesn’t wobble.","Then, prepare your stage. Hang a white sheet or choose a blank wall. Place a flashlight behind the puppets so the shadows appear clearly. Adjust the distance until the shadows look sharp.","Finally, rehearse your show. Move the puppets slowly to create smooth actions. If you have dialogue, practise speaking loudly and clearly. As a final step, perform your show for an audience."]},{"t":"h","text":"Helpful Tip"},{"t":"p","text":"If your shadows look blurry, move the puppets closer to the light source. Small adjustments can make a big difference."}],"title":"How to Create a Shadow Puppet Show"},"traits":[{"key":"ideas","goal":"A clear, focused procedure with rich development and depth.","starters":[{"k":"s","text":"This procedure will teach you how to ________."},{"k":"s","text":"The purpose of this activity is to ________."},{"k":"s","text":"One essential step is ________ because ________."},{"k":"s","text":"Another detail readers must understand is ________."},{"k":"s","text":"This explanation adds depth because ________."}],"checks":["My purpose is clear and focused.","I added rich, accurate details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Introduction","opts":["Today I will explain how to…"]},{"k":"l","label":"Materials","opts":["You will need…"]},{"k":"g","label":"Steps","items":["To begin with…","Meanwhile…","Despite this…","As a final step…"]},{"k":"l","label":"Conclusion","opts":["Now you can…","This process shows that…"]}],"checks":["I used structured, indented paragraphs.","My steps are in logical order.","I used transitions like meanwhile, nevertheless, despite.","I used stylistic devices (headings, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A consistent, helpful, confident tone with a clearly maintained perspective.","starters":[{"k":"s","text":"Be careful when you ________."},{"k":"s","text":"It is helpful to ________."},{"k":"s","text":"You might notice that ________."},{"k":"s","text":"This step is important because ________."}],"checks":["My tone is helpful and appropriate.","My perspective is clearly maintained.","I took creative risks with voice when appropriate."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds clarity and depth.","starters":[{"k":"s","text":"A precise verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This word choice creates clarity because ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and topic vocabulary.","My words add depth and clarity.","My vocabulary helps the reader follow the steps easily."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Because…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["After that, attach the stick."]},{"k":"g","label":"I used apostrophes for possession","items":["the puppet’s movement"]},{"k":"g","label":"I used perfect tense when needed","items":["You have created a complete set of puppets."]},{"k":"g","label":"I used active/passive forms accurately","items":["The stage was prepared with a white sheet."]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my procedural text should look like","items":["Title","Introduction paragraph","Materials list","Numbered steps","Conclusion or tip section"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the purpose","Paragraph 2: Materials","Paragraph 3: Steps","Paragraph 4: Conclusion or helpful tip"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (adjust, secure, position, demonstrate)","Use topic-specific vocabulary","Use stylistic devices (headings, bold words, layout)"]}],"challenge":["Add a “Why this works” scientific explanation","Add a troubleshooting section (“If your shadow is blurry…”)","Add a labelled diagram","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g4-persuade","grade":4,"genre":"Persuasive Writing","kind":"persuade","example":{"blocks":[{"t":"p","text":"I strongly believe our school should build an outdoor learning space because it would improve student wellbeing, strengthen our learning, and help us care for the environment. Although we already have a playground and a field, we do not have a dedicated area designed for outdoor lessons. Creating one would benefit every student in meaningful ways."},{"t":"p","text":"To begin with, learning outdoors helps students focus and feel calmer. Studies show that spending time in nature reduces stress and improves concentration. When we learn inside all day, the classroom can feel crowded and noisy. However, an outdoor learning space—with benches, plants, and shade—would give us a peaceful environment where we can think more clearly. Even a short lesson outside could make a big difference in our mood and energy."},{"t":"p","text":"Another important reason is that outdoor learning makes lessons more engaging. In science, for example, we could observe insects, measure shadows, or study plant growth directly instead of only reading about it. Meanwhile, in art, we could sketch natural textures or practise photography. These hands-on experiences would help us understand concepts more deeply and remember them for longer."},{"t":"p","text":"Finally, an outdoor learning space would encourage our school community to care for the environment. We could plant native flowers, create a small vegetable garden, or build habitats for insects. As a result, students would learn responsibility and teamwork while helping local wildlife. This space could even become a place where families volunteer together."},{"t":"p","text":"For these reasons, I strongly believe our school should build an outdoor learning space. It would support our wellbeing, make learning more meaningful, and help us protect the world around us."}],"title":"Why Our School Should Build an Outdoor Learning Space"},"traits":[{"key":"ideas","goal":"A clear, focused opinion with rich development and depth.","starters":[{"k":"s","text":"I strongly believe ________ because ________."},{"k":"s","text":"My opinion is ________, and it matters because ________."},{"k":"s","text":"One essential reason is ________."},{"k":"s","text":"Another key point is ________."},{"k":"s","text":"This example adds depth because ________."}],"checks":["My opinion is clear and focused.","I added rich, relevant reasons.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Introduction","opts":["I believe…","In my opinion…"]},{"k":"g","label":"Reason Paragraphs","items":["To begin with…","Meanwhile…","Despite this…","As a result…"]},{"k":"l","label":"Conclusion","opts":["For these reasons…","This is why…"]}],"checks":["I used structured, indented paragraphs.","My reasons are in logical order.","I used transitions like meanwhile, nevertheless, despite, in addition.","I used stylistic devices (hooks, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A confident, consistent persuasive voice with a clearly maintained perspective.","starters":[{"k":"s","text":"I want the reader to understand that ________."},{"k":"s","text":"This detail shows my perspective because ________."},{"k":"s","text":"My tone is ________ (confident, respectful, passionate)."},{"k":"s","text":"I chose this example because ________."}],"checks":["My voice is confident and consistent.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary that strengthens the argument.","starters":[{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A persuasive phrase I added is ________."},{"k":"s","text":"This word choice creates emotion because ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","My vocabulary adds depth and emotion.","My words help convince the reader."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["In addition, outdoor learning helps us focus."]},{"k":"g","label":"I used apostrophes for possession","items":["the school’s environment"]},{"k":"g","label":"I used perfect tense when needed","items":["Students have shown improvement."]},{"k":"g","label":"I used active/passive forms accurately","items":["The posters were displayed in the hallway."]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my persuasive text should look like","items":["Title","4–6 structured paragraphs","Clear opinion","Strong reasons with depth","Conclusion that restates and strengthens the opinion"]},{"title":"What goes in each paragraph","items":["Paragraph 1: State opinion clearly","Paragraph 2: First reason + development","Paragraph 3: Second reason + development","Paragraph 4: Third reason or community impact","Paragraph 5: Conclusion"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (improve, encourage, strengthen)","Use loaded vocabulary (essential, meaningful, beneficial)","Use examples, comparisons, and explanations"]}],"challenge":["Add a counterargument (“Some people think…, however…”)","Add a real-world example","Add a rhetorical question","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g4-journal","grade":4,"genre":"Journal","kind":"journal","example":{"blocks":[{"t":"p","text":"Today was one of those days that started out ordinary but ended up teaching me something important. In the morning, our class began a group engineering challenge. We had to design a bridge using only paper, tape, and string. At first, our group struggled to agree on a design. Although everyone had strong ideas, we kept interrupting each other, and the bridge looked more like a crumpled pile of paper than a structure."},{"t":"p","text":"After a short break, we tried again with a different approach. This time, we assigned roles: one person measured, another folded, and I was responsible for testing the strength. Meanwhile, we reminded each other to listen before speaking. As a result, our bridge slowly began to take shape. When we placed the final weight on top and it didn’t collapse, we all cheered."},{"t":"p","text":"At the end of the day, I realized how much teamwork depends on patience and communication. Even though the challenge was frustrating at first, it helped me understand that listening is just as important as sharing ideas. I hope we do another project like this soon because I want to keep improving the way I work with others."}],"date":"April 18"},"traits":[{"key":"ideas","goal":"A clear, focused event with rich development and depth.","starters":[{"k":"s","text":"Today I experienced ________, which was important because ________."},{"k":"s","text":"One key moment was when ________."},{"k":"s","text":"This mattered to me because ________."},{"k":"s","text":"Another detail that stood out was ________."},{"k":"s","text":"I learned that ________."}],"checks":["My main idea is clear and focused.","I added rich, relevant details.","I stayed linked to the task."]},{"key":"organization","goal":"Structured paragraphs, challenging transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Beginning","opts":["At the start of the day…","Although the morning seemed normal…"]},{"k":"l","label":"Middle","opts":["Meanwhile…","Despite this…","As the activity continued…"]},{"k":"l","label":"End","opts":["In the end…","I realized…","This experience taught me…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically sequenced.","I used transitions like meanwhile, nevertheless, despite.","I used stylistic devices (hooks, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A consistent, personal, reflective tone with a clearly maintained perspective.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"This detail shows my perspective because ________."},{"k":"s","text":"My tone is ________ (thoughtful, reflective, honest)."},{"k":"s","text":"I want the reader to understand that ________."}],"checks":["My voice is consistent and personal.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary that adds depth and clarity.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This word choice creates atmosphere because ________."},{"k":"s","text":"This detail helps the reader visualize ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","My vocabulary adds depth and emotion.","My words help the reader visualize and understand."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Because…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas after transitions","items":["After lunch, we tested our bridge again."]},{"k":"g","label":"I used apostrophes for possession","items":["the group’s design"]},{"k":"g","label":"I used perfect tense when needed","items":["We had improved our teamwork."]},{"k":"g","label":"I used active/passive forms accurately","items":["The bridge was strengthened by folding the paper."]}],"checks":["Grammar is accurate and varied.","Punctuation is consistently correct.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my journal should look like","items":["Date","3–5 structured paragraphs","Clear beginning, middle, and end","Reflection at the end"]},{"title":"What goes in each paragraph","items":["Paragraph 1: What happened first","Paragraph 2: What happened next","Paragraph 3: Reflection—how you felt, what you learned","Paragraph 4 (optional): Additional insight or connection"]},{"title":"Grade 4 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (constructed, adjusted, realized)","Use descriptive vocabulary","Use reflection to show growth"]}],"challenge":["Add a short dialogue line","Add a comparison (“It felt like…”)","Add a connection to a past experience","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g5-story","grade":5,"genre":"Fictional Narrative","kind":"story","example":{"blocks":[{"t":"p","text":"The first time Leo heard the whisper, he thought it was just the old library settling into the night. The building was famous for its creaking floors and dusty corners, but tonight felt different. The air was unusually still, as if the books themselves were holding their breath."},{"t":"p","text":"Leo had volunteered to help the librarian close up, even though he usually avoided staying late. However, his curiosity had grown ever since he discovered a hidden staircase behind the history section the week before. Tonight, he planned to explore it—carefully, quietly, and without drawing attention."},{"t":"p","text":"As he dusted the last shelf, the whisper returned. “Find the forgotten one…”"},{"t":"p","text":"Leo froze. “Hello?” he called, though his voice sounded small in the cavernous room."},{"t":"p","text":"Despite his racing heartbeat, he followed the sound toward the back of the library. The hidden staircase waited in the shadows. He took a deep breath and stepped down. The air grew cooler, and the walls glowed faintly with golden symbols that pulsed like slow heartbeats."},{"t":"p","text":"At the bottom, he found a circular room filled with ancient books chained to stone pedestals. One book, however, lay open on a table, its pages fluttering even though there was no breeze."},{"t":"p","text":"“You came,” a voice murmured."},{"t":"p","text":"Leo spun around. A figure made of swirling ink stood behind him, its shape shifting like smoke. “Who… what are you?” Leo whispered."},{"t":"p","text":"“I am the Echo,” it replied. “A memory of every story ever forgotten.”"},{"t":"p","text":"Although Leo wanted to run, something about the Echo felt familiar—almost comforting. The creature gestured to the open book. “This story is fading. If no one reads it, it will disappear forever.”"},{"t":"p","text":"Leo stepped closer. The book told the tale of a young inventor who built a machine to capture dreams. The illustrations shimmered with colour, as if alive."},{"t":"p","text":"“What do I have to do?” Leo asked."},{"t":"p","text":"“Read,” the Echo said simply."},{"t":"p","text":"So Leo read—slowly at first, then with growing confidence. As he spoke the final line, the room brightened. The chains around the other books loosened, and the Echo’s form steadied."},{"t":"p","text":"“You have saved it,” the Echo said. “And now you understand: stories live only when someone cares enough to remember them.”"},{"t":"p","text":"Before Leo could respond, the room dissolved into swirling light. He found himself back in the library, the staircase gone, the shelves silent."},{"t":"p","text":"But the open book lay on the table beside him."},{"t":"p","text":"Leo smiled. He knew he would return tomorrow—because some stories deserved to be remembered."}],"title":"The Echo in the Library"},"traits":[{"key":"ideas","goal":"A clear, focused main idea with rich development and depth.","starters":[{"k":"s","text":"My story explores ________ and shows that ________."},{"k":"s","text":"The central conflict is ________, which matters because ________."},{"k":"s","text":"A key turning point occurs when ________."},{"k":"s","text":"This detail adds depth because ________."},{"k":"s","text":"I want the reader to understand that ________."}],"checks":["My idea is clear, focused, and developed with depth.","I added rich, relevant supporting details.","My story is clearly written to entertain."]},{"key":"organization","goal":"Controlled paragraphs, effective pacing, and purposeful stylistic devices.","starters":[{"k":"l","label":"Beginning","opts":["Although everything seemed normal…","On an ordinary afternoon…"]},{"k":"l","label":"Rising Action","opts":["Meanwhile…","Despite this…","As tension increased…"]},{"k":"l","label":"Climax","opts":["At that moment…","Suddenly…"]},{"k":"l","label":"Resolution","opts":["In the end…","After everything that happened…"]},{"k":"g","label":"Dialogue (new speaker, new line)","items":["“________,” she said.","On a new line: “________!”","The character replied, “________.”"]}],"checks":["I used structured, indented paragraphs.","My pacing is controlled and intentional.","I used stylistic devices (foreshadowing, layout, hooks) to guide the reader."]},{"key":"voice","goal":"A consistent, engaging narrative voice with a clearly maintained perspective.","starters":[{"k":"s","text":"My narrator’s voice sounds ________ (curious, reflective, uncertain)."},{"k":"s","text":"This moment reveals the character’s perspective because ________."},{"k":"s","text":"I want the reader to sense ________ during this scene."},{"k":"s","text":"I chose this detail because it shows ________."}],"checks":["My voice is consistent and engaging.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary and effective figurative language.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase that builds atmosphere is ________."},{"k":"s","text":"This simile/metaphor/personification adds meaning because ________."},{"k":"s","text":"This word choice creates emotion because ________."}],"checks":["I used rich, precise vocabulary.","I used figurative language effectively.","My words create mood, atmosphere, and emotion."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Because…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas to set off phrases","items":["The room, glowing faintly, felt alive."]},{"k":"g","label":"I used apostrophes for possession","items":["the Echo’s voice"]},{"k":"g","label":"I used perfect tense when needed","items":["He had discovered the staircase."]},{"k":"g","label":"I used active/passive forms accurately","items":["The book was lifted by an unseen force."]},{"k":"g","label":"I used semicolons or dashes when appropriate","items":["He hesitated—just for a moment—before stepping inside."]}],"checks":["Grammar is accurate and varied.","Punctuation is controlled and purposeful.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my narrative should look like","items":["Title","5–7 structured paragraphs","Clear beginning, rising action, climax, resolution","Dialogue correctly paragraphed","Stylistic devices (foreshadowing, imagery, layout)"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Hook + character + setting + hint of conflict","Paragraph 2–3: Rising action with complications","Paragraph 4: Climax","Paragraph 5: Resolution","Paragraph 6–7 (optional): Reflection or twist"]},{"title":"Grade 5 writing moves to try","items":["Use figurative language (simile, metaphor, personification)","Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (echoed, shimmered, hesitated)","Use symbolism (objects that represent ideas)"]}],"challenge":["Add a symbolic object (like the Echo’s book)","Add a subplot or secondary conflict","Use purposeful passive voice","Use semicolons or dashes for effect","Add a thematic message"]},{"id":"g5-letter","grade":5,"genre":"Letter Writing","kind":"letter","example":{"blocks":[{"t":"p","text":"I hope you are doing well. I am writing to share the results of our class’s “Community Changemakers Project” because your lessons on leadership inspired many of the choices we made."},{"t":"p","text":"To begin with, our group focused on improving the school’s recycling system. Although recycling bins already existed, we noticed that students often threw trash into the wrong containers. As a result, much of the recyclable material was being wasted. To understand the problem better, we conducted a week-long audit and discovered that nearly half of the items in the recycling bins were contaminated with food or plastic wrappers."},{"t":"p","text":"After gathering this information, we designed a plan to make recycling clearer and more effective. We created colour-coded posters, added simple illustrations, and placed them above each bin. Meanwhile, we worked with the student council to introduce a short announcement during morning homeroom. Surprisingly, after only three days, the amount of contamination dropped significantly. Students told us the posters made the system easier to understand."},{"t":"p","text":"This project taught me more than just environmental responsibility. I learned how powerful teamwork can be when everyone contributes their strengths. I also realized that leadership isn’t always about being in charge—it’s about noticing a problem and taking action, even when the solution seems small. Thank you for encouraging us to think like leaders and to believe that our ideas can make a difference."}],"greeting":"Dear Mr. Thompson,","closing":"Sincerely,","name":"Maya"},"traits":[{"key":"ideas","goal":"A clear, focused purpose with rich development and depth.","starters":[{"k":"s","text":"I am writing to ________ because ________."},{"k":"s","text":"One significant detail I want to share is ________."},{"k":"s","text":"This matters because ________."},{"k":"s","text":"Another key point is ________."},{"k":"s","text":"This example adds depth because ________."}],"checks":["My purpose is clear and focused.","I added rich, relevant supporting details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, effective transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Opening","opts":["I hope you are doing well. I am writing to…"]},{"k":"l","label":"Body Paragraph 1","opts":["To begin with…","Although…","At first…"]},{"k":"l","label":"Body Paragraph 2","opts":["Meanwhile…","In addition…","Despite this…"]},{"k":"l","label":"Closing","opts":["In the end…","This experience taught me…","Thank you for…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically sequenced.","I used transitions like meanwhile, nevertheless, despite, in addition.","I used stylistic devices (hooks, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A consistent, appropriate tone with a clearly maintained perspective.","starters":[{"k":"s","text":"I felt ________ when ________."},{"k":"s","text":"This detail shows my perspective because ________."},{"k":"s","text":"My tone is ________ (respectful, reflective, appreciative)."},{"k":"s","text":"I want the reader to understand that ________."}],"checks":["My voice is consistent and personal.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary and effective figurative language.","starters":[{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This figurative language adds meaning because ________."},{"k":"s","text":"This word choice creates emotion because ________."}],"checks":["I used rich, precise vocabulary.","I used figurative language effectively.","My words create mood, clarity, and emotion."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Because…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas to set off phrases","items":["The posters, bright and clear, helped students sort their waste."]},{"k":"g","label":"I used apostrophes for possession","items":["the project’s impact"]},{"k":"g","label":"I used perfect tense when needed","items":["We had collected enough data to see a pattern."]},{"k":"g","label":"I used active/passive forms accurately","items":["The bins were reorganized by our group."]},{"k":"g","label":"I used semicolons or dashes when appropriate","items":["We were nervous at first; however, the results surprised us."]}],"checks":["Grammar is accurate and varied.","Punctuation is controlled and purposeful.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my letter should look like","items":["Date (optional)","Greeting","3–5 structured paragraphs","Clear purpose","Detailed body","Polite closing and signature"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Purpose + context","Paragraph 2: First main detail","Paragraph 3: Second main detail","Paragraph 4: Reflection or closing"]},{"title":"Grade 5 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (investigated, collaborated, implemented)","Use figurative language when appropriate","Use stylistic devices (hooks, emphasis, layout)"]}],"challenge":["Add a short anecdote or mini-story","Add a comparison (“It reminded me of…”)","Add a rhetorical question","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g5-info","grade":5,"genre":"Informational Text","kind":"info","example":{"blocks":[{"t":"p","text":"Earthquakes are powerful natural events that occur when the Earth’s crust suddenly shifts, releasing energy that travels through the ground. Although earthquakes can feel unpredictable, scientists have discovered clear patterns in how and why they happen. Understanding these patterns helps communities prepare for emergencies and reduce damage."},{"t":"p","text":"To begin with, earthquakes are caused by the movement of tectonic plates. These massive slabs of rock fit together like a giant jigsaw puzzle beneath the Earth’s surface. However, the plates do not move smoothly. Instead, they grind, collide, or slide past one another. When pressure builds up along the boundaries—called faults—it is eventually released as seismic waves. These waves shake the ground, sometimes gently and sometimes with destructive force."},{"t":"p","text":"The strength of an earthquake depends on several factors. Scientists measure magnitude using the Moment Magnitude Scale, which calculates how much energy is released. Meanwhile, the intensity of shaking in a specific location depends on the depth of the earthquake, the type of ground, and the distance from the epicenter. For example, soft soil can amplify shaking, while solid rock can reduce it. Therefore, two places experiencing the same earthquake may feel it very differently."},{"t":"p","text":"Earthquakes can cause a wide range of effects. Buildings may crack or collapse, roads can split open, and landslides may occur in mountainous areas. In coastal regions, underwater earthquakes can trigger tsunamis—massive waves that travel across the ocean. Despite these dangers, engineers have developed earthquake-resistant structures, such as flexible foundations and shock absorbers, to help protect communities."},{"t":"p","text":"Although earthquakes cannot be prevented, preparation can save lives. Scientists use seismographs to monitor ground movement and identify patterns. Communities practise emergency drills, create evacuation plans, and secure heavy furniture to prevent injuries. By understanding the science behind earthquakes, people can respond more safely when the ground begins to shake."},{"t":"p","text":"Earthquakes remind us that the Earth is constantly changing. With knowledge and preparation, we can reduce risks and protect the places we call home."}],"title":"The Science Behind Earthquakes"},"traits":[{"key":"ideas","goal":"A clear, focused topic with rich development and depth.","starters":[{"k":"s","text":"My topic is ________, and it is important because ________."},{"k":"s","text":"One key idea readers must understand is ________."},{"k":"s","text":"This detail adds depth because ________."},{"k":"s","text":"Another significant fact is ________."},{"k":"s","text":"This information helps explain ________."}],"checks":["My main idea is clear and focused.","I added rich, accurate supporting details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, effective transitions, and purposeful organizational devices.","starters":[{"k":"l","label":"Introduction","opts":["________ are…","This text will explain…"]},{"k":"g","label":"Body Paragraphs","items":["To begin with…","Meanwhile…","In addition…","Despite this…","As a result…"]},{"k":"l","label":"Conclusion","opts":["In conclusion…","This matters because…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically grouped.","I used transitions like nevertheless, despite, meanwhile, in addition.","I used stylistic devices (headings, hooks, emphasis) to guide the reader."]},{"key":"voice","goal":"A consistent, knowledgeable, informative tone with a clearly maintained perspective.","starters":[{"k":"s","text":"Scientists have discovered that ________."},{"k":"s","text":"You might be surprised to learn that ________."},{"k":"s","text":"It is important to understand that ________."},{"k":"s","text":"This detail shows ________ because ________."}],"checks":["My tone is informative and appropriate.","My perspective is clearly maintained.","I took creative risks with voice when appropriate."]},{"key":"word choice","goal":"Rich, precise vocabulary and effective figurative language when appropriate.","starters":[{"k":"s","text":"A topic-specific word I used is ________, which means ________."},{"k":"s","text":"A vivid verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This figurative language adds meaning because ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and academic vocabulary.","I used figurative language effectively when appropriate.","My words add clarity, depth, and emotion."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas to set off phrases","items":["The plates, massive and slow-moving, shape the Earth’s surface."]},{"k":"g","label":"I used apostrophes for possession","items":["the Earth’s crust"]},{"k":"g","label":"I used perfect tense when needed","items":["Scientists have recorded thousands of earthquakes each year."]},{"k":"g","label":"I used active/passive forms accurately","items":["The waves were detected by seismographs."]},{"k":"g","label":"I used semicolons or dashes when appropriate","items":["Earthquakes can be frightening; however, preparation saves lives."]}],"checks":["Grammar is accurate and varied.","Punctuation is controlled and purposeful.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my informational text should look like","items":["Title","5–7 structured paragraphs","Clear introduction","Grouped facts in logical sections","Conclusion that wraps up the topic"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the topic","Paragraph 2: First main idea","Paragraph 3: Second main idea","Paragraph 4: Third main idea or problem/solution","Paragraph 5: Conclusion","Paragraph 6–7 (optional): Additional insight or example"]},{"title":"Grade 5 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use topic-specific academic vocabulary","Use complex sentences","Use figurative language when appropriate","Use stylistic devices (headings, hooks, emphasis)"]}],"challenge":["Add a comparison (“Earthquakes are similar to…”)","Add a cause-and-effect explanation","Add a labelled diagram or glossary","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g5-howto","grade":5,"genre":"Procedural Writing","kind":"howto","example":{"blocks":[{"t":"p","text":"Designing a mini-parachute is an exciting way to explore air resistance and engineering principles. Although the materials are simple, the success of your parachute depends on careful construction and thoughtful testing."},{"t":"h","text":"Materials"},{"t":"ul","items":["A plastic bag or light fabric","Scissors","Four pieces of string (equal length)","Tape","A small object (toy figure, paper clip, or eraser)","A ruler","A stopwatch (optional)"]},{"t":"h","text":"Steps"},{"t":"ol","items":["First, create the canopy. Cut a square from the plastic bag or fabric, measuring approximately 20 cm on each side. A larger canopy increases air resistance, so ensure the shape is even.","Next, attach the strings. Tape one end of each string securely to the four corners of the canopy. Meanwhile, check that all strings are the same length; uneven strings can cause the parachute to tilt during descent.","After that, connect the load. Tie the loose ends of the strings together and attach them to your small object. Make sure the knot is tight so the object does not detach midair.","Then, prepare for testing. Stand on a chair or balcony (with adult permission) and hold the parachute by the canopy. Release it gently, allowing the air to fill the canopy.","Finally, observe and adjust. Watch how the parachute falls. If it drops too quickly, increase the canopy size. If it spins, adjust the string lengths. As a final step, record your results and repeat the test to improve accuracy."]},{"t":"h","text":"Helpful Tip"},{"t":"p","text":"For more accurate results, drop the parachute from the same height each time and use a stopwatch to measure descent speed."}],"title":"How to Build a Working Mini-Parachute"},"traits":[{"key":"ideas","goal":"A clear, focused procedure with rich development and depth.","starters":[{"k":"s","text":"This procedure explains how to ________ and why it is useful."},{"k":"s","text":"One essential step is ________ because ________."},{"k":"s","text":"Another important detail readers must understand is ________."},{"k":"s","text":"This explanation adds depth because ________."},{"k":"s","text":"The purpose of this process is to ________."}],"checks":["My purpose is clear and focused.","I added rich, accurate supporting details.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, effective transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Introduction","opts":["Today I will explain how to…"]},{"k":"l","label":"Materials","opts":["You will need…"]},{"k":"g","label":"Steps","items":["To begin with…","Meanwhile…","Despite this…","As a final step…"]},{"k":"l","label":"Conclusion","opts":["This process shows that…","Now you can…"]}],"checks":["I used structured, indented paragraphs.","My steps are in logical order.","I used transitions like nevertheless, despite, meanwhile, in addition.","I used stylistic devices (headings, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A confident, helpful, consistent tone with a clearly maintained perspective.","starters":[{"k":"s","text":"Be careful when you ________."},{"k":"s","text":"It is helpful to ________."},{"k":"s","text":"You might notice that ________."},{"k":"s","text":"This step is important because ________."},{"k":"s","text":"I want the reader to feel confident about ________."}],"checks":["My tone is helpful and appropriate.","My perspective is clearly maintained.","I took creative risks with voice when appropriate."]},{"key":"word choice","goal":"Rich, precise vocabulary and effective figurative language when appropriate.","starters":[{"k":"s","text":"A precise verb I used is ________."},{"k":"s","text":"A descriptive phrase I added is ________."},{"k":"s","text":"This word choice creates clarity because ________."},{"k":"s","text":"This figurative language adds meaning because ________."}],"checks":["I used specific nouns, strong verbs, precise adjectives, and topic vocabulary.","I used figurative language effectively when appropriate.","My vocabulary adds depth and clarity."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","While…","Because…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas to set off phrases","items":["The canopy, light and flexible, caught the air easily."]},{"k":"g","label":"I used apostrophes for possession","items":["the parachute’s strings"]},{"k":"g","label":"I used perfect tense when needed","items":["Engineers have tested many parachute designs."]},{"k":"g","label":"I used active/passive forms accurately","items":["The strings were attached securely."]},{"k":"g","label":"I used semicolons or dashes when appropriate","items":["The parachute fell slowly; however, it tilted slightly."]}],"checks":["Grammar is accurate and varied.","Punctuation is controlled and purposeful.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my procedural text should look like","items":["Title","Introduction paragraph","Materials list","Numbered steps","Conclusion or tip section"]},{"title":"What goes in each paragraph","items":["Paragraph 1: Introduce the purpose","Paragraph 2: Materials","Paragraph 3: Steps","Paragraph 4: Conclusion or helpful tip"]},{"title":"Grade 5 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (secure, adjust, construct, evaluate)","Use topic-specific vocabulary","Use stylistic devices (headings, bold words, layout)"]}],"challenge":["Add a scientific explanation (“Why this works”)","Add a troubleshooting section","Add a labelled diagram","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g5-persuade","grade":5,"genre":"Persuasive Writing","kind":"persuade","example":{"blocks":[{"t":"p","text":"I strongly believe every school should have a Student Innovation Lab because it encourages creativity, strengthens problem-solving skills, and prepares students for the future. Although classrooms already provide opportunities to learn, an Innovation Lab offers a unique space where students can design, experiment, and build ideas that matter to them."},{"t":"p","text":"To begin with, an Innovation Lab inspires creativity in ways traditional lessons cannot. When students have access to tools like simple robotics kits, recycled materials, and digital design apps, they can transform their ideas into real prototypes. Meanwhile, the freedom to experiment—without worrying about grades—helps students take risks and explore new possibilities. Creativity grows when students feel safe to try, fail, and try again."},{"t":"p","text":"Another important reason is that Innovation Labs strengthen problem-solving skills. In these spaces, students often work on real-world challenges, such as reducing waste or improving playground safety. As a result, they learn to test solutions, gather feedback, and revise their des
