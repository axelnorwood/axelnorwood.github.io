igns. This process mirrors the way engineers and scientists work, giving students valuable experience that goes beyond textbooks."},{"t":"p","text":"Finally, Innovation Labs prepare students for the future. Technology is changing rapidly, and students need opportunities to practise collaboration, communication, and critical thinking. By working together on meaningful projects, students develop confidence and independence. These skills will help them succeed not only in school but also in future careers."},{"t":"p","text":"For these reasons, I strongly believe every school should create a Student Innovation Lab. It would inspire creativity, strengthen problem-solving skills, and help students build a brighter future."}],"title":"Why Every School Should Have a Student Innovation Lab"},"traits":[{"key":"ideas","goal":"A clear, focused opinion with rich development and depth.","starters":[{"k":"s","text":"I strongly believe ________ because ________."},{"k":"s","text":"My opinion is ________, and it matters because ________."},{"k":"s","text":"One significant reason is ________."},{"k":"s","text":"Another key point is ________."},{"k":"s","text":"This example adds depth because ________."}],"checks":["My opinion is clear and focused.","I added rich, relevant reasons.","My writing stays linked to the task."]},{"key":"organization","goal":"Structured paragraphs, effective transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Introduction","opts":["I believe…","In my opinion…"]},{"k":"g","label":"Reason Paragraphs","items":["To begin with…","Meanwhile…","Despite this…","As a result…"]},{"k":"l","label":"Conclusion","opts":["For these reasons…","This is why…"]}],"checks":["I used structured, indented paragraphs.","My reasons are in logical order.","I used transitions like nevertheless, despite, meanwhile, in addition.","I used stylistic devices (hooks, emphasis, layout) to guide the reader."]},{"key":"voice","goal":"A confident, consistent persuasive voice with a clearly maintained perspective.","starters":[{"k":"s","text":"I want the reader to understand that ________."},{"k":"s","text":"This detail shows my perspective because ________."},{"k":"s","text":"My tone is ________ (confident, respectful, passionate)."},{"k":"s","text":"I chose this example because ________."}],"checks":["My voice is confident and consistent.","My perspective is clearly maintained.","I took creative risks with voice or tone."]},{"key":"word choice","goal":"Rich, precise vocabulary and effective figurative language.","starters":[{"k":"s","text":"A strong verb I used is ________."},{"k":"s","text":"A persuasive phrase I added is ________."},{"k":"s","text":"This figurative language adds meaning because ________."},{"k":"s","text":"This word choice creates emotion because ________."}],"checks":["I used specific nouns, strong verbs, and precise adjectives.","I used figurative language effectively.","My words help convince the reader."]},{"key":"sentence fluency","goal":"Rhythmic, flowing sentences with varied structures.","starters":[{"k":"g","label":"I can start sentences with","items":["Although…","Because…","While…","As a result…","Despite this…"]},{"k":"s","text":"I can use conjunctions like although, however, while, therefore, despite."}],"checks":["I used simple, compound, and complex sentences.","My writing flows smoothly when read aloud.","Some sentences have rhythm and flow."]},{"key":"conventions","goal":"","starters":[{"k":"g","label":"I used commas to set off phrases","items":["The lab, filled with tools and ideas, inspired everyone."]},{"k":"g","label":"I used apostrophes for possession","items":["the project’s success"]},{"k":"g","label":"I used perfect tense when needed","items":["Students have created impressive prototypes."]},{"k":"g","label":"I used active/passive forms accurately","items":["The posters were displayed around the school."]},{"k":"g","label":"I used semicolons or dashes when appropriate","items":["Innovation takes courage; however, it also takes patience."]}],"checks":["Grammar is accurate and varied.","Punctuation is controlled and purposeful.","Spelling of complex patterns is accurate."]}],"page":[{"title":"What my persuasive text should look like","items":["Title","4–6 structured paragraphs","Clear opinion","Strong reasons with depth","Conclusion that restates and strengthens the opinion"]},{"title":"What goes in each paragraph","items":["Paragraph 1: State opinion clearly","Paragraph 2: First reason + development","Paragraph 3: Second reason + development","Paragraph 4: Third reason or community impact","Paragraph 5: Conclusion"]},{"title":"Grade 5 writing moves to try","items":["Use challenging transitions (nevertheless, despite, meanwhile)","Use complex sentences","Use precise verbs (encourage, strengthen, empower)","Use loaded vocabulary (essential, transformative, meaningful)","Use examples, comparisons, and explanations"]}],"challenge":["Add a counterargument (“Some people think…, however…”)","Add a real-world example","Add a rhetorical question","Use perfect tense accurately","Use purposeful passive voice"]},{"id":"g5-journal","grade":5,"genre":"Journal","kind":"journal","example":{"blocks":[{"t":"p","text":"Today turned out to be far more meaningful than I expected, even though it began like any ordinary Thursday. In the morning, our class visited the science lab to begin our “Ecosystems in a Jar” project. At first, I felt unsure about how to design a balanced ecosystem. Although I had read the instructions carefully, the idea of creating a tiny world that could survive on its own felt overwhelming."},{"t":"p","text":"As we started gathering materials, something shifted. My group discussed which plants would work best and how much water the soil needed. Meanwhile, I noticed how each person contributed a different strength—one classmate measured precisely, another sketched a layout, and I focused on arranging the layers of soil, gravel, and moss. As a result, our jar slowly transformed from a pile of materials into a miniature forest floor. Watching the condensation form on the glass felt strangely satisfying, like the ecosystem was already beginning to breathe."},{"t":"p","text":"The most memorable moment happened during cleanup. Our teacher dimmed the lights and asked us to place our jars on the windowsill. The sunlight hit the glass at just the right angle, and for a moment, the jars glowed. It reminded me that even small creations can feel powerful when you’ve put genuine effort into them."},{"t":"p","text":"At the end of the day, I realized how much I enjoy hands-on learning. This project taught me that patience and careful observation matter just as much as creativity. I also learned that working with others can make a task feel less intimidating and far more rewarding. I hope we get to check on our ecosystems again soon because I want to see how they change over time."}],"date":"November 3"},"traits":[{"key":"ideas","goal":"A clear, focused event with rich development and depth.","starters":[{"k":"s","text":"Today I experienced ________, which was meaningful because ________."},{"k":"s","text":"One significant moment was when ________."},{"k":"s","text":"This mattered to me because ________."},{"k":"s","text":"Another detail that stood out was ________."},{"k":"s","text":"I learned that ________."}],"checks":["My main idea is clear and focused.","I added rich, relevant details.","I stayed linked to the task."]},{"key":"organization","goal":"Controlled paragraphs, effective transitions, and purposeful stylistic devices.","starters":[{"k":"l","label":"Beginning","opts":["Although the day started normally…","At the start of the lesson…"]},{"k":"l","label":"Middle","opts":["Meanwhile…","Despite this…","As the activity continued…"]},{"k":"l","label":"End","opts":["In the end…","I realized…","This experience taught me…"]}],"checks":["I used structured, indented paragraphs.","My ideas are logically sequenced.","I us rade":4,"points":[{"name":"Nouns","secs":[{"kind":"means","title":"What it means","paras":["A noun names a person, place, thing, animal, or idea."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Common: mountain, student, river","Proper: Australia, Wednesday, Mr. Patel","Abstract: bravery, honesty, excitement","Collective: audience, crew, flock"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing informational reports","Describing characters and settings","Using abstract nouns to show feelings or themes"]}]},{"name":"Pronouns","secs":[{"kind":"means","title":"What it means","paras":["Pronouns replace nouns to avoid repetition."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Subject: he, she, they","Object: him, her, them","Possessive: his, her, their","Reflexive: myself, herself, themselves"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing dialogue","Maintaining perspective in narratives","Showing ownership clearly"]}]},{"name":"Verbs","secs":[{"kind":"means","title":"What it means","paras":["Verbs show action or state of being."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Action: explore, whisper, design","Being: am, is, are, was, were","Helping: will, can, might, should","Linking: become, seem, appear"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing stronger narrative action","Using helping verbs to show possibility or intention","Using linking verbs to describe states (“She became nervous.”)"]}]},{"name":"Tenses","secs":[{"kind":"means","title":"What it means","paras":["Verbs change to show time."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Past: climbed, wrote, saw","Present: climb, write, see","Future: will climb, will write","Present perfect: have seen, has finished"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Keeping tense consistent in stories","Writing reflections (“I have learned…”)","Writing procedural steps"]}]},{"name":"Irregular Verbs (expanded set)","secs":[{"kind":"means","title":"What it means","paras":["These verbs don’t follow the “-ed” rule."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["swim → swam","break → broke","choose → chose","write → wrote"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Narrative writing","Editing for correct tense","Reading comprehension"]}]},{"name":"Adjectives","secs":[{"kind":"means","title":"What it means","paras":["Adjectives describe nouns. Grade 4 adds comparison."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Expanded: the tall, ancient stone tower","Comparative: taller, braver, more careful","Superlative: tallest, bravest, most careful"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Describing settings and characters","Comparing ideas in informational writing","Improving sentence detail"]}]},{"name":"Adverbs","secs":[{"kind":"means","title":"What it means","paras":["Adverbs describe verbs, adjectives, or other adverbs."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["quickly","silently","yesterday","nearby","almost","very"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Adding detail to actions","Writing procedural steps","Improving sentence fluency"]}]},{"name":"Prepositions","secs":[{"kind":"means","title":"What it means","paras":["Prepositions show where, when, or how something happens."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["beneath","beyond","during","throughout","beside"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Describing settings","Giving directions","Writing informational text"]}]},{"name":"Conjunctions","secs":[{"kind":"means","title":"What it means","paras":["Conjunctions join ideas.","Coordinating: and, but, or, so, yet","Subordinating: although, since, unless, whenever, because","Correlative (intro): either/or, neither/nor"],"chips":[],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing complex sentences","Adding reasons and contrasts","Improving transitions"]}]},{"name":"Simple, Compound, and Complex Sentences","secs":[{"kind":"means","title":"What it means","paras":[],"chips":[],"items":["Simple: one idea","Compound: two ideas joined with and/but/so/yet","Complex: one main idea + one extra idea (using because/although/when)"]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Simple: The lantern glowed.","Compound: The lantern glowed, and the room brightened.","Complex: The lantern glowed because Leo touched it."]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Improving sentence fluency","Adding depth to narratives and reports"]}]},{"name":"Dialogue (quotation marks, commas, paragraphing)","secs":[{"kind":"means","title":"What it means","paras":["Dialogue shows what someone says."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["“Let’s explore,” whispered Lena.","“I’m not sure,” he replied, “but we can try.”"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Narrative writing","Separating dialogue into new lines","Using commas correctly with speech"]}]},{"name":"Capitalization Rules (expanded)","secs":[{"kind":"list","title":"Use a capital letter for","paras":[],"chips":[],"items":["Start of sentences","Names","Days, months, holidays","Places","Titles of books, movies, and stories","Proper adjectives (Japanese food, French artist)"]}]},{"name":"Punctuation (more advanced set)","secs":[{"kind":"list","title":"Marks to know","paras":[],"chips":[],"items":["Periods","Question marks","Exclamation marks","Commas in a list","Commas after transitions (“After that, we continued.”)","Commas in dialogue","Apostrophes for possession","Apostrophes in contractions"]}]},{"name":"Apostrophes (contractions + singular/plural possession)","secs":[{"kind":"means","title":"What it means","paras":["Apostrophes show missing letters or ownership."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Contractions: don’t, won’t, I’ll","Singular possession: the fox’s tail","Plural possession: the students’ desks"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing dialogue","Showing ownership in stories and reports"]}]},{"name":"Subject–Verb Agreement (more complex)","secs":[{"kind":"means","title":"What it means","paras":["The subject and verb must match in number."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["The team is ready.","The players are excited."],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Editing writing","Writing present-tense informational text"]}]},{"name":"Paragraphing (clear structure)","secs":[{"kind":"means","title":"What it means","paras":["A paragraph groups related ideas."],"chips":[],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Beginning/middle/end in narratives","Topic sentences in informational writing","Separating dialogue and events"]}]},{"name":"Transition Words (narrative + informational)","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Narrative: suddenly, meanwhile, later, eventually","Informational: for example, in addition, however, therefore"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Improving flow","Connecting ideas"]}]}]},{"grade":5,"points":[{"name":"Nouns","secs":[{"kind":"means","title":"What it means","paras":["A noun names a person, place, thing, animal, or idea. Grade 5 uses more abstract and collective nouns and introduces proper adjectives."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Abstract: determination, curiosity, freedom","Collective: committee, swarm, orchestra","Proper adjectives: Japanese food, Egyptian pyramid"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Adding theme and emotion to narratives","Writing formal informational reports","Using precise vocabulary in persuasive writing"]}]},{"name":"Pronouns","secs":[{"kind":"means","title":"What it means","paras":["Pronouns replace nouns and help avoid repetition."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Reflexive: myself, yourself, themselves","Relative: who, which, that","Possessive: mine, yours, theirs","Demonstrative: this, that, these, those"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing smoother sentences","Adding detail with relative clauses (“the book that I borrowed…”)","Maintaining perspective in narratives"]}]},{"name":"Verbs","secs":[{"kind":"means","title":"What it means","paras":["Verbs show action or state of being. Grade 5 adds modal verbs to show possibility, ability, or obligation."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Action: investigate, examine, sprint","Linking: seem, appear, become","Helping: have, has, will, might","Modal: could, should, must, might"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing persuasive arguments (“We should reduce waste.”)","Showing character motivation in narratives","Writing scientific explanations"]}]},{"name":"Perfect Tenses (present, past, future)","secs":[{"kind":"means","title":"What it means","paras":["Perfect tenses show actions that are completed or connected to another time."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Present perfect: I have finished my project.","Past perfect: She had left before the storm started.","Future perfect: They will have completed the test by noon."]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing reflections","Showing sequence in narratives","Explaining scientific processes"]}]},{"name":"Irregular Verbs (advanced set)","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":["begin → began","rise → rose","teach → taught","freeze → froze"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Editing narrative writing","Maintaining tense consistency","Reading comprehension"]}]},{"name":"Adjectives","secs":[{"kind":"means","title":"What it means","paras":["Adjectives describe nouns. Grade 5 focuses on precision."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["fragile","ancient","vibrant","cautious","more powerful","most impressive"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Creating vivid settings","Writing persuasive descriptions","Adding clarity to informational text"]}]},{"name":"Adverbs","secs":[{"kind":"means","title":"What it means","paras":["Adverbs describe verbs, adjectives, or other adverbs."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["rarely","completely","gently","eventually"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Improving sentence fluency","Adding detail to procedural steps","Showing character behaviour"]}]},{"name":"Prepositions","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":["beyond","throughout","despite","according to","within"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing formal explanations","Describing complex settings","Adding clarity to instructions"]}]},{"name":"Conjunctions","secs":[{"kind":"means","title":"What it means","paras":["Conjunctions join ideas and create complex sentences."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Coordinating: for, and, nor, but, or, yet, so","Subordinating: although, unless, whenever, since, whereas","Correlative: either/or, neither/nor, both/and"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing complex arguments","Adding contrast and cause","Improving transitions"]}]},{"name":"Complex Sentences (multi-clause)","secs":[{"kind":"means","title":"What it means","paras":["A complex sentence has a main idea and one or more extra ideas."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["Although the storm was strong, the lighthouse remained steady.","The students celebrated because they had completed their project."],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Adding depth to narratives","Explaining cause and effect"]}]},{"name":"Relative Clauses (who, which, that)","secs":[{"kind":"means","title":"What it means","paras":["A relative clause adds extra information about a noun."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["The scientist who discovered the fossil shared her findings.","The book that I borrowed was exciting."],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Adding detail to informational writing","Describing characters","Writing more mature sentences"]}]},{"name":"Dialogue (advanced punctuation + paragraphing)","secs":[{"kind":"means","title":"What it means","paras":["Dialogue shows what someone says and must be punctuated correctly."],"chips":[],"items":[]},{"kind":"examples","title":"Examples","paras":[],"chips":["“Are you sure?”","Maya asked, raising an eyebrow.","“I’m ready,” he said, “but I’m still nervous.”"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Narrative writing","Showing character emotion","Using commas, quotation marks, and paragraph breaks correctly"]}]},{"name":"Punctuation (advanced)","secs":[{"kind":"list","title":"Marks to know","paras":[],"chips":[],"items":["Commas in complex sentences","Commas to set off clauses","Apostrophes for plural possession","Quotation marks for dialogue","Colons for lists","Dashes for emphasis","Parentheses for extra information"]},{"kind":"examples","title":"Examples","paras":[],"chips":["The experiment, which took two days, was successful.","Bring the following items: goggles, gloves, and a notebook.","He hesitated—just for a moment—before answering."],"items":[]}]},{"name":"Apostrophes (singular + plural possession)","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":["the teacher’s desk (one teacher)","the teachers’ lounge (many teachers)"],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Writing reports","Editing narrative writing"]}]},{"name":"Subject–Verb Agreement (more complex)","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":["The group is ready.","The students are excited.","Neither of the answers is correct."],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Editing informational writing","Writing formal explanations"]}]},{"name":"Paragraphing (clear structure + transitions)","secs":[{"kind":"means","title":"What it means","paras":["Paragraphs group related ideas and support clarity."],"chips":[],"items":[]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Narrative: beginning, rising action, climax, resolution","Informational: topic sentence + supporting details","Persuasive: reason + explanation + example"]}]},{"name":"Transition Words (advanced)","secs":[{"kind":"examples","title":"Examples","paras":[],"chips":[],"items":["Narrative: eventually, meanwhile, suddenly, afterwards","Informational: for instance, in contrast, therefore, as a result","Persuasive: clearly, undoubtedly, furthermore, nevertheless"]},{"kind":"uses","title":"When you use it","paras":[],"chips":[],"items":["Improving flow","Strengthening arguments","Organizing explanations"]}]}]}],"notes":[{"title":"Editing strips","body":[{"t":"p","text":"Editing strips are small, focused tools students place beside their writing."},{"t":"h","text":"Examples"},{"t":"b","text":"Capital letters"},{"t":"b","text":"End punctuation"},{"t":"b","text":"Finger spaces (G1–2)"},{"t":"b","text":"Dialogue punctuation (G3–5)"},{"t":"b","text":"Paragraphing (G4–5)"},{"t":"b","text":"Strong verbs (G3–5)"},{"t":"h","text":"Why they work"},{"t":"b","text":"They reduce overwhelm."},{"t":"b","text":"They target one skill at a time."},{"t":"b","text":"They make editing visible and manageable."}]},{"title":"Reflecting with rubrics","body":[{"t":"p","text":"Rubrics help students understand expectations and track growth."},{"t":"h","text":"Best practices"},{"t":"b","text":"Use student-friendly language (“I can…” statements)."},{"t":"b","text":"Highlight one strength and one next step."},{"t":"b","text":"Let students color-code their evidence in their writing."},{"t":"b","text":"Use rubrics before, during, and after writing."},{"t":"h","text":"Grade adaptations"},{"t":"h","text":"Grade 1–2"},{"t":"b","text":"Use smiley faces, traffic lights, or 3-level rubrics."},{"t":"b","text":"Keep criteria simple: ideas, capitals, punctuation, neatness."},{"t":"h","text":"Grade 3–5"},{"t":"b","text":"Use 4-level rubrics aligned to traits: ideas, organization, voice, word choice, fluency, conventions."},{"t":"b","text":"Students write reflection sentences:"},{"t":"b","text":"“I improved by…”"},{"t":"b","text":"“Next time I will…”"}]},{"title":"Group conferencing","body":[{"t":"p","text":"Small-group conferences save time and build community."},{"t":"h","text":"How to run them"},{"t":"b","text":"Gather 3–5 students with a shared need."},{"t":"b","text":"Teach one micro-skill (e.g., adding detail, using transitions)."},{"t":"b","text":"Model with a short example."},{"t":"b","text":"Students try it immediately in their own writing."},{"t":"b","text":"Quick share-back."},{"t":"h","text":"Grade adaptations"},{"t":"b","text":"G1–2: Focus on basics (spacing, capitals, adding one more sentence)."},{"t":"b","text":"G3–5: Focus on craft (hooks, transitions, elaboration, paragraphing)."}]},{"title":"Goal setting","body":[{"t":"p","text":"Goals make writing purposeful and help students track progress."},{"t":"h","text":"Best practices"},{"t":"b","text":"Keep goals visible (goal cards, bookmarks, sticky notes)."},{"t":"b","text":"Goals should be specific and actionable."},{"t":"b","text":"Students revisit goals during conferences."},{"t":"h","text":"Examples"},{"t":"h","text":"Grade 1–2"},{"t":"b","text":"“I will use finger spaces.”"},{"t":"b","text":"“I will add one describing word.”"},{"t":"b","text":"“I will start my sentences with a capital.”"},{"t":"h","text":"Grade 3–5"},{"t":"b","text":"“I will use transitions between paragraphs.”"},{"t":"b","text":"“I will revise for clarity by adding examples.”"},{"t":"b","text":"“I will check dialogue punctuation.”"}]},{"title":"Shorthand guides","body":[{"t":"p","text":"These are quick reference tools students keep in notebooks or folders."},{"t":"h","text":"Examples"},{"t":"b","text":"COPS (Capitals, Organization, Punctuation, Spelling) — G1–3"},{"t":"b","text":"ARMS (Add, Remove, Move, Substitute) — G3–5"},{"t":"b","text":"SWAG (Start with a Grabber) — G3–5"},{"t":"b","text":"Said is Dead word lists — G2–5"},{"t":"b","text":"Transition word menus — G3–5"},{"t":"b","text":"Genre-specific checklists — all grades"},{"t":"h","text":"Why they work"},{"t":"b","text":"They reduce cognitive load."},{"t":"b","text":"They help students work independently."},{"t":"b","text":"They support consistent expectations across the year."}]},{"title":"Keeping students engaged while reflecting on feedback","body":[{"t":"p","text":"This is where the magic happens — students stay motivated and improve."},{"t":"p","text":"Strategies that work across G1–G5"},{"t":"h","text":"1. Glow & Grow"},{"t":"b","text":"Students highlight one “glow” (strength) and one “grow” (next step)."},{"t":"b","text":"Works beautifully with color-coding."},{"t":"h","text":"2. Feedback Bingo"},{"t":"b","text":"Students complete squares like:"},{"t":"b","text":"“Add a stronger verb.”"},{"t":"b","text":"“Fix a punctuation error.”"},{"t":"b","text":"“Add a detail to your ending.”"},{"t":"h","text":"3. Partner Feedback Ladders"},{"t":"b","text":"“I noticed…”"},{"t":"b","text":"“I wondered…”"},{"t":"b","text":"“Have you considered…?”"},{"t":"b","text":"“One thing you did well was…”"},{"t":"b","text":"“One thing to try next is…”"},{"t":"h","text":"4. Revision Stations"},{"t":"h","text":"Rotate through stations such as"},{"t":"b","text":"Add detail"},{"t":"b","text":"Check capitals"},{"t":"b","text":"Improve verbs"},{"t":"b","text":"Add transitions"},{"t":"b","text":"Read aloud for flow"},{"t":"h","text":"5. Timed Revision Bursts"},{"t":"b","text":"3–5 minutes per micro-skill."},{"t":"b","text":"Keeps energy high and avoids overwhelm."},{"t":"h","text":"6. Teacher-created Mentor Snippets"},{"t":"b","text":"Short, 1–2 sentence models students imitate."},{"t":"b","text":"Perfect for G1–5."},{"t":"h","text":"7. “Before & After” Portfolios"},{"t":"b","text":"Students keep drafts to see growth over time."},{"t":"b","text":"Builds pride and intrinsic motivation."}]},{"title":"Putting it all together","body":[{"t":"h","text":"A strong writing classroom has"},{"t":"b","text":"Predictable routines"},{"t":"b","text":"Visible tools"},{"t":"b","text":"Student voice and choice"},{"t":"b","text":"Clear goals"},{"t":"b","text":"Frequent reflection"},{"t":"b","text":"Scaffolded independence"},{"t":"b","text":"Joy, creativity, and celebration"}]},{"title":"What editing (revision) strips are","body":[{"t":"p","text":"Small strips of paper where students write new sentences, added details, stronger words, or revised parts. They tape or glue these strips directly onto their draft."},{"t":"p","text":"This teaches students that writing is changeable and that revision is about adding meaning, not rewriting everything."}]},{"title":"Why editing strips work","body":[{"t":"b","text":"Makes revision hands-on and fun"},{"t":"b","text":"Reduces fear of “messing up” a neat draft"},{"t":"b","text":"Helps students see growth"},{"t":"b","text":"Encourages specific, targeted improvements"},{"t":"b","text":"Supports students who struggle with rewriting long pieces"},{"t":"b","text":"Perfect for conferencing and goal-based revision"}]},{"title":"How to use editing strips, step by step","body":[{"t":"h","text":"1. Students draft normally."},{"t":"p","text":"Pencil, notebook, or printed draft."},{"t":"h","text":"2. Teacher or peer gives ONE clear revision goal."},{"t":"h","text":"Examples"},{"t":"b","text":"Add a feeling"},{"t":"b","text":"Add a detail"},{"t":"b","text":"Add a transition"},{"t":"b","text":"Add a stronger verb"},{"t":"b","text":"Add a sentence to explain why"},{"t":"b","text":"Add dialogue"},{"t":"b","text":"Add a sensory detail"},{"t":"h","text":"3. Students write the new sentence(s) on a strip."},{"t":"h","text":"Strips can be"},{"t":"b","text":"Pre-cut"},{"t":"b","text":"On colored paper"},{"t":"b","text":"On sticky notes"},{"t":"b","text":"On thin bookmark-style slips"},{"t":"h","text":"4. Students tape or glue the strip into their draft."},{"t":"h","text":"They place it"},{"t":"b","text":"Above the line"},{"t":"b","text":"In the margin"},{"t":"b","text":"Between paragraphs"},{"t":"b","text":"At the end of a section"},{"t":"h","text":"5. Students label the strip."},{"t":"h","text":"Examples"},{"t":"b","text":"“Added detail”"},{"t":"b","text":"“Stronger verb”"},{"t":"b","text":"“Feeling added”"},{"t":"b","text":"“Transition added”"},{"t":"h","text":"6. Students reflect briefly."},{"t":"h","text":"One sentence"},{"t":"b","text":"“This made my writing clearer because…”"},{"t":"b","text":"“This helped my reader understand…”"}]},{"title":"Grade-by-grade examples","body":[{"t":"h","text":"Grade 1"},{"t":"p","text":"Goal: Add simple details or labels."},{"t":"h","text":"Strip examples"},{"t":"b","text":"“I felt happy.”"},{"t":"b","text":"“The dog was big.”"},{"t":"b","text":"“We played tag.”"},{"t":"h","text":"Teacher prompts"},{"t":"b","text":"“Add one more thing you did.”"},{"t":"b","text":"“Add a describing word.”"},{"t":"b","text":"“Add how you felt.”"},{"t":"h","text":"Grade 2"},{"t":"p","text":"Goal: Add adjectives, feelings, or reasons."},{"t":"h","text":"Strip examples"},{"t":"b","text":"“I was nervous because it was my first time.”"},{"t":"b","text":"“The cake was soft and sweet.”"},{"t":"h","text":"Teacher prompts"},{"t":"b","text":"“Add a reason using because.”"},{"t":"b","text":"“Add a describing phrase.”"},{"t":"b","text":"“Add what happened next.”"},{"t":"h","text":"Grade 3"},{"t":"p","text":"Goal: Add elaboration, dialogue, or sensory detail."},{"t":"h","text":"Strip examples"},{"t":"b","text":"“My hands were shaking as I opened the box.”"},{"t":"b","text":"“’Come on!’ my brother shouted.”"},{"t":"h","text":"Teacher prompts"},{"t":"b","text":"“Add a sentence that shows, not tells.”"},{"t":"b","text":"“Add dialogue.”"},{"t":"b","text":"“Add a sensory detail.”"},{"t":"h","text":"Grade 4"},{"t":"p","text":"Goal: Add transitions, examples, or figurative language."},{"t":"h","text":"Strip examples"},{"t":"b","text":"“For example, our group tested three different designs.”"},{"t":"b","text":"“The wind howled like a wolf.”"},{"t":"h","text":"Teacher prompts"},{"t":"b","text":"“Add a transition to connect your ideas.”"},{"t":"b","text":"“Add an example to support your point.”"},{"t":"b","text":"“Add a simile or metaphor.”"},{"t":"h","text":"Grade 5"},{"t":"p","text":"Goal: Add depth, explanation, or complex sentences."},{"t":"h","text":"Strip examples"},{"t":"b","text":"“This experience taught me that leadership can be quiet but powerful.”"},{"t":"b","text":"“Although I was unsure at first, I decided to try again.”"},{"t":"h","text":"Teacher prompts"},{"t":"b","text":"“Add a reflection sentence.”"},{"t":"b","text":"“Add a complex sentence using although or despite.”"},{"t":"b","text":"“Add a sentence that explains why this matters.”"}]},{"title":"Types of editing strips","body":[{"t":"h","text":"1. Detail Strips"},{"t":"p","text":"Add a describing word or phrase."},{"t":"h","text":"2. Dialogue Strips"},{"t":"p","text":"Add a line of speech."},{"t":"h","text":"3. Feeling Strips"},{"t":"p","text":"Add emotion or internal thinking."},{"t":"h","text":"4. Transition Strips"},{"t":"p","text":"Add words like meanwhile, suddenly, later, however."},{"t":"h","text":"5. Example Strips"},{"t":"p","text":"Add evidence or explanation."},{"t":"h","text":"6. Sensory Strips"},{"t":"p","text":"Add what you saw, heard, felt, smelled, tasted."},{"t":"h","text":"7. Reflection Strips"},{"t":"p","text":"Add what you learned or realized."},{"t":"h","text":"8. Strong Verb Strips"},{"t":"p","text":"Replace weak verbs with vivid ones."}]},{"title":"Engagement tricks that work","body":[{"t":"b","text":"Use colored strips for different revision types"},{"t":"b","text":"Yellow = details"},{"t":"b","text":"Blue = dialogue"},{"t":"b","text":"Green = transitions"},{"t":"b","text":"Pink = feelings"},{"t":"b","text":"Let students decorate their strips"},{"t":"b","text":"Use “Revision Scissors” (special scissors only for editing)"},{"t":"b","text":"Have a Revision Station with strips, tape, and pens"},{"t":"b","text":"Celebrate “Before & After” pages"}]}]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var view = document.getElementById('view');

  /* ---------- words for kids ---------- */
  var KINDS = {
    story:    { ico: '📖', name: 'Story',            blurb: 'Make up a story with a problem and a happy fix.', why: 'A story is written to entertain your reader.' },
    letter:   { ico: '💌', name: 'Letter',           blurb: 'Write to someone and tell them your news.',       why: 'A letter is written to one person. Think about who will read it.' },
    info:     { ico: '📘', name: 'Information text', blurb: 'Teach your reader true facts about a topic.',     why: 'An information text is written to teach.' },
    howto:    { ico: '🛠️', name: 'How-to',           blurb: 'Explain how to make or do something, step by step.', why: 'A how-to helps your reader make or do something.' },
    persuade: { ico: '📣', name: 'Persuasive',       blurb: 'Give your opinion and try to change minds.',      why: 'Persuasive writing tries to get your reader to agree with you.' },
    journal:  { ico: '📔', name: 'Journal',          blurb: 'Write about your day and how you felt.',          why: 'A journal is about your own day, thoughts and feelings.' }
  };
  var TRAITS = {
    'ideas':            { ico: '💡', name: 'Ideas',            q: 'What is my writing about?' },
    'organization':     { ico: '🧱', name: 'Organization',     q: 'Is everything in a good order?' },
    'voice':            { ico: '🎤', name: 'Voice',            q: 'Does it sound like me?' },
    'word choice':      { ico: '🎨', name: 'Word choice',      q: 'Did I pick great words?' },
    'sentence fluency': { ico: '🌊', name: 'Sentence fluency', q: 'Do my sentences sound smooth?' },
    'conventions':      { ico: '🔍', name: 'Conventions',      q: 'Did I check capitals, punctuation and spelling?' }
  };
  var TABS = [['example', 'Read an example'], ['page', 'Plan my page'], ['starters', 'Sentence starters'], ['check', 'Check my work'], ['challenge', 'Challenge']];

  /* Tricky words. Tap one anywhere in the helper to see what it means. */
  var GLOSSARY = {
    'adjective': ['A describing word.', 'the shiny button, a tiny sprout'],
    'adverb': ['A word that tells how, when or where something happens.', 'She ran quickly. We left later.'],
    'adverbial phrase': ['A few words that tell how, when or where.', 'with careful steps, in the dim light'],
    'noun': ['A naming word for a person, place, animal or thing.', 'teacher, park, dog, pencil'],
    'proper noun': ['The special name of a person, place or day. It starts with a capital letter.', 'Mia, Tokyo, Monday'],
    'pronoun': ['A small word that takes the place of a noun.', 'I, he, she, it, we, they'],
    'verb': ['A doing or being word.', 'jump, whisper, is'],
    'strong verb': ['An action word that paints a clear picture.', 'raced is stronger than went'],
    'imperative verb': ['A bossy verb. It tells the reader what to do.', 'Mix, pour, fold, cut'],
    'tense': ['Tense tells when something happens: past, present or future.', 'I played. I play. I will play.'],
    'perfect tense': ['A verb with have, has or had in front.', 'I have learned. She had left.'],
    'progressive': ['A verb with -ing that shows something is still going on.', 'He is running.'],
    'passive voice': ['The thing the action happens to comes first.', 'The posters were displayed in the hallway.'],
    'conjunction': ['A joining word. It links two ideas.', 'and, but, so, because, although'],
    'transition': ['Linking words that carry your reader from one idea to the next.', 'Meanwhile, After that, However'],
    'linking word': ['Words that join your ideas together in order.', 'First, Then, Also, Finally'],
    'time word': ['Words that tell when something happens.', 'first, then, later, after that'],
    'preposition': ['A word that tells where or when.', 'under, behind, across, during'],
    'simple sentence': ['A sentence with one idea.', 'The dog barked.'],
    'compound': ['Two ideas joined with and, but or so.', 'The dog barked, and the cat ran away.'],
    'complex sentence': ['A main idea plus an extra idea, joined by a word like because, when or although.', 'The dog barked because it heard a noise.'],
    'topic sentence': ['The sentence that tells what the paragraph is about.', 'Penguins are amazing swimmers.'],
    'paragraph': ['A group of sentences about one idea. Start each one on a new line.', ''],
    'indented': ['The first line starts a little way in from the edge of the page.', ''],
    'introduction': ['The first part. It tells the reader what your writing is about.', ''],
    'conclusion': ['The last part. It wraps up your writing.', 'For these reasons…'],
    'dialogue': ['The words characters say out loud. Put them inside speech marks.', '“Let’s go,” said Mia.'],
    'quotation mark': ['The marks that go around the words someone says.', '“I’m ready!” shouted Tom.'],
    'apostrophe': ['This mark: ’ It shows something belongs to someone, or that letters are missing.', 'Mira’s key, don’t'],
    'possession': ['When something belongs to someone.', 'the fox’s tail'],
    'contraction': ['Two words squashed into one, with an apostrophe.', 'do not → don’t'],
    'semicolon': ['This mark: ; It joins two sentences that go closely together.', 'We were nervous; however, the results surprised us.'],
    'simile': ['Says one thing is like another, using like or as.', 'as fast as a rocket'],
    'metaphor': ['Says one thing is another, to paint a picture.', 'The gears were a forest of turning metal.'],
    'personification': ['Makes a thing act like a person.', 'The wind whispered.'],
    'figurative language': ['Words that paint a picture, like similes and metaphors.', 'Their leaves sparkled like tiny stars.'],
    'imagery': ['Words that help your reader see, hear or feel what is happening.', ''],
    'sensory detail': ['What you can see, hear, smell, taste or touch.', 'The attic smelled of old books.'],
    'rhetorical question': ['A question that makes the reader think. You do not expect an answer.', 'Wouldn’t you want a garden?'],
    'counterargument': ['What someone who disagrees might say, and your answer to it.', 'Some people think…, but…'],
    'opinion': ['What you think or believe.', 'I believe our school should have a garden.'],
    'anecdote': ['A very short true story that helps make your point.', ''],
    'comparison': ['Showing how two things are alike or different.', 'They are like…'],
    'hook': ['An exciting first sentence that grabs your reader.', ''],
    'foreshadowing': ['A small hint about something that will happen later.', ''],
    'symbolism': ['When an object stands for a big idea.', 'A lantern can stand for courage.'],
    'symbolic object': ['An object in your story that stands for a big idea.', 'A lantern can stand for courage.'],
    'subplot': ['A smaller story inside your main story.', ''],
    'twist': ['A surprise the reader did not see coming.', ''],
    'rising action': ['The middle part, where the problem gets bigger.', ''],
    'climax': ['The most exciting moment of the story.', ''],
    'resolution': ['The part where the problem gets solved.', ''],
    'pacing': ['How fast or slow your story moves.', ''],
    'perspective': ['Whose eyes we see things through.', ''],
    'tone': ['The feeling your writing gives.', 'friendly, serious, excited'],
    'voice': ['How your writing sounds. Your voice shows your feelings and who you are.', ''],
    'reflection': ['Thinking back on what happened and what you learned.', 'I learned that mistakes can help you improve.'],
    'interjection': ['A short word or two that shows a sudden feeling.', 'Wait! Oh no!'],
    'loaded vocabulary': ['Strong words that make your reader feel something.', 'essential, meaningful'],
    'stylistic device': ['A special trick writers use to guide the reader.', 'hooks, headings, bold words'],
    'topic-specific': ['Words that belong to your topic.', 'For turtles: shell, flippers, hatch'],
    'labelled diagram': ['A drawing with labels that name each part.', ''],
    'glossary': ['A list of tricky words and what they mean.', ''],
    'finger space': ['A gap between words, as wide as your finger.', ''],
    'BME': ['Beginning, Middle and End.', '']
  };
  var ALIAS = { 'vivid verb': 'strong verb', 'precise verb': 'strong verb', 'action verb': 'strong verb', 'passive': 'passive voice', 'sensory word': 'sensory detail' };
  var termKeys = Object.keys(GLOSSARY).filter(function (k) { return k !== 'paragraph'; }).concat(Object.keys(ALIAS)).sort(function (a, b) { return b.length - a.length; });
  var TERM_RE = new RegExp('\\b(' + termKeys.join('|') + ')(e?s)?\\b', 'gi');

  var STRIPS = {
    1: ['Add simple details or labels.', ['“I felt happy.”', '“The dog was big.”', '“We played tag.”'], ['Add one more thing you did.', 'Add a describing word.', 'Add how you felt.']],
    2: ['Add adjectives, feelings, or reasons.', ['“I was nervous because it was my first time.”', '“The cake was soft and sweet.”'], ['Add a reason using because.', 'Add a describing phrase.', 'Add what happened next.']],
    3: ['Add more detail, dialogue, or sensory detail.', ['“My hands were shaking as I opened the box.”', '“‘Come on!’ my brother shouted.”'], ['Add a sentence that shows, not tells.', 'Add dialogue.', 'Add a sensory detail.']],
    4: ['Add transitions, examples, or figurative language.', ['“For example, our group tested three different designs.”', '“The wind howled like a wolf.”'], ['Add a transition to connect your ideas.', 'Add an example to support your point.', 'Add a simile or metaphor.']],
    5: ['Add depth, explanation, or complex sentences.', ['“This experience taught me that leadership can be quiet but powerful.”', '“Although I was unsure at first, I decided to try again.”'], ['Add a reflection sentence.', 'Add a complex sentence using although or despite.', 'Add a sentence that explains why this matters.']]
  };

  /* ---------- small helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function termKey(w) { w = w.toLowerCase(); return ALIAS[w] || (GLOSSARY[w] ? w : (w === 'bme' ? 'BME' : null)); }
  function rich(s) {            // escaped text + tappable tricky words + drawn blanks
    return esc(s).replace(/_{3,}/g, '<span class="blank"></span>').replace(TERM_RE, function (m, w) {
      var k = termKey(w); return k ? '<button type="button" class="term" data-term="' + k + '">' + m + '</button>' : m;
    });
  }
  function pkgById(id) { for (var i = 0; i < DATA.packages.length; i++) if (DATA.packages[i].id === id) return DATA.packages[i]; return null; }

  var saved = { grade: 0, ticks: {}, stars: {} };
  try { var raw = JSON.parse(localStorage.getItem('writing-helper-v1') || 'null'); if (raw && typeof raw === 'object') { saved.grade = raw.grade || 0; saved.ticks = raw.ticks || {}; saved.stars = raw.stars || {}; } } catch (e) {}
  function save() { try { localStorage.setItem('writing-helper-v1', JSON.stringify(saved)); } catch (e) {} }

  var state = { route: '', tab: {}, spot: {}, openPoint: 0, acro: 'SMILE' };

  /* ---------- screens ---------- */
  function screenGrades() {
    return '<h1>Hi, writer! What grade are you in?</h1><p class="lead">Tap your grade to find help with your writing.</p><div class="grades">' +
      [1, 2, 3, 4, 5].map(function (g) { return '<a class="grade-btn g' + g + '" href="#g' + g + '"><b>' + g + '</b><span>Grade ' + g + '</span></a>'; }).join('') + '</div>';
  }

  function screenGrade(g) {
    var pk = DATA.packages.filter(function (p) { return p.grade === g; });
    return '<h1>What are you writing today?</h1><p class="lead">Grade ' + g + '. Pick one to see an example, sentence starters and a checklist.</p><div class="grid">' +
      pk.map(function (p) { var k = KINDS[p.kind];
        return '<a class="tile" href="#' + p.id + '"><span class="ico" aria-hidden="true">' + k.ico + '</span><span><b>' + k.name + '</b><small>' + k.blurb + '</small>' +
          (p.genre.toLowerCase().indexOf(k.name.toLowerCase()) < 0 ? '<small class="also">Your teacher may call it: ' + esc(p.genre) + '</small>' : '') + '</span></a>'; }).join('') +
      '</div><h2>More help</h2><div class="grid">' +
      tile('g' + g + '-grammar', '🧩', 'Grammar help', 'Nouns, verbs, capitals, punctuation and more.') +
      tile('fix-it', '🧰', 'Fix-it tools', 'Easy tricks to make your writing even better.') +
      tile('word-helper', '🔤', 'Word helper', 'What do tricky writing words mean?') +
      tile('poem', '🌈', 'Poem maker', 'Write an acrostic poem with any word.') +
      '</div><p class="foot"><a href="#grown-ups">Notes for grown-ups and teachers</a></p>';
  }
  function tile(href, ico, name, blurb) { return '<a class="tile" href="#' + href + '"><span class="ico" aria-hidden="true">' + ico + '</span><span><b>' + name + '</b><small>' + blurb + '</small></span></a>'; }
  function back(g) { return g ? '<a class="crumb" href="#g' + g + '">&larr; Back to Grade ' + g + '</a>' : '<a class="crumb" href="#grades">&larr; Pick a grade</a>'; }

  /* --- one kind of writing --- */
  function screenPackage(p) {
    var k = KINDS[p.kind], tab = state.tab[p.id] || 'example';
    var h = back(p.grade) + '<div class="band"><span class="ico" aria-hidden="true">' + k.ico + '</span><div><span class="tag">Grade ' + p.grade + ' · ' + esc(p.genre) + '</span><h1>' + k.name + '</h1><p>' + k.why + '</p></div></div>';
    h += '<div class="tabs" role="tablist" aria-label="Steps">' + TABS.map(function (t, i) {
      return '<button type="button" class="tab" role="tab" aria-selected="' + (t[0] === tab) + '" data-tab="' + t[0] + '"><span class="n">' + (i + 1) + '</span>' + t[1] + '</button>'; }).join('') + '</div>';
    h += '<div id="panel" role="tabpanel">' + panel(p, tab) + '</div>';
    var i = TABS.map(function (t) { return t[0]; }).indexOf(tab);
    if (i < TABS.length - 1) h += '<button type="button" class="next" data-tab="' + TABS[i + 1][0] + '">Next: ' + TABS[i + 1][1] + ' &rarr;</button>';
    return h;
  }
  function panel(p, tab) {
    if (tab === 'example') return panelExample(p);
    if (tab === 'page') return panelPage(p);
    if (tab === 'starters') return panelStarters(p);
    if (tab === 'check') return panelCheck(p);
    return panelChallenge(p);
  }

  /* Spot-it colours follow the editing-strip colour code: green = linking words, blue = talking, pink = feelings. */
  var LINKS = ['To begin with', 'In addition', 'As a result', 'For these reasons', 'For example', 'Because of this', 'After that', 'After lunch', 'After a short break', 'After gathering the data', 'After gathering this information', 'At first', 'At the end of the day', 'At the end of the trip', 'In the morning', 'In the end', 'In another flash', 'Even though', 'One reason', 'Another reason', 'Another important reason', 'As a final step', 'This time', 'On Monday morning', 'One \\w+ afternoon', 'First', 'Next', 'Then', 'Finally', 'Meanwhile', 'However', 'Although', 'Suddenly', 'Later', 'Despite', 'Therefore', 'Unfortunately', 'Surprisingly', 'Today', 'Yesterday', 'Before', 'Instead', 'Also', 'When', 'While', 'Now']
    .sort(function (a, b) { return b.length - a.length; });
  var LINK_RE = new RegExp('(^|[.!?”]\\s+|—)(' + LINKS.join('|') + ')(?=[\\s,])', 'g');
  var FEEL_RE = /\b(felt|feel|feeling|happy|happier|proud|worried|excited|nervous|amazed|inspired|frustrating|frustrated|curious|curiosity|calmer|confident|overwhelming|unsure|laughed|cheered|grinned|smiled|enjoy|enjoyed|love|loved|miss|wish|hope|satisfying|comforting|intimidating|rewarding|pounded|froze)\b/gi;
  function spotText(s, kind) {
    var t = s.replace(LINK_RE, '$1k$2').replace(FEEL_RE, 'f$1');
    if (kind === 'story') t = t.replace(/“[^”]*”/g, 't$&');
    return esc(t).replace(/(.)/g, '<mark class="hl hl-$1">').replace(//g, '</mark>');
  }
  function panelExample(p) {
    var ex = p.example, k = p.kind, body = '';
    if (ex.title) body += '<h3>' + esc(ex.title) + '</h3>';
    if (ex.date) body += '<p>' + esc(ex.date) + '</p>';
    if (ex.greeting) body += '<p>' + esc(ex.greeting) + '</p>';
    ex.blocks.forEach(function (b) {
      if (b.t === 'p') body += '<p>' + spotText(b.text, k) + '</p>';
      else if (b.t === 'h') body += '<h4>' + esc(b.text) + '</h4>';
      else body += '<' + b.t + '>' + b.items.map(function (i) { return '<li>' + spotText(i, k) + '</li>'; }).join('') + '</' + b.t + '>';
    });
    if (ex.closing) body += '<p class="sign">' + esc(ex.closing) + '<br>' + esc(ex.name) + '</p>';
    var sp = state.spot[p.id] || {}, btns = '';
    [['k', 'Linking words', '#b8efc4'], ['t', 'Talking', '#bfdcff'], ['f', 'Feelings', '#ffc9dd']].forEach(function (b) {
      if (body.indexOf('hl-' + b[0]) >= 0) btns += '<button type="button" aria-pressed="' + !!sp[b[0]] + '" data-spot="' + b[0] + '" style="--hc:' + b[2] + '">' + b[1] + '</button>';
    });
    var cls = 'paper' + ['k', 't', 'f'].map(function (c) { return sp[c] ? ' show-' + c : ''; }).join('');
    return '<div class="card"><h2>Read this example first</h2><p>This is what great Grade ' + p.grade + ' writing can look like. Read it, then write your own.</p>' +
      (btns ? '<div class="spot"><span>Spot it! Tap to light up:</span>' + btns + '</div>' : '') + '</div><div class="' + cls + '" id="paper">' + body + '</div>';
  }
  function panelPage(p) {
    return p.page.map(function (s) {
      return '<div class="card"><h2>' + esc(s.title) + '</h2><ul class="dots">' + s.items.map(function (i) { return '<li>' + rich(i) + '</li>'; }).join('') + '</ul></div>'; }).join('');
  }
  function traitHead(t) {
    var T = TRAITS[t.key];
    return '<h2><span class="emo" aria-hidden="true">' + T.ico + '</span>' + T.name + '</h2><p class="q">' + T.q + '</p>';
  }
  function panelStarters(p) {
    return '<p class="lead">Stuck? Borrow one of these to get going. Fill each blank with your own words.</p>' + p.traits.map(function (t) {
      var conv = t.key === 'conventions';
      var goal = t.goal || 'Use capitals, punctuation and spelling the right way.';
      return '<div class="card">' + traitHead(t) + '<p class="goal"><b>Your goal:</b> ' + rich(goal) + '</p>' + (conv ? '<p class="sub">Rules to remember as you write</p>' : '') + '<ul class="plain">' + t.starters.map(function (s) {
        if (s.k === 's') return '<li class="starter">' + rich(s.text) + '</li>';
        if (s.k === 'l') return '<li class="row-l">' + (s.label ? '<span class="lab">' + rich(s.label) + '</span>' : '') + s.opts.map(function (o) { return '<span class="chip">' + rich(o) + '</span>'; }).join('') + '</li>';
        return '<li class="row-l"><span class="lab soft">' + rich(s.label) + ':</span>' + s.items.map(function (o) { return '<span class="chip">' + rich(o) + '</span>'; }).join('') + '</li>';
      }).join('') + '</ul></div>'; }).join('');
  }
  function row(text, on, i, star) {
    return '<li class="check' + (star ? ' star' : '') + '" role="checkbox" tabindex="0" aria-checked="' + on + '" data-i="' + i + '"><span class="box" aria-hidden="true">' + (star ? '★' : '✓') + '</span><span>' + rich(text) + '</span></li>';
  }
  function panelCheck(p) {
    var done = saved.ticks[p.id] || [], n = 0, total = 0, h = '';
    p.traits.forEach(function (t) {
      h += '<div class="card">' + traitHead(t) + '<ul class="plain" data-list="ticks">' + t.checks.map(function (c) { var i = total++; if (done.indexOf(i) >= 0) n++; return row(c, done.indexOf(i) >= 0, i); }).join('') + '</ul></div>';
    });
    return '<div class="card"><h2>Check my work</h2><p>Read your writing out loud. Tick each box when it is true.</p><div class="progress"><div class="track"><div class="fill" style="width:' + (100 * n / total) + '%"></div></div><b>' + n + ' of ' + total + '</b><button type="button" class="link-btn" data-clear="ticks">Clear my ticks</button></div></div>' +
      (n === total ? '<p class="done-msg">⭐ You checked everything! Your writing is ready to share.</p>' : '') + h;
  }
  function panelChallenge(p) {
    var done = saved.stars[p.id] || [];
    return '<div class="card"><h2>Want a challenge?</h2><p>These are for high flyers. Pick one to try, then tap its star.</p><ul class="plain" data-list="stars">' +
      p.challenge.map(function (c, i) { return row(c, done.indexOf(i) >= 0, i, true); }).join('') + '</ul></div>' +
      '<p class="lead">Finished? <a href="#fix-it">Try the fix-it tools</a> to make your writing even better.</p>';
  }

  /* --- grammar --- */
  function screenGrammar(g) {
    var gd = DATA.grammar.filter(function (x) { return x.grade === g; })[0];
    return back(g) + '<div class="band"><span class="ico" aria-hidden="true">🧩</span><div><span class="tag">Grade ' + g + '</span><h1>Grammar help</h1><p>Tap a topic to open it.</p></div></div>' +
      gd.points.map(function (pt, i) {
        return '<details class="fold"' + (i === state.openPoint ? ' open' : '') + '><summary><span class="n">' + (i + 1) + '</span>' + esc(pt.name) + '</summary><div class="in">' + pt.secs.map(function (s) {
          var h = '<p class="sub">' + s.title + '</p>';
          h += s.paras.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('');
          if (s.chips.length) h += '<div class="chips">' + s.chips.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>';
          if (s.items.length) h += '<ul class="dots' + (s.kind === 'uses' ? ' uses' : '') + '">' + s.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
          return h; }).join('') + '</div></details>'; }).join('');
  }

  /* --- fix-it tools (kid version of the teaching tips) --- */
  function letters(rows) { return '<div class="letters">' + rows.map(function (r) { return '<div class="letter"><b>' + r[0] + '</b><i>' + r[1] + '</i>' + r[2] + '</div>'; }).join('') + '</div>'; }
  function screenFix() {
    var g = saved.grade || 0, s = STRIPS[g || 3];
    return back(g) + '<div class="band"><span class="ico" aria-hidden="true">🧰</span><div><h1>Fix-it tools</h1><p>Good writers go back and make their writing better. Pick one tool and try it.</p></div></div>' +
      '<div class="card"><h2>COPS <span class="badge">Grades 1–3</span></h2><p>Check your writing four times. Look for one thing each time.</p>' + letters([
        ['C', 'Capitals', 'Do my sentences and names start with a capital?'], ['O', 'Organization', 'Is my writing in a good order?'], ['P', 'Punctuation', 'Does every sentence end with . ? or !'], ['S', 'Spelling', 'Did I check my spelling?']]) + '</div>' +
      '<div class="card"><h2>ARMS <span class="badge">Grades 3–5</span></h2><p>Four ways to make a draft better.</p>' + letters([
        ['A', 'Add', 'Add a detail, a feeling or an example.'], ['R', 'Remove', 'Take out parts you do not need.'], ['M', 'Move', 'Move a sentence to a better place.'], ['S', 'Substitute', 'Swap a boring word for a better one.']]) + '</div>' +
      '<div class="card"><h2>SWAG <span class="badge">Grades 3–5</span></h2><p><b>S</b>tart <b>W</b>ith <b>A</b> <b>G</b>rabber. Make your first sentence grab your reader so they want to read on.</p></div>' +
      '<div class="card"><h2>Glow and grow</h2><ul class="plain"><li class="strip" style="background:#fff6c2">✨ <b>Glow:</b> find one thing you did well. Highlight it.</li><li class="strip" style="background:#d7f3ec">🌱 <b>Grow:</b> pick one thing to do better next time.</li></ul><p>Then finish these sentences:</p><ul class="plain"><li class="starter">I improved by <span class="blank"></span>.</li><li class="starter">Next time I will <span class="blank"></span>.</li></ul></div>' +
      '<div class="card"><h2>Editing strips</h2><p>You do not have to write it all again! Write your new sentence on a strip of paper and stick it onto your draft.</p><ol class="dots" style="list-style:decimal"><li>Write your draft.</li><li>Pick <b>one</b> thing to make better.</li><li>Write the new sentence on a strip.</li><li>Tape or glue it where it belongs.</li><li>Label it, like “Added detail” or “Stronger verb”.</li><li>Say how it helped: “This made my writing clearer because…”</li></ol>' +
        '<p class="sub">Use a colour for each kind of strip</p><div class="chips"><span class="strip" style="background:#fff3a0">Yellow = details</span><span class="strip" style="background:#bfdcff">Blue = dialogue</span><span class="strip" style="background:#b8efc4">Green = transitions</span><span class="strip" style="background:#ffc9dd">Pink = feelings</span></div>' +
        '<p class="sub">Strip ideas for Grade ' + (g || 3) + '</p><p>' + rich(s[0]) + '</p><ul class="dots">' + s[2].map(function (x) { return '<li>' + rich(x) + '</li>'; }).join('') + '</ul><div class="chips">' + s[1].map(function (x) { return '<span class="strip" style="background:#fff3a0">' + esc(x) + '</span>'; }).join('') + '</div></div>' +
      '<div class="card"><h2>Quick fixes to try</h2><ul class="dots">' + ['Add a stronger verb.', 'Fix a punctuation error.', 'Add a detail to your ending.', 'Add transitions.', 'Check your capitals.', 'Read it aloud. Does it flow?'].map(function (x) { return '<li>' + rich(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h2>Help a partner</h2><p>Read your partner’s writing. Then use these kind sentence starters.</p><ul class="plain">' + ['I noticed…', 'I wondered…', 'Have you considered…?', 'One thing you did well was…', 'One thing to try next is…'].map(function (x) { return '<li class="starter">' + x + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h2>Pick a goal</h2><p>Choose one goal. Write it on a sticky note and keep it where you can see it.</p><p class="sub">Grades 1–2</p><ul class="plain">' + ['I will use finger spaces.', 'I will add one describing word.', 'I will start my sentences with a capital.'].map(function (x) { return '<li class="starter">' + rich(x) + '</li>'; }).join('') +
        '</ul><p class="sub">Grades 3–5</p><ul class="plain">' + ['I will use transitions between paragraphs.', 'I will make my writing clearer by adding examples.', 'I will check dialogue punctuation.'].map(function (x) { return '<li class="starter">' + rich(x) + '</li>'; }).join('') + '</ul></div>';
  }

  function screenWords() {
    return back(saved.grade) + '<div class="band"><span class="ico" aria-hidden="true">🔤</span><div><h1>Word helper</h1><p>Tricky writing words and what they mean. You can also tap any dotted word in the helper.</p></div></div><div class="card"><ul class="plain">' +
      Object.keys(GLOSSARY).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; }).map(function (k) {
        return '<li><b>' + esc(k) + '</b>: ' + esc(GLOSSARY[k][0]) + (GLOSSARY[k][1] ? ' <span class="uses">Like this: ' + esc(GLOSSARY[k][1]) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>';
  }

  function acroRows() {
    return state.acro.split('').map(function (ch, i) { return '<div><b aria-hidden="true">' + esc(ch) + '</b><input type="text" id="acro-' + i + '" aria-label="A line that starts with ' + esc(ch) + '" placeholder="' + esc(ch) + '…"></div>'; }).join('');
  }
  function screenPoem() {
    return back(saved.grade) + '<div class="band"><span class="ico" aria-hidden="true">🌈</span><div><h1>Poem maker</h1><p>In an acrostic poem, the first letters of the lines spell a word.</p></div></div>' +
      '<div class="card"><h2>Here is one for SMILE</h2><div class="acro">' + [['S', 'unlight warms my face'], ['M', 'y heart feels bright'], ['I', 'nside, a happy spark grows'], ['L', 'aughter dances around me'], ['E', 'very moment feels lighter']].map(function (l) { return '<div><b>' + l[0] + '</b><span>' + l[0] + l[1] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="card"><h2>Now make your own</h2><label for="acro-word">Type a word. It could be your name!</label><input class="word-in" type="text" id="acro-word" maxlength="12" value="' + esc(state.acro) + '" autocomplete="off"><div class="acro" id="acro-rows">' + acroRows() + '</div><p class="uses">When you are happy with your poem, copy it into your book. This page does not save it.</p></div>';
  }

  function screenNotes() {
    return back(saved.grade) + '<div class="band"><span class="ico" aria-hidden="true">👩‍🏫</span><div><h1>Notes for grown-ups</h1><p>Teaching tips from the original Writing Continuum.</p></div></div>' +
      DATA.notes.map(function (n, i) {
        var h = '', open = false;
        n.body.forEach(function (b) {
          if (b.t === 'b') { if (!open) { h += '<ul class="dots">'; open = true; } h += '<li>' + esc(b.text) + '</li>'; return; }
          if (open) { h += '</ul>'; open = false; }
          h += b.t === 'h' ? '<p class="sub">' + esc(b.text) + '</p>' : '<p>' + esc(b.text) + '</p>';
        });
        return '<details class="fold"' + (i === 0 ? ' open' : '') + '><summary>' + esc(n.title) + '</summary><div class="in">' + h + (open ? '</ul>' : '') + '</div></details>'; }).join('');
  }

  /* ---------- search ---------- */
  var INDEX = [];
  DATA.packages.forEach(function (p) {
    var where = 'Grade ' + p.grade + ' ' + KINDS[p.kind].name;
    function add(tab, what, text) { INDEX.push({ g: p.grade, label: where + ' · ' + what, text: text, route: p.id, tab: tab }); }
    var ex = p.example; if (ex.title) add('example', 'Example', ex.title);
    ex.blocks.forEach(function (b) { (b.items || [b.text]).forEach(function (t) { add('example', 'Example', t); }); });
    p.traits.forEach(function (t) {
      var T = TRAITS[t.key].name;
      t.starters.forEach(function (s) { add('starters', T + ' starter', s.k === 's' ? s.text : s.label + ': ' + (s.opts || s.items).join(' / ')); });
      t.checks.forEach(function (c) { add('check', T + ' checklist', c); });
    });
    p.page.forEach(function (s) { s.items.forEach(function (i) { add('page', s.title, i); }); });
    p.challenge.forEach(function (c) { add('challenge', 'Challenge', c); });
  });
  DATA.grammar.forEach(function (gd) { gd.points.forEach(function (pt, i) {
    var texts = [pt.name]; pt.secs.forEach(function (s) { texts = texts.concat(s.paras, s.chips, s.items); });
    texts.forEach(function (t) { INDEX.push({ g: gd.grade, label: 'Grade ' + gd.grade + ' Grammar · ' + pt.name, text: t, route: 'g' + gd.grade + '-grammar', open: i }); });
  }); });
  Object.keys(GLOSSARY).forEach(function (k) { INDEX.push({ g: 0, label: 'Word helper', text: k + ': ' + GLOSSARY[k][0], route: 'word-helper' }); });

  var lastHits = [];
  function screenSearch(q) {
    var ql = q.toLowerCase(), hits = INDEX.filter(function (e) { return e.text.toLowerCase().indexOf(ql) >= 0; }), mine = saved.grade;
    hits.sort(function (a, b) { return (b.g === mine || b.g === 0) - (a.g === mine || a.g === 0); });
    lastHits = hits.slice(0, 40);
    var re = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return '<h1>' + (hits.length ? hits.length + (hits.length === 1 ? ' match' : ' matches') + ' for “' + esc(q) + '”' : 'No matches for “' + esc(q) + '”') + '</h1>' +
      (hits.length ? (hits.length > 40 ? '<p class="lead">Here are the first 40' + (mine ? ', with Grade ' + mine + ' first' : '') + '.</p>' : '') : '<p class="lead">Check your spelling, or try a shorter word like “verb” or “ending”.</p>') +
      lastHits.map(function (e, i) { var t = e.text.length > 150 ? e.text.slice(0, 150) + '…' : e.text;
        return '<a class="result g' + (e.g || saved.grade || 1) + '" href="#' + e.route + '" data-hit="' + i + '"><b>' + esc(e.label) + '</b>' + esc(t).replace(re, '<mark>$1</mark>') + '</a>'; }).join('');
  }

  /* ---------- router ---------- */
  function render() {
    var r = state.route, m, html, g = saved.grade, q = document.getElementById('q').value.trim();
    if (q.length >= 2) html = screenSearch(q);
    else if ((m = /^g([1-5])$/.exec(r))) { g = saved.grade = +m[1]; save(); html = screenGrade(g); }
    else if ((m = /^g([1-5])-grammar$/.exec(r))) { g = saved.grade = +m[1]; save(); html = screenGrammar(g); }
    else if (pkgById(r)) { var p = pkgById(r); g = saved.grade = p.grade; save(); html = screenPackage(p); }
    else if (r === 'fix-it') html = screenFix();
    else if (r === 'word-helper') html = screenWords();
    else if (r === 'poem') html = screenPoem();
    else if (r === 'grown-ups') html = screenNotes();
    else { state.route = 'grades'; html = screenGrades(); }
    document.body.className = g ? 'g' + g : '';
    var chip = document.getElementById('grade-chip');
    chip.hidden = !g || state.route === 'grades'; chip.textContent = 'Grade ' + g + ' · change';
    document.getElementById('brand').setAttribute('href', g ? '#g' + g : '#grades');
    view.innerHTML = html;
  }
  function go(route, opts) {
    opts = opts || {};
    if (opts.tab) state.tab[route] = opts.tab;
    state.openPoint = opts.open || 0;
    state.route = route;
    document.getElementById('q').value = '';
    closeSheet();
    try { if (location.hash.slice(1) !== route) location.hash = route; } catch (e) {}
    render();
    window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== state.route) go(h); });

  /* ---------- clicks and keys ---------- */
  function toggleRow(li) {
    var list = li.parentNode.getAttribute('data-list'), id = state.route, store = saved[list], i = +li.getAttribute('data-i');
    var arr = store[id] || (store[id] = []), at = arr.indexOf(i);
    if (at >= 0) arr.splice(at, 1); else arr.push(i);
    save();
    var y = window.scrollY; render(); window.scrollTo(0, y);
    var again = view.querySelector('[data-list="' + list + '"] [data-i="' + i + '"]'); if (again) again.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('.term'))) { openSheet(el); return; }
    if ((el = t.closest('a[href^="#"]'))) {
      e.preventDefault();
      var hit = el.getAttribute('data-hit'), h = hit !== null ? lastHits[+hit] : null;
      go(el.getAttribute('href').slice(1), h ? { tab: h.tab, open: h.open } : null); return;
    }
    if ((el = t.closest('[data-tab]'))) { state.tab[state.route] = el.getAttribute('data-tab'); var top = el.classList.contains('next'); render(); if (top) { var tabs = view.querySelector('.tabs'); if (tabs) tabs.scrollIntoView(); } var sel = view.querySelector('.tab[aria-selected="true"]'); if (sel) sel.focus({ preventScroll: true }); return; }
    if ((el = t.closest('[data-spot]'))) { var sp = state.spot[state.route] || (state.spot[state.route] = {}), c = el.getAttribute('data-spot'); sp[c] = !sp[c]; el.setAttribute('aria-pressed', sp[c]); document.getElementById('paper').classList.toggle('show-' + c, sp[c]); return; }
    if ((el = t.closest('[data-clear]'))) { delete saved.ticks[state.route]; save(); render(); return; }
    if ((el = t.closest('.check'))) { toggleRow(el); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
    if ((e.key === ' ' || e.key === 'Enter') && e.target.classList && e.target.classList.contains('check')) { e.preventDefault(); toggleRow(e.target); }
  });
  var timer;
  document.getElementById('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { render(); window.scrollTo(0, 0); }, 180); });
  document.getElementById('search-form').addEventListener('submit', function (e) { e.preventDefault(); render(); });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'acro-word') return;
    state.acro = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 12);
    document.getElementById('acro-rows').innerHTML = acroRows();
  });

  /* ---------- tricky-word pop-up ---------- */
  var lastTerm = null;
  function openSheet(btn) {
    var k = btn.getAttribute('data-term'), d = GLOSSARY[k]; if (!d) return;
    lastTerm = btn;
    document.getElementById('sheet-term').textContent = k;
    document.getElementById('sheet-def').textContent = d[0];
    document.getElementById('sheet-eg').textContent = d[1] ? 'Like this: ' + d[1] : '';
    document.getElementById('sheet').hidden = false;
    document.getElementById('sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    var s = document.getElementById('sheet'); if (s.hidden) return;
    s.hidden = true; if (lastTerm && document.body.contains(lastTerm)) lastTerm.focus({ preventScroll: true }); lastTerm = null;
  }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);

  state.route = location.hash.slice(1) || (saved.grade ? 'g' + saved.grade : 'grades');
  render();
})();
</script>
</body>
</html>
